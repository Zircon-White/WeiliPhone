  }

  /* ---------------- 知识卡数据 ---------------- */
  function knowledgeState() {
    var raw = Settings.get(K_KEY, null);
    var st = { at: 0, cards: [], read: {}, idx: 0 };
    if (raw && typeof raw === 'object') {
      if (Object.prototype.toString.call(raw.cards) === '[object Array]') st.cards = raw.cards.slice(0, 20);
      if (raw.read && typeof raw.read === 'object') st.read = raw.read;
      st.at = Number(raw.at) || 0;
      st.idx = clamp(Number(raw.idx) || 0, 0, Math.max(0, st.cards.length - 1));
    }
    return st;
  }
  function knowledgeSave(st) {
    Settings.set(K_KEY, { at: st.at, cards: st.cards, read: st.read, idx: st.idx });
  }
  function knowledgeReadCount() {
    var st = knowledgeState(), n = 0;
    for (var i = 0; i < st.cards.length; i++) if (st.read[i]) n++;
    return n;
  }
  function knowledgeAllRead() {
    var st = knowledgeState();
    return st.cards.length > 0 && knowledgeReadCount() >= st.cards.length;
  }
  function knowledgeGo(delta) {
    var st = knowledgeState();
    if (!st.cards.length) {
      if (kBusy) return phone.toast('正在联网取知识卡，稍等一下');
      return knowledgeGenerate(false);
    }
    kExpanded = false;
    var i = st.idx + delta;
    if (i < 0) i = 0;
    if (i >= st.cards.length) {
      if (knowledgeAllRead()) return knowledgeGenerate(true);
      phone.toast('这一组还有 ' + (st.cards.length - knowledgeReadCount()) + ' 张没看完，全部读完后才会生成下一组', 'bad');
      return null;
    }
    st.idx = i;
    knowledgeSave(st);
    renderKnowledgeCard();
    return st;
  }
  /** 把一条检索结果整理成一张知识卡：标题、摘要都裁剪过，避免整页正文糊进卡片 */
  function makeCard(cat, it) {
    it = it || {};
    var full = normText(it.snippet);
    var summary = trimText(full, K_SUMMARY_MAX);
    var card = {
      cat: String(cat || '知识').slice(0, 8),
      title: trimText(normText(it.title).replace(/\n+/g, ' '), K_TITLE_MAX) || '知识卡',
      summary: summary,
      url: String(it.url || ''),
      src: it.url ? hostOf(it.url) : '模型生成（未联网）'
    };
    if (full.length > summary.length) card.full = full.slice(0, K_FULL_MAX);
    return card;
  }

  /** 判断两张卡是不是同一份内容（标题 + 摘要去掉空白后比较） */
  function cardKey(c) {
    return (String(c.title || '') + '|' + String(c.summary || '')).replace(/\s+/g, '').slice(0, 240);
  }
  function cardUrl(c) {
    return String((c && c.url) || '').split('#')[0].split('?')[0];
  }

  /* ---------------- 跨组去重：记住已经给用户看过的卡 ---------------- */
  function knowledgeSeen() {
    var raw = Settings.get(K_SEEN_KEY, []);
    return Object.prototype.toString.call(raw) === '[object Array]' ? raw : [];
  }
  function knowledgeSeenSets() {
    var keys = {}, urls = {};
    knowledgeSeen().forEach(function (it) {
      if (!it) return;
      if (it.k) keys[it.k] = 1;
      if (it.u) urls[it.u] = 1;
    });
    return { keys: keys, urls: urls };
  }
  function knowledgeMarkSeen(cards) {
    var list = knowledgeSeen();
    (cards || []).forEach(function (c) {
      list.push({ k: String(c.k || cardKey(c)).slice(0, 60), u: String(c.u || cardUrl(c)), at: Date.now() });
    });
    Settings.set(K_SEEN_KEY, list.slice(-K_SEEN_MAX));
  }
  /** 这一组的话题查询词：每组换一种说法，避免每次查到同一批内容 */
  function knowledgeTopics() {
    var round = Number(Settings.get(K_ROUND_KEY, 0)) || 0;
    return K_TOPICS.map(function (t) {
      var qs = t.qs || [t.q];
      return { cat: t.cat, o: t.o, q: qs[round % qs.length] };
    });
  }
  function knowledgeNextRound() {
    var round = (Number(Settings.get(K_ROUND_KEY, 0)) || 0) + 1;
    Settings.set(K_ROUND_KEY, round);
    return round;
  }

  /**
   * 从「每个话题一组候选」里挑出这一组的 10 张卡。
   * 两层挑选：
   *   ① 同一组内不重复，并且尽量避开搜索接口的「万能页」（被多数话题同时命中的那一页）；
   *   ② 跨组也不重复 —— 已经给用户看过的内容（seen）排到最后，实在没新内容才会复用并打上 repeat 标记。
   */
  function chooseCards(board, seen) {
    seen = seen || { keys: {}, urls: {} };
    var list = (board || []).slice();
    /* 同一话题内的候选先去重 */
    list.forEach(function (b) {
      var dup = {};
      b.cands = (b.cands || []).filter(function (c) {
        var k = cardKey(c), u = cardUrl(c);
        if (dup[k] || (u && dup['u:' + u])) return false;
        dup[k] = 1;
        if (u) dup['u:' + u] = 1;
        return true;
      });
    });
    /* 统计「这条内容被多少个话题命中过」 */
    var freq = {};
    function bump(k) { if (k) freq[k] = (freq[k] || 0) + 1; }
    list.forEach(function (b) {
      b.cands.forEach(function (c) {
        bump(cardKey(c));
        var u = cardUrl(c);
        if (u) bump('u:' + u);
      });
    });
    var maxFreq = Math.max(2, Math.ceil(list.length / 3));
    function weight(c) {
      var u = cardUrl(c);
      return Math.max(freq[cardKey(c)] || 0, u ? (freq['u:' + u] || 0) : 0);
    }
    function isSeen(c) {
      return !!(seen.keys[cardKey(c)] || (cardUrl(c) && seen.urls[cardUrl(c)]));
    }
    list.sort(function (a, b) { return (Number(a.t.o) || 0) - (Number(b.t.o) || 0); });

    var usedKey = {}, usedUrl = {}, usedTopic = {}, out = [];
    list.forEach(function (b) {
      /* 一个话题只出一张卡：补检索会让同一话题在候选表里出现多次 */
      if (usedTopic[b.t.o]) return;
      var best = null, i, c;
      function free(c2) {
        var k = cardKey(c2), u = cardUrl(c2);
        return !usedKey[k] && !(u && usedUrl[u]);
      }
      /* 第一档：全新内容 + 不是万能页 */
      for (i = 0; i < b.cands.length; i++) {
        c = b.cands[i];
        if (!free(c) || isSeen(c) || weight(c) >= maxFreq) continue;
        best = c;
        break;
      }
      /* 第二档：全新内容（允许是万能页） */
      if (!best) {
        for (i = 0; i < b.cands.length; i++) {
          c = b.cands[i];
          if (!free(c) || isSeen(c)) continue;
          best = c;
          break;
        }
      }
      /* 第三档：实在没有新内容，复用以前看过的（会被标记，必要时整组不进存档） */
      if (!best) {
        for (i = 0; i < b.cands.length; i++) {
          c = b.cands[i];
          if (!free(c)) continue;
          best = c;
          break;
        }
      }
      if (!best) return;
      /* 记下这张卡的「原始身份」，润色之后还能用于跨组去重 */
      best.k = cardKey(best).slice(0, 60);
      best.u = cardUrl(best);
      best.repeat = isSeen(best) ? 1 : 0;
      usedKey[cardKey(best)] = 1;
      if (best.u) usedUrl[best.u] = 1;
      usedTopic[b.t.o] = 1;
      out.push(best);
    });
    return out;
  }

  /**
   * 用对话模型把每张卡润色成「短标题 + 60~100 字摘要」。
   * 没绑对话模型、开关关掉、或调用失败时，就沿用裁剪过的原文。
   */
  function polishCards(picked, board) {
    var chat = apiResolve('chat');
    if (!chat || Settings.get('knowledgePolish', true) !== true) return Promise.resolve(picked);
    var blocks = [];
    picked.forEach(function (c, i) {
      var b = null, j;
      for (j = 0; j < board.length; j++) if (board[j].t && board[j].t.o === c.o) { b = board[j]; break; }
      var cands = b ? (b.cands || []).slice(0, 2) : [];
      var body = cands.map(function (x) {
        return '· ' + (x.title || '') + '：' + normText(x.full || x.summary).slice(0, 400);
      }).join('\n');
      blocks.push('[' + i + '] 话题：' + c.cat + '（检索词：' + (c.q || '') + '）\n' + (body || '· ' + c.summary));
    });
    if (!blocks.length) return Promise.resolve(picked);

    var sys = '你是中文知识卡编辑。只输出 JSON，不要解释，不要 markdown 围栏。';
    var user = '下面是联网检索到的原始材料，请为每个编号改写一张知识卡：\n' +
      '- title：不超过 20 字的标题，具体一点，别用「关于……的介绍」这种空话\n' +
      '- summary：60~100 字的说明，一到三句话，通顺、具体，保留关键信息（时间、数字、结论）\n' +
      '- 不要出现「根据搜索结果」「本文介绍了」「数据显示」这类废话，不要 Markdown 符号，不要换行\n' +
      '- 编号必须和输入一一对应，不要增删\n' +
      '只输出：{"cards":[{"i":0,"title":"...","summary":"..."}]}\n\n' + blocks.join('\n\n');

    return apiChat(chat, [{ role: 'system', content: sys }, { role: 'user', content: user }], { json: true })
      .then(function (text) {
        var o = parseLooseJson(text);
        var arr = (o && (o.cards || o.items || o.data)) || [];
        if (Object.prototype.toString.call(arr) !== '[object Array]') return picked;
        var byI = {};
        arr.forEach(function (c) {
          var i = Number(c && c.i);
          if (!isFinite(i) || i < 0 || i >= picked.length || byI[i]) return;
          byI[i] = c;
        });
        var n = 0;
        var out = picked.map(function (c, i) {
          var p = byI[i];
          if (!p) return c;
          var title = normText(p.title).replace(/\n+/g, ' ').trim();
          var summary = normText(p.summary);
          if (!summary || summary.length < 10) return c;
          var card = makeCard(c.cat, { title: title || c.title, snippet: summary, url: c.url });
          /* 润色后仍保留可展开的原始材料 */
          var raw = normText(c.full || c.summary);
          if (raw && raw.length > card.summary.length) card.full = raw.slice(0, K_FULL_MAX);
          card.q = c.q; card.o = c.o; card.k = c.k; card.u = c.u; card.repeat = c.repeat;
          card.polished = 1;
          n++;
          return card;
        });
        if (!n) return picked;
        return out;
      })
      .catch(function (e) {
        console.warn('[PhoneShell] 知识卡润色失败，改用裁剪后的原文：', e);
        return picked;
      });
  }

  function knowledgeGenerate(force) {
    var st = knowledgeState();
    if (kBusy) return Promise.resolve(st);
    if (st.cards.length && !force) return Promise.resolve(st);
    var search = apiResolve('search');
    var chat = apiResolve('chat');
    /* 用对话模型「编」知识卡默认是关的：没有联网检索接口时应该先让用户去配，而不是悄悄生成一堆不联网的内容 */
    var allowModel = Settings.get('knowledgeFallback', false) === true;
    if (!search && !(allowModel && chat)) {
      kErr = chat
        ? '还没有配置「联网检索」接口，知识卡需要它才能联网取内容。请到「设置 → API 管理」新增一个（Tavily / 博查 / Serper）并绑定；' +
          '如果只是想先看看效果，可以在那里打开「用对话模型生成知识卡（不联网）」开关。'
        : '还没有配置任何接口。请到「设置 → API 管理」新增一个联网检索接口（Tavily / 博查 / Serper 等）并绑定，知识卡才能联网更新。';
      renderKnowledgeCard();
      return Promise.resolve(st);
    }
    kBusy = true; kErr = ''; kGot = 0; kTotal = K_TOPICS.length;
    renderKnowledgeCard();
    var board = [], fails = [], topics = knowledgeTopics();
    var seen = knowledgeSeenSets();
    knowledgeNextRound();     /* 换一组就换一种检索说法 */

    /* 每个话题把候选都收进来（先不急着选）：搜索接口对相近查询经常返回同一页，
       只看第一条会让整组知识卡长得一模一样。 */
    function collect(t, items) {
      var cands = [];
      (items || []).forEach(function (it) {
        var c = makeCard(t.cat, it);
        if (!c.summary && !c.title) return;
        c.q = t.q;
        c.o = t.o;
        cands.push(c);
      });
      if (cands.length) board.push({ t: t, cands: cands });
    }

    function runTopics(list) {
      var idx = 0;
      function worker() {
        if (idx >= list.length) return Promise.resolve();
        var t = list[idx++];
        var job = search ? apiSearch(search, t.q, { count: 3 }) : Promise.resolve(null);
        return job.then(function (res) { collect(t, res && res.items); kGot++; })
          .catch(function (e) { fails.push(t.cat + '：' + (e && e.message ? e.message : e)); })
          .then(function () { renderKnowledgeCard(); return worker(); });
      }
      var pool = [];
      for (var i = 0; i < Math.min(3, list.length); i++) pool.push(worker());
      return Promise.all(pool);
    }

    return runTopics(topics).then(function () {
      var picked = chooseCards(board, seen);
      /* 只有「仍然空着」的话题才补检索（换个说法），凑不满 10 张时才有这一步 */
      var have = {};
      picked.forEach(function (c) { have[c.o] = 1; });
      var extra = topics.filter(function (t) { return !have[t.o]; }).map(function (t) {
        return { cat: t.cat, q: t.q + ' 最新进展 相关报道', o: t.o };
      });
      if (!search || !picked.length || !extra.length) return picked;
      kGot = 0; kTotal = extra.length;
      return runTopics(extra).then(function () { return chooseCards(board, seen); });
    }).then(function (cards) {
      if (!cards || !cards.length) return null;
      /* 全网都是旧内容时，不要拿一模一样的一组去覆盖上一组 */
      var repeats = 0;
      cards.forEach(function (c) { if (c.repeat) repeats++; });
      if (repeats >= cards.length && knowledgeState().cards.length) {
        kBusy = false;
        kErr = '检索接口这次没有返回新内容（和上一组基本重复）。可以过一会儿再试，或换一个联网检索接口。';
        renderKnowledgeCard();
        phone.toast('这次没取到新内容，已保留上一组', 'bad');
        return knowledgeState();
      }
      return polishCards(cards, board).then(function (out) { return finishGroup(out, fails); });
    }).then(function (done) {
      if (done) return done;
      if (!(allowModel && chat)) {
        kBusy = false;
        kErr = fails.length
          ? ('联网检索失败：' + fails[0] + '（可以在「设置 → API 管理」里测一下这个接口）')
          : '联网检索没有返回任何内容，可以稍后重试。';
        renderKnowledgeCard();
        return knowledgeState();
      }
      if (fails.length) kErr = '联网检索没取到内容（' + fails[0] + '），改用对话模型生成这一组…';
      return modelCards(chat).then(function (list) { return finishGroup(list, []); })
        .catch(function (e) { kBusy = false; kErr = '生成知识卡失败：' + (e && e.message ? e.message : e); renderKnowledgeCard(); return knowledgeState(); });
    });
  }
  function finishGroup(list, fails) {
    kBusy = false;
    var clean = (list || []).filter(function (c) { return c && (c.title || c.summary); }).slice(0, 10);
    /* 按话题顺序排好，免得并发取卡时顺序乱跳 */
    clean.sort(function (a, b) { return (Number(a.o) || 0) - (Number(b.o) || 0); });
    if (!clean.length) {
      kErr = '这一组没取到内容，可以稍后重试。';
      renderKnowledgeCard();
      return knowledgeState();
    }
    var st = { at: Date.now(), cards: clean, read: {}, idx: 0 };
    knowledgeSave(st);
    knowledgeMarkSeen(clean);   /* 记住看过的内容，下次生成不会再拿它糊弄你 */
    if (fails && fails.length) phone.toast('知识卡：' + fails.length + ' 个话题检索失败，这一组用其余内容组成', 'bad');
    var repeats = 0;
    clean.forEach(function (c) { if (c.repeat) repeats++; });
    if (repeats) phone.toast('这一组有 ' + repeats + ' 张和以前看过的一样（检索接口没给新内容）', 'bad');
    else if (clean.length < K_TOPICS.length) {
      phone.toast('这一组取到 ' + clean.length + ' 张：检索接口返回的重复内容已自动去掉', 'bad');
    }
    renderKnowledgeCard();
    return st;
  }
  /** 没有检索接口时的兜底：让对话模型直接生成知识卡（标注未联网） */
  function modelCards(chat) {
    var sys = '你是知识卡编辑。只输出 JSON，不要解释，不要 markdown 围栏。';
    var user = '生成 10 张中文知识卡，涵盖近期新闻、冷知识，以及科技、历史、天文、自然、地理、健康、财经、文化等领域的信息。' +
      '每张卡的 summary 必须是 40~90 字的短说明（不要长段落），title 不超过 20 字。' +
      '格式：{"cards":[{"cat":"分类","title":"标题","summary":"40~90字的短说明","url":""}]}';
    return apiChat(chat, [{ role: 'system', content: sys }, { role: 'user', content: user }], { json: true })
      .then(function (text) {
        var o = parseLooseJson(text);
        var arr = (o && (o.cards || o.items || o.data)) || [];
        if (Object.prototype.toString.call(arr) !== '[object Array]') arr = [];
        return arr.map(function (c) {
          return makeCard(String(c.cat || '知识').slice(0, 6), {
            title: String(c.title || ''), snippet: String(c.summary || c.content || ''), url: String(c.url || '')
          });
        });
      });
  }

  /* ---------------- 屏保渲染 ---------------- */
  function renderScreenSaver() {
    if (!$screensaver) return;
    var d = new Date();
    var t = $('#ss-time');
    if (t) t.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    var dt = $('#ss-date');
    if (dt) {
      dt.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
        ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    }
    renderKnowledgeCard();
  }
  function renderKnowledgeCard() {
    if (!$screensaver) return;
    var st = knowledgeState();
    var catEl = $('#ss-cat'), titleEl = $('#ss-title'), sumEl = $('#ss-summary'),
      srcEl = $('#ss-src'), idxEl = $('#ss-idx'), progEl = $('#ss-progress'), regen = $('#ss-regen'),
      more = $('#ss-more');
    function showMore(on, expanded) {
      if (!more) return;
      more.classList.toggle('show', !!on);
      more.textContent = expanded ? '收起' : '展开全文';
    }
    if (kBusy) {
      if (catEl) catEl.textContent = '联网检索中';
      if (titleEl) titleEl.textContent = '正在为你取这一组知识卡…';
      if (sumEl) { sumEl.textContent = '已取到 ' + kGot + ' / ' + kTotal + ' 条，请稍候'; sumEl.classList.remove('expanded'); }
      if (srcEl) srcEl.textContent = '';
      if (idxEl) idxEl.textContent = '';
      if (progEl) progEl.textContent = '联网中…';
      if (regen) { regen.disabled = true; regen.textContent = '正在生成…'; }
      showMore(false);
      return;
    }
    if (!st.cards.length) {
      if (catEl) catEl.textContent = '知识卡';
      if (titleEl) titleEl.textContent = kErr ? '暂时取不到知识卡' : '还没有知识卡';
      if (sumEl) {
        sumEl.textContent = kErr || '配置好接口后，息屏时会自动联网取一组知识卡。';
        sumEl.classList.remove('expanded');
      }
      if (srcEl) srcEl.textContent = '';
      if (idxEl) idxEl.textContent = '';
      if (progEl) progEl.textContent = '';
      if (regen) { regen.disabled = false; regen.textContent = '立即生成一组'; }
      showMore(false);
      return;
    }
    var c = st.cards[st.idx] || {};
    if (catEl) catEl.textContent = c.cat || '知识';
    if (titleEl) titleEl.textContent = c.title || '';
    if (sumEl) {
      /* 有全文且已展开时显示全文，否则只显示裁好的短摘要 */
      var text = (kExpanded && c.full) ? c.full : (c.summary || '（这一条没有摘要）');
      sumEl.textContent = text;
      sumEl.classList.toggle('expanded', !!(kExpanded && c.full));
    }
    if (srcEl) {
      if (kErr) {
        /* 卡片还在，但有话要说（例如这次没取到新内容）→ 提示放在来源那一行 */
        srcEl.textContent = '⚠ ' + kErr;
        srcEl.title = kErr;
      } else {
        srcEl.textContent = (c.src ? ('来源：' + c.src) : '') + (c.q ? (' · 检索：' + c.q) : '');
        srcEl.title = c.url || '';      /* 鼠标悬停可以看到完整链接 */
      }
    }
    if (idxEl) idxEl.textContent = (st.idx + 1) + ' / ' + st.cards.length;
    showMore(!!c.full, kExpanded);
    /* 只有真正显示在息屏屏保上才算「读过」 */
    if (idle.on && !st.read[st.idx]) {
      st.read[st.idx] = 1;
      knowledgeSave(st);
    }
    var all = knowledgeAllRead();
    if (progEl) progEl.textContent = '已读 ' + Math.min(knowledgeReadCount(), st.cards.length) + ' / ' + st.cards.length;
    if (regen) {
      regen.disabled = !all;
      regen.textContent = all ? '本组读完了 · 生成下一组' : '读完才会生成下一组';
    }
  }
  function openSettingsForApi() {
    exitScreensaver();
    openApp('settings');
    phone.toast('在「API 管理」里添加接口并绑定用途', 'ok');
  }

  var knowledge = {
    state: knowledgeState,
    generate: knowledgeGenerate,
    next: function () { return knowledgeGo(1); },
    prev: function () { return knowledgeGo(-1); },
    readCount: knowledgeReadCount,
    allRead: knowledgeAllRead,
    render: renderKnowledgeCard,
    clear: function () { Settings.set(K_KEY, null); renderKnowledgeCard(); },
    /* 没有联网检索接口时，是否允许用对话模型「编」知识卡（默认关闭，避免用户以为已经联网了） */
    fallback: function () { return Settings.get('knowledgeFallback', false) === true; },
    setFallback: function (on) {
      Settings.set('knowledgeFallback', on === true);
      return Settings.get('knowledgeFallback', false) === true;
    },
    /* 是否用对话模型把取回的原文润色成短卡（默认开启，需要绑定对话模型） */
    polish: function () { return Settings.get('knowledgePolish', true) !== false; },
    setPolish: function (on) {
      Settings.set('knowledgePolish', on !== false);
      return Settings.get('knowledgePolish', true) !== false;
    },
    /* 忘记「看过哪些卡」：清掉之后允许再次看到相同内容 */
    seenCount: function () { return knowledgeSeen().length; },
    forgetSeen: function () { Settings.set(K_SEEN_KEY, []); return 0; },
    topics: function () { return K_TOPICS.map(function (t) { return t.cat; }); }
  };
  var idleApi = {
    seconds: idleSeconds,
    setSeconds: function (s) {
      var v = Number(s);
      if (!isFinite(v) || v < 0) v = IDLE_DEFAULT;
      Settings.set('idleSeconds', v);
      idle.last = Date.now();
      return idleSeconds();
    },
    reset: markActivity,
    enter: enterScreensaver,
    exit: exitScreensaver,
    isOn: function () { return idle.on; },
    tick: checkIdle
  };

  /* ---------------- 对外 API ---------------- */
  var phone = {
    version: '1.7.0',
    /* 注册应用（也可用 phone.register(def)） */
    addApp: addApp,
    register: addApp,
    removeApp: removeApp,
    getApps: getApps,
    getApp: function (id) { return appCache && appCache.map[id]; },
    exportApp: exportApp,
    exportAll: exportAll,
    importBundle: importBundle,
    openApp: openApp,
    closeApp: closeApp,
    home: function () { closeApp(); toggleRecents(false); },
    toast: toast,
    alert: alertBox,
    confirm: confirmBox,
    prompt: promptBox,
    store: makeStore,
    settings: Settings,
    icons: { svg: svgIcon, html: iconHTML, names: Object.keys(ICON_PATHS), list: Object.keys(ICON_PATHS), palette: PALETTE, named: NAMED_COLORS },
    colors: PALETTE,
    grad: gradCss,
    utils: {
      el: el, $: $, $$: $$, md: md, esc: esc, uid: uid, clamp: clamp,
      download: download, readFile: readFile, hash: hashStr,
      /* 阅读器与便签用到的通用能力 */
      copy: copyText, readTextFile: readTextFile, splitParagraphs: splitParagraphs,
      cleanImportText: cleanImportText, htmlToText: htmlToText, hostOf: hostOf,
      textAccept: TEXT_ACCEPT, parseLooseJson: parseLooseJson,
      /* 睡前故事用：二进制导出 + 按句子切成适合朗读的小段 */
      downloadBlob: downloadBlob, splitForTTS: splitForTTS, normText: normText, trimText: trimText
    },
    compile: compileAppCode,
    lock: lock, unlock: unlock,
    /* 全机统一的 API 管理：所有应用都从这里取接口配置 */
    apis: apis,
    /* 语音合成（本地 GPT-SoVITS 等）：音色库 / 合成 / 切分 / 模型切换 */
    tts: ttsApi,
    /* GPT-SoVITS 同步启动：配置 / 生成启动器配置 / 在线探测 */
    gsv: gsv,
    /* 闲置息屏屏保 */
    idle: idleApi,
    /* 近期知识卡 */
    knowledge: knowledge,
    rebind: function () { loadRegistry(); loadLayout(); renderHome(); },
    /* 桌面布局（分页 / 文件夹）对外接口 */
    layout: {
      data: function () { return layout; },
      reload: function () { loadLayout(); renderHome(); },
      save: saveLayout,
      goPage: goPage,
      page: currentPage,
      pageCount: function () { return layout ? layout.pages.length : 0; },
      setEditing: setEditing,
      isEditing: function () { return state.editing; },
      makeFolder: function (ids, name) {
        var list = (ids || []).filter(function (id) { return appCache.map[id]; });
        if (list.length < 2) throw new Error('建文件夹至少需要 2 个应用');
        var first = findSlot(list[0]);
        if (!first || first.folder) throw new Error('目标应用不在桌面上');
        var f = newFolder(name || (appCache.map[list[0]].name + ' 等'), []);
        detachToFolder(list, f);
        layout.pages[first.page][first.idx] = f;
        saveLayout(); renderHome();
        return f;
      },
      ungroup: function (folderId) {
        var hit = findFolder(folderId);
        if (!hit) return false;
        var apps = hit.folder.apps.slice();
        layout.pages[hit.page][hit.idx] = null;
        apps.forEach(placeOnEmptySlot);
        saveLayout(); renderHome();
        return true;
      },
      reset: function () { normalizeLayout(freshLayout()); saveLayout(); renderHome(); }
    },
    wallpaper: {
      apply: applyWallpaper,
      list: function () { return WALLPAPERS.map(function (w) { return w.name; }); },
      solidList: function () { return SOLIDS.map(function (w) { return w.name; }); },
      mode: function () { return Settings.get('bgMode', 'solid') === 'wallpaper' ? 'wallpaper' : 'solid'; },
      setMode: function (m) { Settings.set('bgMode', m === 'wallpaper' ? 'wallpaper' : 'solid'); return applyWallpaper(); },
      css: function (i) {
        var p = pick(WALLPAPERS, i).c;
        return 'linear-gradient(160deg,' + p[0] + ',' + p[1] + ' 55%,' + p[2] + ')';
      },
      solidCss: function (i) {
        var p = pick(SOLIDS, i).c;
        return 'linear-gradient(160deg,' + p[0] + ',' + p[1] + ' 55%,' + p[2] + ')';
      },
      index: function () { return Number(Settings.get('themeIndex', 0)) || 0; },
      solidIndex: function () { return Number(Settings.get('solidIndex', 0)) || 0; },
      set: function (i) { Settings.set('bgMode', 'wallpaper'); Settings.set('themeIndex', Number(i) || 0); return applyWallpaper(); },
      setSolid: function (i) { Settings.set('bgMode', 'solid'); Settings.set('solidIndex', Number(i) || 0); return applyWallpaper(); },
      setScrim: function (v) { Settings.set('scrim', clamp(Number(v), 0, 0.9)); return applyWallpaper(); },
      getScrim: function () { return clamp(Number(Settings.get('scrim', 0.16)), 0, 0.9); }
    },
    _state: state,
    _settings: Settings
  };
  window.Phone = phone;

  /* ---------------- 启动 ---------------- */
  function bindChrome() {
    $appLayer = $('#apps'); $home = $('#home'); $pages = $('#pages');
    $pageDots = $('#page-dots'); $screen = $('#screen'); $dock = $('#dock'); $lock = $('#lock');
    $recents = $('#recents'); $toastLayer = $('#toast-layer'); $modal = $('#modal-layer');
    $statusbar = $('#statusbar'); $folderPop = $('#folder-pop'); $screensaver = $('#screensaver');

    $lock.addEventListener('click', unlock);
    $lock.addEventListener('touchstart', unlock, { passive: true });
    $appLayer.addEventListener('pointermove', function (e) { if (drag) dragMove(e.clientX, e.clientY); });
    $appLayer.addEventListener('contextmenu', function (e) { if (drag) e.preventDefault(); });
    document.addEventListener('pointermove', function (e) { onGlobalPointerMove(e); });
    document.addEventListener('pointerup', function (e) { onGlobalPointerUp(e); });
    document.addEventListener('pointercancel', function (e) { onGlobalPointerUp(e); });
    /* 指针在元素外松开也要能结束拖拽 */
    window.addEventListener('blur', function () { if (drag) dragEnd(); });
    window.addEventListener('resize', onResize);
    var hb = $('#btn-home'); if (hb) hb.addEventListener('click', function () { closeApp(); toggleRecents(false); });
    var rb = $('#btn-recents'); if (rb) rb.addEventListener('click', function () { toggleRecents(); });
    var rc = $('#rec-close'); if (rc) rc.addEventListener('click', function () { toggleRecents(false); });

    /* 息屏屏保：鼠标移动 / 点击都只算「有人在动」，不会退出屏保；
       只有按键盘（退出键）或点屏保上的「返回」按钮才退出。 */
    if (!idle.bound) {
      idle.bound = true;
      ['pointerdown', 'mousedown', 'touchstart', 'pointermove', 'mousemove', 'wheel'].forEach(function (t) {
        document.addEventListener(t, markActivity, { passive: true });
      });
      /* 捕获阶段拦下按键：先退出屏保，并阻止这一下按键落到屏保下面的输入框里 */
      document.addEventListener('keydown', function (e) {
        if (!idle.on) return;
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopPropagation) e.stopPropagation();
        exitScreensaver();
        phone.toast('已退出息屏');
      }, true);
    }
    if ($screensaver) {
      /* 点屏保空白处不再退出（避免误触），只有 .ss-ctl 里的按钮生效 */
      var bindSs = function (sel, fn) {
        var b = $(sel);
        if (b) b.addEventListener('click', function (e) { if (e && e.stopPropagation) e.stopPropagation(); fn(); });
      };
      bindSs('#ss-prev', function () { knowledgeGo(-1); });
      bindSs('#ss-next', function () { knowledgeGo(1); });
      bindSs('#ss-regen', function () {
        if (knowledgeAllRead() || !knowledgeState().cards.length) knowledgeGenerate(true);
        else phone.toast('这一组还没读完，读完后才会生成下一组', 'bad');
      });
      bindSs('#ss-more', function () {
        var c = knowledgeState().cards[knowledgeState().idx];
        if (!c || !c.full) return;
        kExpanded = !kExpanded;
        renderKnowledgeCard();
      });
      bindSs('#ss-close', function () { exitScreensaver(); });
      bindSs('#ss-setup', function () { openSettingsForApi(); });
    }

    /* 分页：滚动同步圆点 */
    if ($pages) {
      var scrollTimer = null;
      $pages.addEventListener('scroll', function () {
        if (scrollTimer) clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () { state.page = currentPage(); syncDots(); }, 60);
      }, { passive: true });
      /* 滚轮翻页（桌面浏览器） */
      var wheelLock = 0;
      $pages.addEventListener('wheel', function (e) {
        var dy = e.deltaY, dx = e.deltaX;
        var d = Math.abs(dx) > Math.abs(dy) ? dx : dy;
        if (Math.abs(d) < 2) return;
        e.preventDefault();
        var now = Date.now();
        if (now < wheelLock) return;
        wheelLock = now + 320;
        goPage(currentPage() + (d > 0 ? 1 : -1));
      }, { passive: false });
      /* 触摸滑动由原生滚动 + scroll-snap 处理；这里只处理「松手后归位」 */
      $pages.addEventListener('touchend', function () {
        setTimeout(function () { state.page = currentPage(); syncDots(); }, 80);
      }, { passive: true });
      /* 长按空白处 / 长按页面 → 进入整理模式 */
      attachEditGestures();
    }

    /* 文件夹浮层 */
    if ($folderPop) {
      $('#fp-close').addEventListener('click', function () { closeFolder(); });
      $('#fp-del').addEventListener('click', function () { deleteFolder(); });
      $('#fp-edit').addEventListener('click', function () { setEditing(!state.editing); phone.toast(state.editing ? '整理模式：拖动图标可移出文件夹' : '已退出整理模式'); });
      $('#fp-grid').addEventListener('pointerdown', function (e) {
        var item = e.target && e.target.closest ? e.target.closest('.app-item') : null;
        if (!item) return;
        /* 文件夹内长按：等长按计时器触发拖拽（attachLongPress 已绑定） */
      });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if ($modal.classList.contains('show')) return;
        if ($folderPop && $folderPop.classList.contains('show')) return closeFolder();
        if (state.editing) return setEditing(false);
        if ($recents.classList.contains('show')) return toggleRecents(false);
        if (state.current) return closeApp();
      }
      if (e.key === 'Home' || (e.altKey && e.key.toLowerCase() === 'h')) { e.preventDefault(); closeApp(); toggleRecents(false); }
      if (!state.current && !state.locked) {
        if (e.key === 'ArrowRight') goPage(currentPage() + 1);
        if (e.key === 'ArrowLeft') goPage(currentPage() - 1);
      }
    });
  }

  function onResize() {
    if (layout && $pages) goPage(state.page);
  }

  /* 全局指针：拖拽期间接管移动与松手 */
  function onGlobalPointerMove(e) {
    if (!drag) return;
    if (e.cancelable) e.preventDefault();
    dragMove(e.clientX, e.clientY);
  }
  function onGlobalPointerUp(e) {
    if (drag) dragEnd(e && e.clientX, e && e.clientY);
  }

  /* 长按桌面空白进入整理模式 */
  function attachEditGestures() {
    var t = null, sx = 0, sy = 0;
    $pages.addEventListener('pointerdown', function (e) {
      if (e.target && e.target.closest && e.target.closest('.app-item')) return;
      sx = e.clientX; sy = e.clientY;
      if (t) clearTimeout(t);
      t = setTimeout(function () { t = null; setEditing(!state.editing); if (navigator.vibrate) { try { navigator.vibrate(12); } catch (er) { } } }, 500);
    });
    $pages.addEventListener('pointermove', function (e) {
      if (!t) return;
      if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) { clearTimeout(t); t = null; }
    });
    ['pointerup', 'pointercancel'].forEach(function (ev) {
      $pages.addEventListener(ev, function () { if (t) { clearTimeout(t); t = null; } });
    });
  }

  function boot() {
    try {
      bindChrome();
      applyWallpaper();
      apiMigrate();
      loadRegistry();
      loadLayout();
      renderHome();
      tickClock(); setInterval(tickClock, 1000);
      /* 闲置检测：4 秒看一次就够了 */
      idle.last = Date.now();
      setInterval(checkIdle, 4000);
      updateBattery();
      if (typeof navigator.getBattery === 'function') navigator.getBattery().then(function (b) { b.addEventListener('levelchange', updateBattery); b.addEventListener('chargingchange', updateBattery); }).catch(function () { });
      setTimeout(function () { goPage(0); }, 60);
      if (Settings.get('skipLock', false)) lock(false); else lock(true);
      state.booted = true;
      console.log('%c PhoneShell ' + phone.version + ' 就绪 ', 'background:#3ddc97;color:#08331f;font-weight:700;border-radius:4px',
        '共 ' + getApps().length + ' 个应用');
    } catch (e) {
      console.error(e);
      var be = $('#boot-error');
      if (be) { be.classList.add('show'); $('#boot-error-msg').textContent = e && e.message ? e.message : String(e); }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>


<script>/* apps/aigen.js */
/* ============================================================
   内置应用 · AI 现场创作（OpenAI 兼容接口，独立 API）
   通过文字描述生成一个可安装的应用插件，自动加入手机
   ============================================================ */
(function () {
  'use strict';
  if (!window.PHONE_BUILTIN_APPS) window.PHONE_BUILTIN_APPS = [];

  var DEFAULTS = {
    format: 'json',
    timeout: 180
  };

  /* ---------------- 系统提示词：约束 AI 产出可运行插件 ---------------- */
  function buildSystemPrompt() {
    return [
      '你是一个为「PhoneShell 小手机」编写插件（=一个应用/小游戏）的资深前端工程师。',
      'PhoneShell 是一个单文件 HTML 手机模拟器外壳，应用通过插件 API 注册进来。',
      '',
      '【硬性输出格式】',
      '只输出一个 JSON 对象，不要输出任何解释、不要说多余的话、不要用 markdown 代码围栏。',
      'JSON 结构：',
      '{',
      '  "id": "小写字母数字短横线，2-32位，字母开头",',
      '  "name": "应用名，中文优先，不超过8个字",',
      '  "icon": "emoji:🎯 或 svg:grid",',
      '  "desc": "一句话描述，不超过20字",',
      '  "code": "完整可运行的 JS 源码字符串"',
      '}',
      'icon 的 svg 名字只能从这个列表里选：' + phone.icons.list.join(', ') + ' （也可以直接用任意 emoji）。',
      '',
      '【code 字段的写法】',
      'code 必须是这样的源码（注意：字符串里的换行要写成 \\n）：',
      'function createApp(phone){',
      '  return {',
      '    id:"myapp", name:"我的应用", icon:"emoji:🎯", desc:"一句话描述",',
      '    mount: function(phone, root, ctx){',
      '      // root 是应用内容区容器；在这里渲染界面、绑定事件',
      '      // 需要时用 ctx.onCleanup(fn) 注册清理函数（清除计时器/动画帧/事件）',
      '    }',
      '  };',
      '}',
      '',
      '【可用 API】',
      'phone.utils.$ / phone.utils.$$(sel, root) 查元素；phone.utils.el("div","cls","文本") 建元素；phone.utils.esc(s) 转义；phone.utils.md(s) 简易 markdown；phone.utils.download(name, text)。',
      'phone.icons.html("svg:star"|"emoji:🎯", "#fff") 返回图标 HTML；phone.grad(id) 返回一个好看的渐变 CSS。',
      'ctx.store.get(key, 默认值) / ctx.store.set(key, 值) / ctx.store.all()：该应用的永久存档（对象，自动 JSON 化，重启后仍在）。',
      'ctx.setTitle("标题")、ctx.addAction("按钮文字", 回调)、ctx.close()、ctx.useFullBody()（去掉内边距，适合画布游戏）、ctx.onCleanup(fn)、ctx.onKey(handler)（自动在关闭时解绑）。',
      'phone.toast("提示", "ok"|"bad")、phone.alert(title, msg)、phone.confirm(title, msg)->Promise<bool>、phone.prompt(title, 默认值)->Promise<string|null>。',
      'phone.openApp(id)、phone.closeApp()、phone.icons.list、phone.colors。',
      '【重要】如果应用需要调用大模型或联网检索，必须使用外壳统一的接口管理，绝对不要在应用里自己填地址与密钥：',
      '  phone.apis.resolve("chat") 取当前绑定的对话接口（可能为 null）；phone.apis.resolve("search") 取联网检索接口；',
      '  phone.apis.resolve("write", {fallbackChat:false}) 取「长文创作」接口（专门写长文，可能为 null）；phone.apis.resolve("tts") 取「语音合成」接口；',
      '  phone.apis.ask("问题文本", {system:"系统提示词"}) 返回 Promise<string>，是问对话模型最简单的办法；',
      '  phone.apis.chat(api, [{role:"system",content:"..."},{role:"user",content:"..."}]) 返回 Promise<string>；',
      '  phone.apis.write(api, [{role:"user",content:"..."}], {maxTokens:4000}) 返回 Promise<string>（长文创作）；',
      '  phone.apis.search(api, "关键词", {count:3}) 返回 Promise<{items:[{title,url,snippet}]}>。',
      '  要念出声音就用语音接口（本地 GPT-SoVITS）：phone.tts.synth(api, "一段文字") 返回 Promise<{url,blob,bytes}>，然后 new Audio(url).play()；',
      '  也可以 phone.tts.url(api, "一段文字") 拿到直连播放地址（不需要跨域）；长文先用 phone.tts.split(文本, 60) 切成小段再逐段合成。',
      '  取不到接口时要友好提示用户去「设置 → API 管理」配置，不要报错崩掉。',
      '',
      '【界面规范】',
      '可用现成样式类：ui-btn（主按钮）、ui-btn ghost、ui-btn warn、ui-field、ui-label、ui-card、ui-row、ui-list/li/li-main、ui-hint、ui-muted、ui-bar>i（进度条）、ui-pre。',
      '内容区宽约 330~400px，高约 640px，界面要自适应、可滚动；按钮和可点区域不小于 40px。',
      '美术风格：低多边形卡通、圆角、明亮配色、手机手感。可以内联 SVG、CSS 渐变、Canvas 作画。',
      '',
      '【禁止事项】',
      '禁止任何外部网络资源：不能有 fetch/XMLHttpRequest、不能引用外部图片/字体/CDN，美术素材必须用代码画出来（emoji、内联 SVG、CSS、Canvas 均可）。',
      '不要用 ES module 的 import/export，不要用顶层 await，不要用可选链以外的实验语法，目标浏览器是 Chrome/Edge。',
      '不要 require、不要访问 document.cookie。所有状态都走 ctx.store。',
      '',
      '【质量要求】',
      '代码要完整、可直接运行、没有占位符。若做游戏：要有开始/重开逻辑、分数、结束判定，键盘与触摸都要能操作，分数写入 ctx.store。',
      '代码尽量控制在 250 行以内，风格紧凑但可读。',
      '只需要输出 JSON，不要输出 JSON 以外的任何字符。'
    ].join('\n');
  }

  /* ---------------- 交付格式：只要源码（便于用任意模型） ---------------- */
  function buildCodeOnlyPrompt() {
    return [
      '你是为「PhoneShell 小手机」写插件（应用/小游戏）的前端工程师。',
      '只输出一段 JS 源码，不要任何解释，不要 markdown 代码围栏。',
      '源码格式：',
      'function createApp(phone){ return { id:"myapp", name:"名字", icon:"emoji:🎯", desc:"描述", mount:function(phone, root, ctx){ /* 渲染界面 */ } }; }',
      '可用：phone.utils.el/$/$$/esc/md/download、phone.icons.html、phone.grad(id)、ctx.store.get/set/all、ctx.setTitle/addAction/close/useFullBody/onCleanup/onKey、phone.toast/alert/confirm/prompt。',
      '需要大模型或联网检索时用 phone.apis.resolve("chat"/"search"/"write"/"tts") 与 phone.apis.ask(...)/phone.apis.write(...)，不要把接口地址和密钥写进应用里。',
      '要出声就用 phone.tts.synth(api, 文本) 或 phone.tts.url(api, 文本)（本地 GPT-SoVITS），长文先用 phone.tts.split(文本, 60) 切段。',
      '样式类可用：ui-btn、ui-btn ghost、ui-field、ui-label、ui-card、ui-row、ui-list、ui-hint、ui-muted、ui-bar。',
      '禁止一切外部网络与外部素材，美术用 emoji / 内联 SVG / CSS / Canvas 自己画；不要 import/export。',
      '代码必须完整可运行、无占位符，控制在 250 行内。做完立刻开始输出源码，不要前言后语。'
    ].join('\n');
  }

  /* ---------------- 解析模型返回 ---------------- */
  function stripFence(t) {
    var s = String(t || '').trim();
    var m = s.match(/^```[a-zA-Z]*\s*([\s\S]*?)\s*```$/);
    if (m) return m[1].trim();
    s = s.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '');
    return s.trim();
  }
  function extractJson(t) {
    var s = stripFence(t);
    var i = s.indexOf('{'), j = s.lastIndexOf('}');
    if (i < 0 || j <= i) throw new Error('模型没有返回 JSON 对象');
    var raw = s.slice(i, j + 1);
    try { return JSON.parse(raw); } catch (e) { }
    /* 容错：模型把换行直接写进了字符串 */
    var fixed = raw.replace(/"((?:[^"\\]|\\.)*)"/g, function (_, body) {
      return '"' + body.replace(/\r?\n/g, '\\n').replace(/\t/g, '\\t') + '"';
    });
    try { return JSON.parse(fixed); } catch (e2) { }
    /* 再容错：当成 JS 对象字面量求值 */
    try { return (new Function('return (' + fixed + ')'))(); } catch (e3) { }
    throw new Error('JSON 解析失败：' + e.message);
  }

  function createApp(phone) {
    var U = phone.utils;
    var S = phone.settings;
    var state = { busy: false, result: null, raw: '', err: '', log: [] };

    function cfg(key) {
      var v = S.get('ai.' + key, null);
      return v === null || v === '' ? DEFAULTS[key] : v;
    }
    function setCfg(key, v) { S.set('ai.' + key, v); }

    function mount(phoneApi, root, ctx) {
      var statusEl, outEl, runBtn, descEl, promptEl;

      function pushLog(s) {
        state.log.push(new Date().toLocaleTimeString() + '  ' + s);
        if (state.log.length > 60) state.log.shift();
        var l = U.$('#ai-log', root);
        if (l) l.textContent = state.log.join('\n');
      }

      function render() {
        root.innerHTML = '';
        var frag = document.createDocumentFragment();

        var hint = U.el('div', 'ui-hint');
        hint.innerHTML = '用一句中文描述你想要的应用或小游戏，AI 会现场写出插件源码并直接安装到桌面上。' +
          '接口统一在「设置 → API 管理」里配置与保存（支持 DeepSeek / OpenAI / 通义 / 本地 Ollama 等 OpenAI 兼容接口），本应用不再单独填写地址和密钥。';
        frag.appendChild(hint);

        /* --- 需求描述 --- */
        frag.appendChild(U.el('div', 'ui-label', '① 描述你要的应用'));
        descEl = U.el('textarea', 'ui-field');
        descEl.rows = 3;
        descEl.style.minHeight = '78px';
        descEl.style.resize = 'vertical';
        descEl.placeholder = '例如：一个猜数字小游戏，1~100，提示太大或太小，记录最少猜测次数';
        descEl.value = S.get('ai.lastDesc', '');
        frag.appendChild(descEl);
        var chips = U.el('div', 'ui-row');
        chips.style.flexWrap = 'wrap'; chips.style.marginTop = '8px';
        ['一个打砖块小游戏，难度递增', '一个骰子+随机决策小工具', '一个番茄钟，25分钟倒计时，自动存档',
          '一个翻牌记忆配对游戏', '一个像素画板，能保存作品', '一个每日待办清单，可勾选完成'].forEach(function (t) {
            var c = U.el('button', 'ui-btn ghost', t.length > 12 ? t.slice(0, 12) + '…' : t);
            c.style.fontSize = '11.5px'; c.style.padding = '6px 10px';
            c.title = t;
            c.addEventListener('click', function () { descEl.value = t; S.set('ai.lastDesc', t); });
            chips.appendChild(c);
          });
        frag.appendChild(chips);

        /* --- 使用的接口（统一在「设置 → API 管理」里配置，这里只展示状态） --- */
        var api = phone.apis.resolve('chat');
        var det = U.el('details');
        det.style.margin = '14px 0 4px';
        det.open = !api;
        var sum = U.el('summary', null, '② 使用的接口' + (api ? '（' + api.name + '）' : '（还没有配置）'));
        sum.style.fontSize = '12.5px'; sum.style.fontWeight = '700'; sum.style.cursor = 'pointer';
        sum.style.color = 'var(--ink-soft)';
        det.appendChild(sum);

        var box = U.el('div', 'ui-card');
        box.style.marginTop = '8px';
        if (api) {
          box.appendChild(U.el('div', 'ui-muted',
            '当前使用：<b>' + U.esc(api.name) + '</b><br>' + U.esc(api.baseUrl) + '<br>模型：' + U.esc(api.model || '—')));
          box.appendChild(U.el('div', 'ui-muted',
            '接口由「设置 → API 管理」统一保存，任何应用都不再单独填写地址和密钥；想换接口请去那里改绑定。'));
        } else {
          box.appendChild(U.el('div', 'ui-hint',
            '还没有配置对话接口。请打开「设置 → API 管理」，新增一个 OpenAI 兼容的对话模型（DeepSeek / OpenAI / 通义 / 本地 Ollama 都行）并绑定到「对话模型」，' +
            '然后回到这里就能开始创作了。'));
        }
        var r3 = U.el('div', 'ui-row');
        r3.style.marginTop = '10px'; r3.style.flexWrap = 'wrap';
        var bGo = U.el('button', 'ui-btn', '去「设置 → API 管理」');
        bGo.style.fontSize = '11.5px'; bGo.style.padding = '6px 10px';
        bGo.addEventListener('click', function () { phone.openApp('settings'); });
        r3.appendChild(bGo);
        box.appendChild(r3);

        var r4 = U.el('div', 'ui-row');
        r4.style.marginTop = '10px';
        var lFormat = U.el('div', 'ui-muted', '返回格式：');
        var bFmt = U.el('button', 'ui-btn ghost', cfg('format') === 'json' ? 'JSON + 源码' : '只要源码');
        bFmt.style.fontSize = '11.5px'; bFmt.style.padding = '5px 9px';
        bFmt.addEventListener('click', function () {
          var v = cfg('format') === 'json' ? 'code' : 'json';
          setCfg('format', v);
          bFmt.textContent = v === 'json' ? 'JSON + 源码' : '只要源码';
          pushLog('返回格式切换为 ' + v);
        });
        var bTest = U.el('button', 'ui-btn ghost', '测试接口');
        bTest.style.fontSize = '11.5px'; bTest.style.padding = '5px 9px';
        bTest.addEventListener('click', function () {
          var a = phone.apis.resolve('chat');
          if (!a) return phone.toast('还没有配置对话接口', 'bad');
          phone.toast('正在测试「' + a.name + '」…');
          phone.apis.test(a.id).then(function (msg) { phone.alert('测试通过', msg); })
            .catch(function (e) { phone.alert('测试失败', '```\n' + (e && e.message ? e.message : e) + '\n```'); });
        });
        r4.appendChild(lFormat); r4.appendChild(bFmt); r4.appendChild(bTest);
        box.appendChild(r4);
        det.appendChild(box);
        frag.appendChild(det);

        /* --- 生成 --- */
        var r5 = U.el('div', 'ui-row');
        r5.style.margin = '14px 0 8px';
        runBtn = U.el('button', 'ui-btn', '✨ 开始创作');
        runBtn.addEventListener('click', run);
        var bCancel = U.el('button', 'ui-btn ghost', '清空输出');
        bCancel.addEventListener('click', function () { state.result = null; state.raw = ''; state.err = ''; outEl.innerHTML = ''; });
        r5.appendChild(runBtn); r5.appendChild(bCancel);
        frag.appendChild(r5);

        statusEl = U.el('div', 'ui-muted');
        frag.appendChild(statusEl);
        ctx.setTitle('AI 现场创作');

        outEl = U.el('div');
        outEl.style.marginTop = '12px';
        frag.appendChild(outEl);
        root.appendChild(frag);

        if (state.result) showResult(state.result);
        else if (state.err) showError(state.err, state.raw);
      }

      function showError(msg, raw) {
        outEl.innerHTML = '';
        var d = U.el('div', 'ui-hint');
        d.style.background = 'rgba(255,122,138,.16)';
        d.style.borderColor = 'rgba(255,122,138,.5)';
        d.style.color = '#7a1024';
        d.innerHTML = '<b>出错了：</b>' + U.esc(msg);
        outEl.appendChild(d);
        if (raw) {
          outEl.appendChild(U.el('div', 'ui-label', '模型原始返回（可复制排查）'));
          var pre = U.el('pre', 'ui-pre', String(raw).slice(0, 6000));
          outEl.appendChild(pre);
        }
      }

      function showResult(res) {
        outEl.innerHTML = '';
        var card = U.el('div', 'ui-card');
        var head = U.el('div', 'ui-row');
        var ic = U.el('div', 'app-icon');
        ic.style.background = phone.grad(res.def.id);
        ic.style.width = ic.style.height = '46px';
        ic.style.borderRadius = '14px';
        var g = U.el('span', 'glyph');
        g.innerHTML = phone.icons.html(res.def.icon, '#fff');
        ic.appendChild(g);
        head.appendChild(ic);
        var m = U.el('div', 'li-main');
        m.appendChild(U.el('b', null, res.def.name));
        m.appendChild(U.el('small', null, res.def.desc || '（无描述）'));
        head.appendChild(m);
        card.appendChild(head);

        var acts = U.el('div', 'ui-row');
        acts.style.marginTop = '12px'; acts.style.flexWrap = 'wrap';
        var bInst = U.el('button', 'ui-btn', res.installed ? '重新安装（覆盖）' : '安装到桌面');
        bInst.addEventListener('click', function () {
          try {
            phone.addApp({ id: res.def.id, name: res.def.name, icon: res.def.icon, desc: res.def.desc }, { code: res.code });
            res.installed = true;
            phone.alert('安装成功', '「' + res.def.name + '」已经出现在桌面上了，点图标即可打开。');
            showResult(res);
          } catch (e) {
            phone.alert('安装失败', '```\n' + e.message + '\n```');
          }
        });
        var bRun = U.el('button', 'ui-btn ghost', '立即试玩');
        bRun.addEventListener('click', function () {
          try {
            if (!phone.getApp(res.def.id)) phone.addApp({ id: res.def.id, name: res.def.name, icon: res.def.icon, desc: res.def.desc }, { code: res.code, silent: true });
            phone.openApp(res.def.id);
          } catch (e) { phone.alert('打开失败', '```\n' + e.message + '\n```'); }
        });
        var bNew = U.el('button', 'ui-btn ghost', '换个版本');
        bNew.addEventListener('click', function () { run(); });
        var bCsv = U.el('button', 'ui-btn ghost', '导出');
        bCsv.addEventListener('click', function () {
          U.download(res.def.id + '.phoneapp.json', JSON.stringify({
            schema: 'phoneshell.app/1', id: res.def.id, name: res.def.name,
            icon: res.def.icon, desc: res.def.desc, code: res.code
          }, null, 2));
        });
        acts.appendChild(bInst); acts.appendChild(bRun); acts.appendChild(bNew); acts.appendChild(bCsv);
        card.appendChild(acts);
        outEl.appendChild(card);

        var det = U.el('details');
        det.style.marginTop = '12px';
        var sum = U.el('summary', null, '查看生成的源码（' + res.code.split('\n').length + ' 行）');
        sum.style.fontSize = '12.5px'; sum.style.fontWeight = '700'; sum.style.cursor = 'pointer';
        sum.style.color = 'var(--ink-soft)';
        det.appendChild(sum);
        var ta = U.el('textarea', 'ui-field');
        ta.style.minHeight = '220px';
        ta.style.marginTop = '8px';
        ta.style.fontFamily = 'ui-monospace,Consolas,monospace';
        ta.style.fontSize = '11.5px';
        ta.value = res.code;
        det.appendChild(ta);
        var bRe = U.el('button', 'ui-btn ghost', '用编辑后的源码重新安装');
        bRe.style.marginTop = '8px';
        bRe.addEventListener('click', function () {
          try {
            var probe = phone.compile(ta.value);
            var d2 = probe(phone, U.el('div'), { store: phone.store('probe'), onKey: function () { }, onCleanup: function () { }, setTitle: function () { }, addAction: function () { }, close: function () { } });
            phone.addApp({ id: d2.id, name: d2.name, icon: d2.icon, desc: d2.desc || '' }, { code: ta.value });
            phone.toast('已重新安装', 'ok');
          } catch (e) { phone.alert('源码有误', '```\n' + e.message + '\n```'); }
        });
        det.appendChild(bRe);
        outEl.appendChild(det);

        var det2 = U.el('details');
        det2.style.marginTop = '10px';
        var sum2 = U.el('summary', null, '接口日志');
        sum2.style.fontSize = '12.5px'; sum2.style.cursor = 'pointer'; sum2.style.color = 'var(--ink-soft)';
        det2.appendChild(sum2);
        var pre = U.el('pre', 'ui-pre', state.log.join('\n') || '（暂无）');
        pre.id = 'ai-log';
        pre.style.marginTop = '8px';
        det2.appendChild(pre);
        outEl.appendChild(det2);
      }

      function run() {
        if (state.busy) return;
        var desc = (descEl.value || '').trim();
        if (!desc) return phone.toast('先描述一下你想要什么', 'bad');
        S.set('ai.lastDesc', desc);
        var api = phone.apis.resolve('chat');
        if (!api) {
          phone.alert('还没有配置接口', '请到「设置 → API 管理」新增一个 OpenAI 兼容的对话模型并绑定到「对话模型」。\n' +
            '地址与密钥统一在那里保存，本应用不再单独填写。');
          return;
        }
        if (!api.baseUrl || !api.model) {
          return phone.alert('接口信息不完整', '接口「' + api.name + '」还缺接口地址或模型名，请到「设置 → API 管理」里补全。');
        }
        doFetch(api, desc);
      }

      function doFetch(api, desc) {
        state.busy = true;
        state.err = ''; state.raw = '';
        runBtn.disabled = true;
        runBtn.innerHTML = '<span class="ui-spin"></span> 正在创作…';
        statusEl.textContent = '已通过「' + api.name + '」发送请求，等待模型返回（长代码可能需要 1~3 分钟）…';
        pushLog('POST ' + api.baseUrl + '/chat/completions  model=' + api.model);

        var useJson = cfg('format') === 'json';
        var sys = useJson ? buildSystemPrompt() : buildCodeOnlyPrompt();
        var messages = [
          { role: 'system', content: sys },
          { role: 'user', content: '请创作这个应用：' + desc }
        ];

        phone.apis.chat(api, messages, { json: useJson }).then(function (content) {
          state.raw = content;
          pushLog('收到返回，长度 ' + content.length + ' 字符');
          var res = parseResult(content, useJson, desc);
          state.result = res;
          state.busy = false;
          runBtn.disabled = false;
          runBtn.textContent = '✨ 开始创作';
          statusEl.textContent = '完成：' + res.def.name;
          showResult(res);
        }).catch(function (e) {
          state.busy = false;
          runBtn.disabled = false;
          runBtn.textContent = '✨ 开始创作';
          var m = e && e.message ? e.message : String(e);
          state.err = m;
          statusEl.textContent = '失败';
          pushLog('失败：' + m);
          showError(m, state.raw);
        });
      }

      function parseResult(content, useJson, desc) {
        var def, code;
        if (useJson) {
          var o = extractJson(content);
          def = {
            id: String(o.id || '').toLowerCase().replace(/[^a-z0-9_-]/g, '') || ('ai' + Date.now().toString(36)),
            name: String(o.name || 'AI 应用').slice(0, 20),
            icon: String(o.icon || 'emoji:✨'),
            desc: String(o.desc || desc).slice(0, 40)
          };
          code = String(o.code || '');
          if (!code) throw new Error('返回的 JSON 里没有 code 字段');
        } else {
          code = stripFence(content);
          code = code.replace(/^\s*(```|~~~)[a-zA-Z]*/, '').replace(/(```|~~~)\s*$/, '').trim();
          var idm = code.match(/id\s*:\s*["']([^"']+)["']/);
          var nm = code.match(/name\s*:\s*["']([^"']+)["']/);
          var im = code.match(/icon\s*:\s*["']([^"']+)["']/);
          var dm = code.match(/desc\s*:\s*["']([^"']+)["']/);
          def = {
            id: (idm ? idm[1] : 'ai' + Date.now().toString(36)).toLowerCase().replace(/[^a-z0-9_-]/g, ''),
            name: nm ? nm[1].slice(0, 20) : 'AI 应用',
            icon: im ? im[1] : 'emoji:✨',
            desc: dm ? dm[1].slice(0, 40) : desc
          };
        }
        /* 编译校验：确保能跑起来，失败也仍然展示源码供手工修 */
        try {
          var probe = phone.compile(code);
          var made = probe(phone, U.el('div'), {
            store: phone.store('probe'), onKey: function () { }, onCleanup: function () { },
            setTitle: function () { }, addAction: function () { }, close: function () { }
          });
          def.id = made.id || def.id;
          def.name = made.name || def.name;
          def.icon = made.icon || def.icon;
          def.desc = made.desc || def.desc;
          pushLog('源码校验通过：' + def.id);
        } catch (e) {
          pushLog('源码校验失败：' + e.message);
          phone.toast('生成的源码有语法问题，可在下方手动修正', 'bad');
        }
        return { def: def, code: code, installed: false };
      }

      render();
    }

    return {
      id: 'aigen',
      name: 'AI 创作',
      icon: 'svg:spark',
      desc: '描述需求，AI 现场写新应用',
      order: 81,
      mount: mount
    };
  }
  window.PHONE_BUILTIN_APPS.push({ id: 'aigen', createApp: createApp, code: '' });
})();
</script>

<script>/* apps/appstore.js */
/* ============================================================
   内置应用 · 应用商店 / 插件管理（含导入、导出、卸载、代码注入）
   ============================================================ */
(function () {
  'use strict';
  if (!window.PHONE_BUILTIN_APPS) window.PHONE_BUILTIN_APPS = [];

  function createApp(phone) {
    var U = phone.utils;

    function row(app, opts) {
      opts = opts || {};
      var li = U.el('div', 'li');
      var ic = U.el('div', 'app-icon');
      ic.style.background = phone.grad(app.id);
      ic.style.width = ic.style.height = '42px';
      ic.style.borderRadius = '13px';
      ic.style.fontSize = '20px';
      var g = U.el('span', 'glyph');
      g.innerHTML = phone.icons.html(app.icon, '#fff');
      ic.appendChild(g);
      li.appendChild(ic);
      var main = U.el('div', 'li-main');
      main.appendChild(U.el('b', null, app.name + (app.builtin ? '' : ' · 插件')));
      main.appendChild(U.el('small', null, (app.desc || '无描述') + '  ·  ' + app.id));
      li.appendChild(main);
      var acts = U.el('div', 'ui-row');
      li.appendChild(acts);
      return { li: li, acts: acts, main: main };
    }

    function mount(phoneApi, root, ctx) {
      var view = 'list';

      function render() {
        root.innerHTML = '';
        if (view === 'list') renderList();
        else if (view === 'code') renderCode();
        else if (view === 'data') renderData();
      }

      function renderList() {
        var wrap = U.el('div');
        var hint = U.el('div', 'ui-hint');
        hint.innerHTML = '插件即应用：任何应用都可以用一段 JS 源码安装进来。' +
          '点下面「AI 现场创作」用文字描述让 AI 直接写一个新应用，也可以导入别人分享的 <b>.json</b> 插件包。';
        wrap.appendChild(hint);

        var r1 = U.el('div', 'ui-row');
        r1.style.margin = '12px 0';
        var bAI = U.el('button', 'ui-btn', '✨ AI 现场创作');
        bAI.addEventListener('click', function () { phone.openApp('aigen'); });
        var bImp = U.el('button', 'ui-btn ghost', '📥 导入插件');
        bImp.addEventListener('click', doImport);
        r1.appendChild(bAI); r1.appendChild(bImp);
        wrap.appendChild(r1);

        wrap.appendChild(U.el('div', 'ui-label', '已安装应用（' + phone.getApps().length + '）'));
        var list = U.el('div', 'ui-list');
        phone.getApps().forEach(function (app) {
          var r = row(app);
          if (app.builtin) {
            var tag = U.el('small', null, '内置');
            tag.style.color = 'var(--ink-soft)';
            r.acts.appendChild(tag);
          } else {
            var bx = U.el('button', 'ui-btn ghost', '导出');
            bx.style.padding = '6px 10px'; bx.style.fontSize = '12px';
            bx.addEventListener('click', function () { doExport(app); });
            var bd = U.el('button', 'ui-btn warn', '卸载');
            bd.style.padding = '6px 10px'; bd.style.fontSize = '12px';
            bd.addEventListener('click', function () { doRemove(app); });
            r.acts.appendChild(bx); r.acts.appendChild(bd);
          }
          list.appendChild(r.li);
        });
        wrap.appendChild(list);

        var r2 = U.el('div', 'ui-row');
        r2.style.marginTop = '14px'; r2.style.flexWrap = 'wrap';
        var bCode = U.el('button', 'ui-btn ghost', '⌨ 粘贴源码安装');
        bCode.addEventListener('click', function () { view = 'code'; render(); });
        var bData = U.el('button', 'ui-btn ghost', '💾 数据与备份');
        bData.addEventListener('click', function () { view = 'data'; render(); });
        r2.appendChild(bCode); r2.appendChild(bData);
        wrap.appendChild(r2);

        wrap.appendChild(U.el('div', 'ui-muted', '提示：卸载只删掉插件本体，它的存档会保留；想彻底清空可在「数据与备份」里操作。'));
        root.appendChild(wrap);
      }

      function renderCode() {
        var wrap = U.el('div');
        wrap.appendChild(U.el('div', 'ui-hint',
          '在下面粘贴插件源码。格式：必须定义 function createApp(phone){ ... return { name, icon, mount }; }。'));
        var ta = U.el('textarea', 'ui-field');
        ta.style.minHeight = '210px';
        ta.style.fontFamily = 'ui-monospace,Consolas,monospace';
        ta.style.fontSize = '12px';
        ta.placeholder = 'function createApp(phone){ return { name:"我的应用", icon:"emoji:🎯", mount:function(phone, root, ctx){} }; }';
        wrap.appendChild(ta);
        var r = U.el('div', 'ui-row');
        r.style.marginTop = '10px';
        var bBack = U.el('button', 'ui-btn ghost', '返回');
        bBack.addEventListener('click', function () { view = 'list'; render(); });
        var bDo = U.el('button', 'ui-btn', '安装');
        bDo.addEventListener('click', function () {
          var code = ta.value.trim();
          if (!code) return phone.toast('请先粘贴源码', 'bad');
          try {
            var probe = phone.compile(code);
            var def = probe(phone, U.el('div'), { store: phone.store('probe'), onKey: function () { }, onCleanup: function () { }, setTitle: function () { }, addAction: function () { }, close: function () { } });
            var res = phone.addApp({ id: def.id, name: def.name, icon: def.icon, desc: def.desc || '手动安装的插件' }, { code: code });
            phone.toast('安装成功：' + def.name, 'ok');
            view = 'list'; render();
          } catch (e) {
            phone.alert('安装失败', '错误信息：\n\n```\n' + e.message + '\n```');
          }
        });
        r.appendChild(bBack); r.appendChild(bDo);
        wrap.appendChild(r);
        root.appendChild(wrap);
      }

      function renderData() {
        var wrap = U.el('div');
        wrap.appendChild(U.el('div', 'ui-hint', '导出会把全部应用（含内置）与所有存档打包成一个 JSON 文件，换电脑时导入即可恢复。'));
        var r = U.el('div', 'ui-row');
        r.style.margin = '12px 0';
        var bExp = U.el('button', 'ui-btn', '导出全部');
        bExp.addEventListener('click', function () {
          var bundle = phone.exportAll();
          var ok = U.download('phoneshell-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(bundle, null, 2));
          if (ok) phone.toast('已导出备份文件', 'ok');
        });
        var bImp = U.el('button', 'ui-btn ghost', '导入备份');
        bImp.addEventListener('click', doImport);
        r.appendChild(bExp); r.appendChild(bImp);
        wrap.appendChild(r);

        wrap.appendChild(U.el('div', 'ui-label', '各应用存档大小'));
        var list = U.el('div', 'ui-list');
        var total = 0;
        phone.getApps().forEach(function (app) {
          var dump = JSON.stringify(phone.store(app.id).dump());
          total += dump.length;
          var li = U.el('div', 'li');
          var main = U.el('div', 'li-main');
          main.appendChild(U.el('b', null, app.name));
          main.appendChild(U.el('small', null, dump.length + ' 字节 · ' + (dump === '{}' ? '暂无存档' : '有存档')));
          li.appendChild(main);
          var bClear = U.el('button', 'ui-btn ghost', '清空');
          bClear.style.padding = '6px 10px'; bClear.style.fontSize = '12px';
          bClear.addEventListener('click', function () {
            phone.store(app.id).clear();
            phone.toast(app.name + ' 的存档已清空', 'ok');
            render();
          });
          li.appendChild(bClear);
          list.appendChild(li);
        });
        wrap.appendChild(list);
        wrap.appendChild(U.el('div', 'ui-muted', '全部存档合计约 ' + total + ' 字节。浏览器本地存储上限通常 5MB，够用很久。'));

        var r2 = U.el('div', 'ui-row');
        r2.style.marginTop = '14px';
        var bBack = U.el('button', 'ui-btn ghost', '返回');
        bBack.addEventListener('click', function () { view = 'list'; render(); });
        r2.appendChild(bBack);
        wrap.appendChild(r2);
        root.appendChild(wrap);
      }

      function doExport(app) {
        var data = phone.exportApp(app.id);
        if (!data) return;
        if (!data.code) {
          phone.alert('无法导出源码', '「' + app.name + '」是内置应用，其源码已内置在外壳文件中，不需要单独导出。');
          return;
        }
        U.download(app.id + '.phoneapp.json', JSON.stringify(data, null, 2));
        phone.toast('已导出：' + app.name, 'ok');
      }

      function doRemove(app) {
        phone.confirm('卸载 ' + app.name + '？', '插件源码会被删除，它的存档数据会保留。').then(function (yes) {
          if (!yes) return;
          if (phone.removeApp(app.id)) { phone.toast('已卸载：' + app.name, 'ok'); render(); }
        });
      }

      function doImport() {
        U.readFile('.json,application/json').then(function (f) {
          if (!f) return;
          var res;
          try { res = phone.importBundle(f.text); }
          catch (e) { return phone.alert('导入失败', '文件解析出错：\n\n```\n' + e.message + '\n```'); }
          var msg = '成功导入 ' + res.ok + ' 个应用。';
          if (res.fail.length) msg += '\n\n失败 ' + res.fail.length + ' 个：\n' + res.fail.map(function (x) { return '- ' + x; }).join('\n');
          phone.alert('导入完成', msg);
          render();
        });
      }

      render();
    }

    return {
      id: 'appstore',
      name: '应用商店',
      icon: 'svg:grid',
      desc: '安装 / 卸载 / 导入插件',
      order: 80,
      mount: mount
    };
  }
  window.PHONE_BUILTIN_APPS.push({ id: 'appstore', createApp: createApp, code: '' });
})();
</script>

<script>/* apps/bedtime.js */

    '#apps .app-host[data-app-id="bedtime"] .bt-star{font-size:12px;color:#d8c9a6}'
  ].join('\n');

  function injectTheme(doc) {
    try {
      if (doc.getElementById(BEDTIME_CSS_ID)) return;
      var s = doc.createElement('style');
      s.id = BEDTIME_CSS_ID;
      s.textContent = BEDTIME_CSS;
      (doc.head || doc.body || doc.documentElement).appendChild(s);
    } catch (e) { /* 注入失败不影响功能 */ }
  }

  /* ============================================================
     一、纯函数区（不碰 DOM，测试直接调 mount.__test 里的这几个）
     ============================================================ */

  var CN_DIGITS = '零一二三四五六七八九';
  /** 阿拉伯数字转汉字（0~9999，故事里够用了；超范围原样返回） */
  function numToCn(str) {
    var n = parseInt(str, 10);
    if (!isFinite(n) || n < 0 || n > 9999) return str;
    if (n < 10) return CN_DIGITS[n];
    if (n < 20) return '十' + (n % 10 ? CN_DIGITS[n % 10] : '');
    if (n < 100) return CN_DIGITS[Math.floor(n / 10)] + '十' + (n % 10 ? CN_DIGITS[n % 10] : '');
    if (n < 1000) {
      var h = Math.floor(n / 100), r = n % 100;
      return CN_DIGITS[h] + '百' + (r ? (r < 10 ? '零' + CN_DIGITS[r] : numToCn(String(r))) : '');
    }
    var th = Math.floor(n / 1000), r2 = n % 1000;
    return CN_DIGITS[th] + '千' + (r2 ? (r2 < 100 ? '零' + numToCn(String(r2)) : numToCn(String(r2))) : '');
  }

  /**
   * 把模型写出来的文稿整理成「适合朗读」的纯文本：
   * 去掉 markdown / emoji / 多余符号，半角标点转全角，阿拉伯数字转汉字。
   * 这一步很关键 —— 直接拿带 *、#、😀 的文本去合成，念出来会很怪。
   */
  function cleanScript(text) {
    var s = String(text == null ? '' : text).replace(/\r\n?/g, '\n');
    s = s.replace(/```[a-zA-Z]*\n?/g, '');                       /* 代码围栏 */
    s = s.replace(/^\s{0,3}#{1,6}\s*/gm, '');                    /* markdown 标题 */
    s = s.replace(/\*\*([^*]*)\*\*/g, '$1').replace(/\*([^*]*)\*/g, '$1');
    s = s.replace(/^\s*[-*+•]\s+/gm, '');                        /* 列表符号 */
    s = s.replace(/[`~_^|<>]/g, '');
    s = s.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, '');        /* emoji（代理对） */
    s = s.replace(/[\u2600-\u27BF\u2B00-\u2BFF\uFE0F\u2190-\u21FF]/g, '');
    /* 半角标点转全角：语音前端对全角标点更友好 */
    s = s.replace(/([!?;:,])\s*/g, function (m, p) {
      return ({ '!': '！', '?': '？', ';': '；', ':': '：', ',': '，' })[p];
    });
    s = s.replace(/\.(?=\s|$)/g, '。');
    s = s.replace(/\s*—\s*/g, '，');
    /* 直引号配成中文弯引号（TTS 前端读弯引号更自然） */
    var openQuote = false;
    s = s.replace(/"/g, function () { openQuote = !openQuote; return openQuote ? '“' : '”'; });
    s = s.replace(/'/g, '');
    /* 数字转汉字 */
    s = s.replace(/\d+/g, function (m) { return numToCn(m); });
    /* 空白整理：中文之间不留空格（TTS 会把空格当成停顿，读起来断断续续） */
    s = s.replace(/[ \t\u3000]+/g, ' ');
    s = s.replace(/([\u4e00-\u9fa5])[ \t]+([\u4e00-\u9fa5])/g, '$1$2');
    s = s.replace(/([\u4e00-\u9fa5])[ \t]+([\u4e00-\u9fa5])/g, '$1$2');
    s = s.replace(/ *\n */g, '\n');
    s = s.replace(/\n{3,}/g, '\n\n');
    s = s.replace(/[ \t]+$/gm, '');
    s = s.replace(/^\s+|\s+$/g, '');
    return s;
  }

  var LENGTHS = [
    { key: 'short', label: '短 · 约 300 字', chars: 300 },
    { key: 'medium', label: '中 · 约 600 字', chars: 600 },
    { key: 'long', label: '长 · 约 1000 字', chars: 1000 },
    { key: 'xlong', label: '超长 · 约 1800 字', chars: 1800 }
  ];

  /* 提示词完全交给用户：下面两份只是「初始模板」，
     界面上可以随便改，改完的版本会存进本机存档。
     模板里可以用占位符，生成时替换成当前的输入：
       {{主题}} {{字数}} {{篇幅}} {{日期}} */
  var PROMPT_SYS_DEFAULT = '你是一位专门为孩子写睡前故事的儿童文学作者。你的文字温柔、有画面感、懂孩子的心理，' +
    '写出来的故事都是可以直接念出来听的。';
  var PROMPT_USER_DEFAULT = [
    '请创作一个可以念给孩子听的睡前故事。',
    '',
    '主题 / 主角：{{主题}}',
    '篇幅：{{篇幅}}',
    '',
    '输出要求（很重要）：',
    '1. 只输出故事正文，不要标题、不要 markdown、不要解释、不要小标题。',
    '2. 用自然的口语短句，每句尽量不超过 25 个字，句子之间要有呼吸感，适合朗读。',
    '3. 不要出现括号、星号、emoji、英文缩写和阿拉伯数字（数字请写成汉字）。',
    '4. 段落之间空一行，每段 2~4 句。',
    '5. 结尾温柔收束，让孩子安心入睡。'
  ].join('\n');

  var PLACEHOLDERS = [
    { key: '{{主题}}', desc: '① 里填的主题 / 主角（没填时写「请你自由发挥」）' },
    { key: '{{字数}}', desc: '篇幅的字数，例如 600' },
    { key: '{{篇幅}}', desc: '篇幅的完整说法，例如 中 · 约 600 字' },
    { key: '{{日期}}', desc: '今天的日期' }
  ];

  function pickByKey(list, key, fallbackIdx) {
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return list[fallbackIdx || 0];
  }
  function lenOf(key) { return pickByKey(LENGTHS, key, 1); }

  /** 把模板里的 {{占位符}} 换成当前输入（这就是最终发出去的内容） */
  function renderPrompt(tpl, vars) {
    var v = vars || {};
    return String(tpl == null ? '' : tpl).replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (m, k) {
      if (k === '主题') return String(v.topic || '').trim() || '请你自由发挥';
      if (k === '字数') return String(v.chars == null ? '' : v.chars);
      if (k === '篇幅') return String(v.lenLabel || '');
      if (k === '日期') return String(v.date || '');
      return m;   /* 不认识的占位符原样留着，用户看得出来 */
    });
  }

  /**
   * 组装「长文创作」接口要的两条消息。
   * 直接吃用户编辑过的两份提示词模板，只做占位符替换，不做任何隐藏加工。
   */
  function buildStoryPrompt(o) {
    o = o || {};
    var len = lenOf(o.lenKey);
    var vars = {
      topic: o.topic,
      chars: len.chars,
      lenLabel: len.label.replace(/^[^\s]+\s*·\s*/, ''),
      date: new Date().toLocaleDateString()
    };
    var sysTpl = (o.sys == null || o.sys === '') ? PROMPT_SYS_DEFAULT : o.sys;
    var userTpl = (o.user == null || o.user === '') ? PROMPT_USER_DEFAULT : o.user;
    return { system: renderPrompt(sysTpl, vars), user: renderPrompt(userTpl, vars), vars: vars };
  }

  /** 估算朗读时长（秒）：中文正常语速约每秒 4.6 字 */
  function estimateSeconds(chars, speed) {
    var sp = Number(speed) > 0 ? Number(speed) : 1;
    return Math.max(1, Math.round(Number(chars || 0) / (4.6 * sp)));
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    if (sec < 60) return sec + ' 秒';
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ' 分' + (s ? ' ' + s + ' 秒' : '');
  }
  function fmtChars(n) {
    n = Number(n) || 0;
    return n >= 10000 ? (n / 10000).toFixed(1) + ' 万字' : n + ' 字';
  }
  /** 文件名安全化 */
  function safeName(s) {
    return String(s == null ? '' : s).replace(/[\\/:*?"<>|\r\n\t]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 40) || '睡前故事';
  }
  /** 收藏夹里一条记录导出成 txt */
  function storyToText(st) {
    return '《' + (st.title || '未命名') + '》\n' +
      '（' + (st.mode === 'read' ? '长文朗读' : '睡前故事') + ' · ' + new Date(st.added || Date.now()).toLocaleString() +
      ' · 约 ' + fmtChars(st.chars) + ' · 约 ' + fmtDur(st.secs) + ' · 音色：' + (st.voiceName || '未记录') + '）\n\n' +
      String(st.text || '') + '\n\n—— 由小手机 PhoneShell「睡前故事」生成\n';
  }
  function uid() {
    return 'st-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e6).toString(36);
  }

  /* ============================================================
     二、应用本体
     ============================================================ */
  function createApp(phone) {
    var U = phone.utils;
    injectTheme(document);

    var MAX_PARAS = 400;        /* 单篇最多切多少段（防止误导入一本书把浏览器拖死） */
    var MAX_STORIES = 80;       /* 收藏夹最多存多少篇 */
    var SEG_CHARS = 60;         /* 每段朗读文字的目标长度 */
    var MAX_CHARS = 6000;       /* 单篇文稿最多保留多少字 */

    function mount(phoneApi, root, ctx) {
      /* ---------------- 状态 ---------------- */
      var S = {
        view: 'studio', mode: 'story',
        topic: '', lenKey: 'medium',
        sysPrompt: PROMPT_SYS_DEFAULT, userPrompt: PROMPT_USER_DEFAULT,
        templateId: '', rawText: '',
        title: '', script: '', busy: false, err: '', status: '',
        storyId: null, fromFav: false,
        paras: [], paraState: [], paraErr: [], audio: [], blob: [], preload: [],
        pending: {}, cur: -1, playing: false, autoNext: true, stopMode: 'off',
        directMode: false, genStop: false, genDone: 0, failed: 0,
        pingMsg: '', pingOk: null
      };
      var stories = [];
      var templates = [];
      var ui = {};
      var urls = [];               /* 本会话创建过的 objectURL，关闭时统一回收 */
      var player = null;
      var timerHandle = null;
      var timerEnd = 0;
      var listEl = null;
      var barEl = null;
      var statusEl = null;

      /* ---------------- 存档 ---------------- */
      function loadStories() {
        var raw = ctx.store.get('stories', []);
        var out = [];
        if (Object.prototype.toString.call(raw) === '[object Array]') {
          raw.forEach(function (s) {
            if (!s || typeof s !== 'object' || typeof s.text !== 'string') return;
            out.push({
              id: String(s.id || uid()),
              title: String(s.title || '未命名'),
              text: s.text,
              mode: s.mode === 'read' ? 'read' : 'story',
              topic: String(s.topic || ''),
              lenKey: String(s.lenKey || ''),

      function saveStories() {

      function saveUi() {
        ctx.store.set('ui', {
          mode: S.mode, lenKey: S.lenKey, topic: S.topic,

        });

      if (typeof ui.userPrompt === 'string' && ui.userPrompt.trim()) S.userPrompt = ui.userPrompt;
      function resetPrompts() { S.sysPrompt = PROMPT_SYS_DEFAULT; S.userPrompt = PROMPT_USER_DEFAULT; saveUi(); }
      /** 把占位符一次性换成当前内容 —— 之后这两份提示词就是「最终文本」，外壳不再做任何替换 */

      /* ---------------- 接口 ---------------- */
      function writeApi() { return phone.apis.resolve('write'); }
      function ttsApi() { return phone.apis.resolve('tts'); }
      /** 当前音色：优先用用户选的，其次默认音色 */
      function curVoice() {
        var v = phone.tts.voiceGet(S.voiceId) || phone.tts.voiceGet(phone.tts.defaultVoiceId());
        return v;
      }
      /** 合成时用的语音参数：音色覆盖接口里的参考音频 */
      function ttsOpts() {
        var v = curVoice();
        return v ? {
          refAudio: v.refAudio, promptText: v.promptText, promptLang: v.promptLang,
          textLang: v.textLang, textSplit: v.textSplit, speed: v.speed
        } : {};
      }
      function curSpeed() {
        var v = curVoice();
        if (v && Number(v.speed) > 0) return Number(v.speed);
        var api = ttsApi();
        return api ? phone.tts.normalize(api.tts).speed : 1;
      }

      /* ---------------- 播放器 ---------------- */
      function trackUrl(u) { if (u) urls.push(u); }
      function stopPlayer() {
        if (player) { try { player.onended = null; player.onerror = null; player.pause(); } catch (e) { } }
        player = null;
        S.playing = false;
        stopTimer();
      }
      function clearPreloads() {
        (S.preload || []).forEach(function (a) { if (a) { try { a.src = ''; } catch (e) { } } });
        S.preload = (S.paras || []).map(function () { return null; });
      }
      function stopTimer() {
        if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
        timerEnd = 0;
      }
      function startTimer() {
        stopTimer();
        if (S.stopMode === 'off' || S.stopMode === 'para') return;
        var min = Number(S.stopMode);
        if (!isFinite(min) || min <= 0) return;
        timerEnd = Date.now() + min * 60000;
        timerHandle = setInterval(function () {
          if (Date.now() >= timerEnd) {
            stopPlayer();
            phone.toast('定时到了，已经停下来啦', 'ok');
            renderBar();
          }
        }, 5000);
      }
      function haveAudio() { return typeof Audio === 'function'; }

      /** 合成第 i 段（有缓存就直接用；结果写进 S.audio[i]） */
      function synthOne(i) {
        if (S.paraState[i] === 2) return Promise.resolve(S.audio[i]);
        if (S.pending[i]) return S.pending[i];
        var api = ttsApi();
        if (!api) return Promise.reject(new Error('还没有配置语音合成接口。请到「设置 → API 管理」新增一个「语音合成」（本地 GPT-SoVITS 即可）。'));
        if (!haveAudio()) return Promise.reject(new Error('当前环境不支持播放音频'));
        var mode = S.directMode ? 'direct' : phone.tts.normalize(api.tts).method;
        S.paraState[i] = 1;
        S.paraErr[i] = '';
        paintLine(i);

        var p;
        if (mode === 'direct') {
          try {
            S.audio[i] = phone.tts.url(api, S.paras[i], ttsOpts());
            S.paraState[i] = 2;
            paintLine(i);
            p = Promise.resolve(S.audio[i]);
          } catch (e) {
            S.paraState[i] = 3; S.paraErr[i] = e.message;
            paintLine(i);
            p = Promise.reject(e);
          }
        } else {
          p = phone.tts.synth(api, S.paras[i], ttsOpts()).then(function (r) {
            trackUrl(r.url);
            S.audio[i] = r.url;
            S.blob[i] = r.blob;
            S.paraState[i] = 2;
            paintLine(i);
            return r.url;
          }).catch(function (e) {
            delete S.pending[i];
            /* 自动模式：取不回来多半是跨域，退化成直连播放再试一次 */
            if (mode === 'auto') {
              S.directMode = true;
              phone.toast('取音频失败，已改成直连播放（本地接口一般没开跨域）', 'bad');
              return synthOne(i);
            }
            S.paraState[i] = 3;
            S.paraErr[i] = e && e.message ? e.message : String(e);
            paintLine(i);
            throw e;
          });
        }
        S.pending[i] = p;
        p.then(function () { delete S.pending[i]; }, function () { delete S.pending[i]; });
        return p;
      }

      /** 提前把下一段准备好，播放就不容易断 */
      function prefetch(i) {
        if (i < 0 || i >= S.paras.length) return;
        if (S.paraState[i] === 2 || S.pending[i]) return;
        if (S.directMode) {
          /* 直连模式没法用 fetch 预取，但可以让播放器先把这一段缓冲下来 */
          var api = ttsApi();
          if (!api || !haveAudio()) return;
          try {
            var durl = phone.tts.url(api, S.paras[i], ttsOpts());
            var a = new Audio(durl);
            a.preload = 'auto';
            if (typeof a.load === 'function') { try { a.load(); } catch (e2) { } }
            S.preload[i] = a;
            S.audio[i] = durl;
            S.paraState[i] = 2;
            paintLine(i);
          } catch (e) { /* 拼不出地址就等播放时再报错 */ }
          return;
        }
        synthOne(i).catch(function () { });
      }

      function playIndex(i) {
        if (i < 0 || i >= S.paras.length) return Promise.resolve();
        if (!ttsApi()) {
          phone.alert('还没有语音接口', '请到「设置 → API 管理」新增一个「语音合成」接口（本地 GPT-SoVITS 默认在 http://127.0.0.1:9880）。');
          return Promise.resolve();
        }
        var pre = null;
        if (S.preload[i]) { pre = S.preload[i]; S.preload[i] = null; }
        var started = pre ? Promise.resolve(S.audio[i] || pre.src) : synthOne(i);
        return started.then(function (url) {
          stopPlayer();
          S.cur = i;
          S.playing = true;
          if (pre) { try { pre.currentTime = 0; } catch (e) { } }
          player = pre || new Audio(url);
          player.onended = function () { onEnded(i); };
          player.onerror = function () {
            S.paraState[i] = 3;
            S.paraErr[i] = '播放失败：音频地址不可用（接口没启动，或跨域被拦）';
            S.playing = false;
            renderBar(); renderList();
          };
          var pr = player.play();
          if (pr && typeof pr.catch === 'function') {
            pr.catch(function (e) {
              S.playing = false;
              renderBar();
              phone.toast('浏览器拦下了自动播放，点一下播放键即可：' + (e && e.message ? e.message : e), 'bad');
            });
          }
          prefetch(i + 1);
          startTimer();
          renderList(); renderBar();
        }).catch(function (e) {
          S.playing = false;
          renderBar(); renderList();
          phone.alert('这一段没合成成功', '```\n' + (e && e.message ? e.message : e) + '\n```\n可以直接再点这一段重试。');
        });
      }
      function onEnded(i) {
        S.playing = false;
        if (S.stopMode === 'para') {
          S.stopMode = 'off';
          phone.toast('这一段念完了，按你设的停下来了', 'ok');
          renderBar();
          return;
        }
        if (S.autoNext && i + 1 < S.paras.length) return playIndex(i + 1);
        S.cur = i;
        renderBar(); renderList();
      }
      function togglePlay() {
        if (S.playing) { stopPlayer(); renderBar(); renderList(); return; }
        playIndex(S.cur >= 0 ? S.cur : 0);
      }

      /** 一次性把剩下的都合成出来（不播放） */
      function synthAll() {
        var api = ttsApi();
        if (!api) return phone.alert('还没有语音接口', '请先到「设置 → API 管理」配置「语音合成」接口。');
        if (!S.paras.length) return;
        S.genStop = false;
        S.genDone = 0; S.failed = 0;
        renderBar();
        var i = 0;
        function step() {
          if (S.genStop) { phone.toast('已停止合成', 'ok'); renderBar(); return; }
          while (i < S.paras.length && S.paraState[i] === 2) i++;
          if (i >= S.paras.length) {
            phone.toast(S.failed ? ('合成完成，' + S.failed + ' 段失败，可点那几段重试') : '全部合成完成', S.failed ? 'bad' : 'ok');
            S.genDone = 0;
            renderBar(); renderList();
            return;
          }
          var idx = i;
          S.genDone++;
          renderBar();
          synthOne(idx).then(function () { step(); }, function () { S.failed++; step(); });
        }
        step();
      }

      function pickFromReader() {
        var books = [];
        try {
          var raw = phone.store('reader').get('books', []);
          if (Object.prototype.toString.call(raw) === '[object Array]') books = raw;
        } catch (e) { books = []; }
        if (!books.length) return phone.alert('阅读器里还没有书', '先去「阅读器」导入一个 txt，再回来这里就能直接取用。');
        var names = books.slice(0, 10).map(function (b, i) {
          return '[' + (i + 1) + '] ' + String(b.name || '未命名') + '（' + fmtChars(String(b.text || '').length) + '）';
        }).join('\n');
        phone.prompt('从阅读器取一篇（输入序号）\n\n' + names, '1').then(function (v) {
          var i = parseInt(v, 10) - 1;
          if (!(i >= 0 && i < books.length && i < 10)) return;
          S.rawText = String(books[i].text || '').slice(0, MAX_CHARS * 2);
          phone.toast('已取入《' + books[i].name + '》', 'ok');
          render();
        });
      }

      /* ---------------- 文稿 ---------------- */
      function prepParas() {
        clearPreloads();
        S.paras = U.splitForTTS(S.script, SEG_CHARS).slice(0, MAX_PARAS);
        S.paraState = S.paras.map(function () { return 0; });
        S.paraErr = S.paras.map(function () { return ''; });
        S.audio = S.paras.map(function () { return ''; });
        S.blob = S.paras.map(function () { return null; });
        S.preload = S.paras.map(function () { return null; });
        S.pending = {};
        S.cur = -1;
        S.directMode = false;
        S.err = '';
      }

        bBack.addEventListener('click', function () { go('studio'); });
        back.appendChild(bBack);
        root.appendChild(back);

        var c = card();

        ta.style.minHeight = '200px';
        ta.style.lineHeight = '1.8';

          S.script = String(S.script);
          prepParas();
