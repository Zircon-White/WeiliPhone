      function addField(parent, labelText, value, onInput, placeholder) {
        parent.appendChild(U.el('label', 'ui-label', labelText));
        var f = U.el('input', 'ui-field');
        f.type = 'text';
        f.value = value == null ? '' : value;
        if (placeholder) f.placeholder = placeholder;
        f.addEventListener('input', function () { onInput(f.value); });
        parent.appendChild(f);
        return f;
      }
      function addSelectRow(parent, labelText, options, value, onChange, emptyHint, onSetup) {
        parent.appendChild(U.el('label', 'ui-label', labelText));
        var row = U.el('div', 'ui-row');
        if (!options.length) {
          var msg = U.el('div', 'ui-muted', emptyHint || '（没有可选内容）');
          msg.style.flex = '1';
          row.appendChild(msg);
          if (onSetup) {
            var b = U.el('button', 'ui-btn ghost', '去设置');
            b.style.padding = '7px 11px'; b.style.fontSize = '12px';
            b.addEventListener('click', onSetup);
            row.appendChild(b);
          }
        } else {
          var sel = U.el('select', 'ui-field');
          sel.style.flex = '1';
          options.forEach(function (o) {
            var op = U.el('option', null, o[1]);
            op.value = String(o[0]);
            sel.appendChild(op);
          });
          sel.value = String(value || '');
          sel.addEventListener('change', function () { onChange(sel.value); });
          row.appendChild(sel);
        }
        parent.appendChild(row);
        return row;
      }
      function view_voices() {

      /* ---------------- 播放页 ---------------- */
      function renderPlayer() {
        ctx.setTitle(S.title || '朗读');

      function paraStatusText(i) {
        if (S.paraState[i] === 2) return (S.directMode ? '直连' : '✅');
        if (S.paraState[i] === 1) return '合成中…';
        if (S.paraState[i] === 3) return '⚠️ 重试';
        return '待合成';
      }
      function renderList() {
        if (!listEl) return;
        listEl.innerHTML = '';
        if (statusEl) {
          var ready = 0;
          S.paraState.forEach(function (s) { if (s === 2) ready++; });
          statusEl.textContent = '已就绪 ' + ready + ' / ' + S.paras.length + ' 段' +
            (S.directMode ? ' · 直连播放模式（不缓存音频）' : '') +
            (S.cur >= 0 ? ' · 正在第 ' + (S.cur + 1) + ' 段' : '');
        }
        S.paras.forEach(function (p, i) {
          var line = U.el('div', 'bt-line' + (i === S.cur ? ' cur' : '') + (S.paraState[i] === 3 ? ' bad' : ''));
          line.dataset.idx = String(i);
          line.appendChild(U.el('div', 'bt-no', String(i + 1)));
          var tx = U.el('div', 'bt-tx', p);
          line.appendChild(tx);
          line.appendChild(U.el('div', 'bt-st', i === S.cur && S.playing ? '▶ 播放中' : paraStatusText(i)));
          line.addEventListener('click', function () {
            S.cur = i;
            playIndex(i);
          });
          listEl.appendChild(line);
        });
        if (S.cur >= 0 && listEl.children[S.cur] && typeof listEl.children[S.cur].scrollIntoView === 'function') {
          try { listEl.children[S.cur].scrollIntoView({ block: 'nearest' }); } catch (e) { }
        }
      }
      function paintLine(i) {
        if (!listEl || !listEl.children[i]) return renderList();
        var line = listEl.children[i];
        var st = line.children[2];
        if (st) st.textContent = paraStatusText(i);
        if (line.classList) {
          line.classList.toggle('bad', S.paraState[i] === 3);
          line.classList.toggle('cur', i === S.cur);
        }
        if (statusEl) {
          var ready = 0;
          S.paraState.forEach(function (s) { if (s === 2) ready++; });
          statusEl.textContent = '已就绪 ' + ready + ' / ' + S.paras.length + ' 段' +
            (S.directMode ? ' · 直连播放模式（不缓存音频）' : '') +
            (S.cur >= 0 ? ' · 正在第 ' + (S.cur + 1) + ' 段' : '');
        }
      }
      function renderBar() {
        if (!barEl) return;
        barEl.innerHTML = '';
        var now = U.el('div', 'bt-now');
        now.textContent = (S.cur >= 0 ? ('第 ' + (S.cur + 1) + ' / ' + S.paras.length + ' 段') : '还没开始') +
          (S.playing ? ' · 正在朗读' : '') +
          (S.stopMode === 'para' ? ' · 念完这段就停' : (timerEnd ? ' · 定时 ' + Math.max(0, Math.round((timerEnd - Date.now()) / 60000)) + ' 分钟后停' : ''));
        barEl.appendChild(now);

        var r1 = U.el('div', 'ui-row');
        var bPrev = U.el('button', 'ui-btn ghost', '⏮ 上一段');
        bPrev.addEventListener('click', function () { if (S.cur > 0) playIndex(S.cur - 1); });
        var bPlay = U.el('button', 'ui-btn', S.playing ? '⏸ 暂停' : '▶ 播放');
        bPlay.addEventListener('click', function () { togglePlay(); });
        var bNext = U.el('button', 'ui-btn ghost', '⏭ 下一段');
        bNext.addEventListener('click', function () { if (S.cur + 1 < S.paras.length) playIndex(S.cur + 1); });
        var bStop = U.el('button', 'ui-btn ghost', '⏹ 停止');
        bStop.addEventListener('click', function () { stopPlayer(); renderBar(); renderList(); });
        r1.appendChild(bPrev); r1.appendChild(bPlay); r1.appendChild(bNext); r1.appendChild(bStop);
        barEl.appendChild(r1);

        var r2 = U.el('div', 'ui-row');
        r2.style.marginTop = '7px';
        var bAll = U.el('button', 'ui-btn ghost', S.genDone ? ('合成中… ' + S.genDone) : '⬇ 全部合成');
        bAll.addEventListener('click', function () {
          if (S.genDone) { S.genStop = true; return; }
          synthAll();
        });
        var bAuto = U.el('button', 'ui-btn ghost', S.autoNext ? '连续播放：开' : '连续播放：关');
        bAuto.addEventListener('click', function () { S.autoNext = !S.autoNext; saveUi(); renderBar(); });
        var bTimer = U.el('button', 'ui-btn ghost', '⏱ 定时：' + stopLabel());
        bTimer.addEventListener('click', function () {
          var opts = [['off', '不停止'], ['15', '15 分钟'], ['30', '30 分钟'], ['60', '60 分钟'], ['para', '念完这段就停']];
          var names = opts.map(function (o) { return o[1]; }).join(' / ');
          phone.prompt('多久后自动停止？\n' + names, stopLabel()).then(function (v) {
            if (!v) return;
            var hit = null;
            opts.forEach(function (o) { if (o[1] === String(v).trim() || o[0] === String(v).trim()) hit = o[0]; });
            if (hit === null) return phone.toast('没看懂，输入 15 / 30 / 60 / 念完这段就停 / 不停止', 'bad');
            S.stopMode = hit;
            saveUi();
            if (S.playing) startTimer(); else stopTimer();
            renderBar();
          });
        });
        var bSave = U.el('button', 'ui-btn ghost', '💾 存收藏');
        bSave.addEventListener('click', function () { saveToFav(); });
        var bExp = U.el('button', 'ui-btn ghost', '⬇ 导出音频');
        bExp.addEventListener('click', function () { exportAudio(); });
        r2.appendChild(bAll); r2.appendChild(bAuto); r2.appendChild(bTimer); r2.appendChild(bSave); r2.appendChild(bExp);
        barEl.appendChild(r2);
      }
      function stopLabel() {
        if (S.stopMode === 'para') return '念完这段就停';
        if (S.stopMode === 'off' || !S.stopMode) return '不停止';
        return S.stopMode + ' 分钟';
      }

            (s.mode === 'read' ? '长文朗读' : '睡前故事') + ' · ' + new Date(s.added).toLocaleString()));
          main.appendChild(U.el('small', null,
            fmtChars(s.chars) + ' · ' + (s.paras || U.splitForTTS(s.text, SEG_CHARS).length) + ' 段 · 约 ' + fmtDur(s.secs) +
            (s.voiceName ? (' · ' + s.voiceName) : '') + (s.played ? (' · 听过 ' + s.played + ' 次') : '')));
          li.appendChild(main);

          var acts = U.el('div', 'ui-row');
          acts.style.gap = '5px'; acts.style.flexWrap = 'wrap';
          var bPlay = U.el('button', 'ui-btn', '▶');
          bPlay.title = '播放这一篇';
          bPlay.style.padding = '6px 10px'; bPlay.style.fontSize = '11.5px';
          bPlay.addEventListener('click', function () { openStory(s); });
          var bTxt = U.el('button', 'ui-btn ghost', '⬇ TXT');
          bTxt.style.padding = '6px 9px'; bTxt.style.fontSize = '11.5px';
          bTxt.addEventListener('click', function () {
            U.download(safeName(s.title) + '.txt', storyToText(s), 'text/plain');
            phone.toast('已导出文本', 'ok');
          });
          var bJson = U.el('button', 'ui-btn ghost', '⬇ JSON');
          bJson.style.padding = '6px 9px'; bJson.style.fontSize = '11.5px';
          bJson.addEventListener('click', function () {
            U.download(safeName(s.title) + '.json', JSON.stringify(s, null, 2));
            phone.toast('已导出 JSON', 'ok');
          });
          var bDel = U.el('button', 'ui-btn warn', '删');
          bDel.style.padding = '6px 9px'; bDel.style.fontSize = '11.5px';
          bDel.addEventListener('click', function () {
            phone.confirm('删除《' + s.title + '》？', '只删收藏里的这一篇，不影响别的内容。').then(function (yes) {
              if (!yes) return;
              stories = stories.filter(function (x) { return x.id !== s.id; });
              saveStories();
              phone.toast('已删除', 'ok');
              render();
            });
          });
          acts.appendChild(bPlay); acts.appendChild(bTxt); acts.appendChild(bJson); acts.appendChild(bDel);
          li.appendChild(acts);
          ul.appendChild(li);
        });
        root.appendChild(ul);
        root.appendChild(U.el('div', 'ui-muted',
          '音频不会存进收藏（太大，会撑爆浏览器本地存储）：每次播放时按需现合成。' +
          '想要音频文件，在播放页点「导出音频」逐段保存 wav。'));
      }

      function openStory(s) {
        if (typeof s === 'string') {
          var hit = null;
          stories.forEach(function (x) { if (x.id === s) hit = x; });
          s = hit;
        }
        if (!s) return phone.toast('这篇收藏找不到了', 'bad');
        S.storyId = s.id;
        S.fromFav = true;
        S.title = s.title;
        S.script = s.text;
        S.mode = s.mode;
        if (s.voiceId && phone.tts.voiceGet(s.voiceId)) S.voiceId = s.voiceId;
        prepParas();
        s.played = (s.played || 0) + 1;
        s.at = Date.now();
        saveStories();
        go('player');
        setTimeout(function () { playIndex(0); }, 60);
      }

      function saveToFav() {
        if (!String(S.script || '').trim()) return phone.toast('还没有文稿可以收藏', 'bad');
        var v = curVoice();
        var api = ttsApi();
        var pv = U.splitForTTS(S.script, SEG_CHARS);
        var rec = {
          id: S.storyId || uid(),
          title: S.title || ('睡前故事 · ' + new Date().toLocaleDateString()),
          text: String(S.script).slice(0, MAX_CHARS),
          mode: S.mode,
          topic: S.topic,
          lenKey: S.lenKey,
          promptSys: String(S.sysPrompt || '').slice(0, 1500),
          promptUser: String(S.userPrompt || '').slice(0, 1500),
          voiceId: v ? v.id : '', voiceName: v ? v.name : '',
          ttsName: api ? api.name : '',
          chars: String(S.script).length,
          paras: pv.length,
          secs: estimateSeconds(String(S.script).length, curSpeed()),
          added: Date.now(), at: Date.now(), played: 0
        };
        var hit = false;
        stories = stories.map(function (x) {
          if (x.id !== rec.id) return x;
          hit = true;
          rec.added = x.added;       /* 覆盖保存时保留原始收藏时间 */
          rec.played = x.played || 0;
          return rec;
        });
        if (!hit) {
          if (stories.length >= MAX_STORIES) {
            return phone.alert('收藏夹满了', '最多保存 ' + MAX_STORIES + ' 篇。先删掉几篇不再听的，再收藏新的。');
          }
          stories.unshift(rec);
        }
        S.storyId = rec.id;
        saveStories();
        phone.toast(hit ? '已更新收藏' : '已存入收藏夹（共 ' + stories.length + ' 篇）', 'ok');
        render();
      }

      /* ---------------- 音频导出 ---------------- */
      function exportAudio() {
        var ready = 0;
        S.blob.forEach(function (b) { if (b) ready++; });
        if (!ready) {
          return phone.alert('现在没有可导出的音频', S.directMode
            ? '当前是「直连播放」模式，音频没有存进浏览器，没法导出。\n想要音频文件：把语音接口的「取音频方式」改成「只取回音频数据（fetch）」，并让 GPT-SoVITS 打开跨域，然后重新合成。'
            : '先把段落合成出来（点「全部合成」），再导出音频。');
        }
        var base = safeName(S.title || '睡前故事');
        var api = ttsApi();
        var ext = (api && phone.tts.normalize(api.tts).mediaType) || 'wav';
        if (['wav', 'ogg', 'aac', 'mp3'].indexOf(ext) < 0) ext = 'wav';
        phone.confirm('导出 ' + ready + ' 个音频片段？', '浏览器可能会询问是否允许下载多个文件，选「允许」即可。文件名形如 ' +
          base + '-01.' + ext + '。').then(function (yes) {
          if (!yes) return;
          var n = 0;
          S.blob.forEach(function (b, i) {
            if (!b) return;
            n++;
            setTimeout(function () {
              U.downloadBlob(base + '-' + (i + 1 < 10 ? '0' : '') + (i + 1) + '.' + ext, b);
            }, n * 350);
          });
          phone.toast('开始下载 ' + ready + ' 个片段', 'ok');
        });
      }

      /* ---------------- 创作（调用长文创作接口） ---------------- */
      function createScript() {
        if (S.busy) return;
        var api = writeApi();
        if (!api) {
          phone.alert('还没有长文创作接口', '请到「设置 → API 管理」新增一个「长文创作」接口（DeepSeek / Kimi / 本地 Ollama 都行），' +
            '它专门用来写长篇朗读文稿，和「对话模型」是分开的。');
          return;
        }
        if (!api.baseUrl || !api.model) {
          return phone.alert('接口信息不完整', '接口「' + api.name + '」还缺接口地址或模型名，请到「设置 → API 管理」补全。');
        }
        if (S.mode === 'story' && !String(S.userPrompt || '').trim()) {
          return phone.toast('用户提示词是空的，先在③里写点创作要求', 'bad');
        }
        S.busy = true; S.err = ''; S.status = '正在请求「' + api.name + '」…';
        render();
        var p = buildStoryPrompt({ sys: S.sysPrompt, user: S.userPrompt, topic: S.topic, lenKey: S.lenKey });
        phone.apis.write(api, [
          { role: 'system', content: p.system },
          { role: 'user', content: p.user }
        ], { maxTokens: 4000 }).then(function (text) {
          S.busy = false;
          var clean = cleanScript(text);
          if (!clean) throw new Error('模型返回的内容是空的，换个说法再试一次');
          S.script = clean;
          S.title = suggestTitle(clean, S.topic);
          S.storyId = null; S.fromFav = false;
          S.status = '完成：' + fmtChars(clean.length) + ' · 约 ' + fmtDur(estimateSeconds(clean.length, curSpeed()));
          prepParas();
          go('script');
          phone.toast('文稿写好了，' + S.paras.length + ' 段', 'ok');
        }).catch(function (e) {
          S.busy = false;
          S.err = e && e.message ? e.message : String(e);
          S.status = '生成失败';
          render();
        });
      }
      /** 用主题或第一句当标题 */
      function suggestTitle(text, topic) {
        var t = String(topic || '').trim();
        if (t) return t.replace(/^[，,。.\s]+/, '').slice(0, 18);
        var first = String(text).split(/[。！？\n]/)[0] || '';
        first = first.replace(/^[，,。.\s]+/, '').trim();
        return (first ? first.slice(0, 16) : ('睡前故事 · ' + new Date().toLocaleDateString()));
      }

      /* ---------------- 生命周期 ---------------- */
      ctx.addAction('📚 收藏', function () { stopPlayer(); go('fav'); });
      ctx.addAction('设置', function () { phone.closeApp(); setTimeout(function () { phone.openApp('settings'); }, 120); }, { ghost: true });

      ctx.onCleanup(function () {
        stopPlayer();
        clearPreloads();
        S.genStop = true;
        urls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) { } });
        urls = [];
        S.pending = {};
      });

      /* 测试把手：纯函数 + 一份可控的局内状态（挂在 mount 上，注册表浅拷贝不会丢） */
      mount.__test = {
        clean: cleanScript,
        num: numToCn,
        prompt: buildStoryPrompt,
        render: renderPrompt,
        estimate: estimateSeconds,
        fmtDur: fmtDur,
        storyToText: storyToText,
        safeName: safeName,
        css: BEDTIME_CSS,
        lengths: function () { return LENGTHS.slice(); },
        placeholders: function () { return PLACEHOLDERS.slice(); },
        defaults: function () { return { sys: PROMPT_SYS_DEFAULT, user: PROMPT_USER_DEFAULT }; },
        controller: function () {
          return {
            state: function () {
              return {
                view: S.view, mode: S.mode, title: S.title, script: S.script,
                paras: S.paras.slice(), paraState: S.paraState.slice(), audio: S.audio.slice(),
                cur: S.cur, playing: S.playing, autoNext: S.autoNext, stopMode: S.stopMode,
                directMode: S.directMode, storyId: S.storyId, busy: S.busy, err: S.err,
                sysPrompt: S.sysPrompt, userPrompt: S.userPrompt, lenKey: S.lenKey, topic: S.topic
              };
            },
            stories: function () { return stories.slice(); },
            templates: function () { return templates.slice(); },
            setTopic: function (t) { S.topic = t; },
            setLen: function (k) { S.lenKey = k; },
            setPrompts: function (sys, user) { if (sys != null) S.sysPrompt = sys; if (user != null) S.userPrompt = user; saveUi(); },
            resetPrompts: resetPrompts,
            freezePrompts: freezePrompts,
            setMode: function (m) { S.mode = m; },
            setScript: function (t) { S.script = t; prepParas(); },
            setTitle: function (t) { S.title = t; },
            setVoice: function (id) { S.voiceId = id; },
            go: go,
            saveToFav: saveToFav,
            openStory: openStory,
            deleteStory: function (id) {
              stories = stories.filter(function (x) { return x.id !== id; });
              saveStories();
            },
            synthOne: synthOne,
            playIndex: playIndex,
            togglePlay: togglePlay,
            stopPlayer: stopPlayer,
            exportAudio: exportAudio,
            saveTemplates: saveTemplates,
            pushTemplate: function (t) { templates.push(t); saveTemplates(); },
            buildPrompt: function () {
              return buildStoryPrompt({ sys: S.sysPrompt, user: S.userPrompt, topic: S.topic, lenKey: S.lenKey });
            },
            ttsOpts: ttsOpts
          };
        }
      };

      render();
    }

    return {
      id: 'bedtime',
      name: '睡前故事',
      icon: 'emoji:🌙',
      desc: 'AI 写故事，本地语音念给你听',
      order: 23,
      color: 'espresso',
      mount: mount
    };
  }
  window.PHONE_BUILTIN_APPS.push({ id: 'bedtime', createApp: createApp, code: '' });
})();
</script>

<script>/* apps/calc.js */
/* ============================================================
   内置应用 · 计算器（自写安全解析器，无 eval / 无外部资源）
   四列大按键 + 历史记录 + 键盘支持
   ============================================================ */
(function () {
  'use strict';
  if (!window.PHONE_BUILTIN_APPS) window.PHONE_BUILTIN_APPS = [];

  /* ---------------- 安全表达式求值（分词 + 双栈，含优先级） ---------------- */
  var NUM = /^(?:\d+(?:\.\d*)?|\.\d+)$/;
  var OPS = '+-*/%';

  function tokenize(src) {
    var s = String(src == null ? '' : src);
    s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\u00d7/g, '*');
    s = s.replace(/[，,]/g, '');
    var out = [], i = 0;
    while (i < s.length) {
      var c = s.charAt(i);
      if (c === ' ') { i++; continue; }
      if (c === '(' || c === ')') { out.push(c); i++; continue; }
      if (OPS.indexOf(c) >= 0) { out.push(c); i++; continue; }
      if (c >= '0' && c <= '9' || c === '.') {
        var j = i, dots = 0;
        while (j < s.length && (s.charAt(j) >= '0' && s.charAt(j) <= '9' || s.charAt(j) === '.')) {
          if (s.charAt(j) === '.') dots++;
          j++;
        }
        var t = s.slice(i, j);
        if (dots > 1) throw new Error('数字格式错误：' + t);
        out.push(t);
        i = j;
        continue;
      }
      throw new Error('无法识别的字符：' + c);
    }
    return out;
  }

  function evaluate(src) {
    var tk = tokenize(src);
    if (!tk.length) throw new Error('算式为空');
    var values = [], ops = [];
    function peekOp() { return ops.length ? ops[ops.length - 1] : null; }
    function prec(op) { return (op === '*' || op === '/' || op === '%') ? 2 : 1; }
    function applyTop() {
      var op = ops.pop();
      var b = values.pop();
      var a = values.pop();
      if (a === undefined || b === undefined) throw new Error('算式不完整');
      if ((op === '/' || op === '%') && b === 0) throw new Error('除数不能为 0');
      var r;
      if (op === '+') r = a + b;
      else if (op === '-') r = a - b;
      else if (op === '*') r = a * b;
      else if (op === '/') r = a / b;
      else r = a % b;
      if (!isFinite(r) || isNaN(r)) throw new Error('结果无效');
      values.push(r);
    }
    var expectValue = true;
    for (var i = 0; i < tk.length; i++) {
      var t = tk[i];
      if (NUM.test(t)) {
        values.push(parseFloat(t));
        expectValue = false;
        continue;
      }
      if (t === '(') { ops.push(t); expectValue = true; continue; }
      if (t === ')') {
        while (ops.length && peekOp() !== '(') applyTop();
        if (!ops.length) throw new Error('括号不匹配');
        ops.pop();
        expectValue = false;
        continue;
      }
      /* 运算符 */
      if (expectValue) {
        if (t === '-') { values.push(0); ops.push(t); expectValue = true; continue; }
        throw new Error('运算符位置不正确');
      }
      while (ops.length && peekOp() !== '(' && prec(peekOp()) >= prec(t)) applyTop();
      ops.push(t);
      expectValue = true;
    }
    if (expectValue) throw new Error('算式不完整');
    while (ops.length) {
      if (peekOp() === '(') throw new Error('括号不匹配');
      applyTop();
    }
    if (values.length !== 1) throw new Error('算式非法');
    var v = values[0];
    if (!isFinite(v) || isNaN(v)) throw new Error('结果无效');
    return v;
  }

  function fmtNum(v) {
    if (!isFinite(v) || isNaN(v)) return '错误';
    if (Number.isInteger(v) && Math.abs(v) < 1e15) return String(v);
    if (Math.abs(v) >= 1e15 || (Math.abs(v) < 1e-6 && v !== 0)) return v.toExponential(6).replace(/\.?0+e/, 'e');
    var s = String(Math.round(v * 1e10) / 1e10);
    return s;
  }
  function group(s) {
    if (!/^-?\d+(\.\d+)?$/.test(s)) return s;
    var neg = s.charAt(0) === '-';
    if (neg) s = s.slice(1);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + parts.join('.');
  }

  function createApp(phone) {
    var U = phone.utils;

    function mount(phoneApi, root, ctx) {
      var expr = '';
      var result = '';
      var isErr = false;
      var fresh = true;       /* 结果出来后，下一个数字键开始新算式 */
      var showHistory = false;

      function history() {
        var h = ctx.store.get('history', []);
        return Object.prototype.toString.call(h) === '[object Array]' ? h : [];
      }
      function pushHistory(exprText, resText) {
        var h = history();
        h.unshift({ e: exprText, r: resText, t: Date.now() });
        ctx.store.set('history', h.slice(0, 50));
      }

      function calc(text) {
        var v = evaluate(text);
        return fmtNum(v);
      }
      function refreshPreview() {
        if (!expr.trim()) return '';
        try { return fmtNum(evaluate(expr)); } catch (e) { return ''; }
      }

      /* ---------------- 交互 ---------------- */
      function input(ch) {
        if (isErr) { expr = ''; result = ''; isErr = false; fresh = false; }
        if (fresh) { expr = ''; result = ''; fresh = false; }
        if (OPS.indexOf(ch) >= 0 || ch === '×' || ch === '÷') {
          var last = expr.slice(-1);
          if (!expr && (ch === '-' || ch === '−')) { expr = '-'; render(); return; }
          if (!expr) return;
          if (OPS.indexOf(last) >= 0) expr = expr.slice(0, -1) + ch;
          else expr += ch;
          render();
          return;
        }
        if (ch === '.') {
          var seg = expr.split(/[+\-*/%()]/).pop();
          if (seg.indexOf('.') >= 0) return;
          if (!seg) expr += '0';
          expr += '.';
          render();
          return;
        }
        expr += ch;
        render();
      }

      function backspace() {
        if (isErr) { expr = ''; result = ''; isErr = false; render(); return; }
        if (fresh) { expr = ''; result = ''; fresh = false; render(); return; }
        expr = expr.slice(0, -1);
        render();
      }

      function clearAll() {
        expr = ''; result = ''; isErr = false; fresh = true;
        render();
      }

      function toggleSign() {
        if (isErr) return;
        if (!expr) { expr = '-'; render(); return; }
        var m = expr.match(/(\d+\.?\d*|\.\d+)$/);
        if (!m) { expr += '-'; render(); return; }
        var start = expr.length - m[1].length;
        if (expr.charAt(start - 1) === '-') {
          var before = expr.charAt(start - 2);
          if (start - 1 === 0 || OPS.indexOf(before) >= 0 || before === '(') {
            expr = expr.slice(0, start - 1) + expr.slice(start);
            render();
            return;
          }
        }
        expr = expr.slice(0, start) + '(-' + m[1] + ')';
        render();
      }

      function equals() {
        if (!expr.trim()) return;
        var text = expr;
        try {
          var v = evaluate(text);
          isErr = false;
          result = fmtNum(v);
          pushHistory(text, result);
          fresh = true;
        } catch (e) {
          isErr = true;
          result = '错误';
          fresh = false;
        }
        render();
      }

      function press(k) {
        if (k === 'C') return clearAll();
        if (k === 'back') return backspace();
        if (k === '=') return equals();
        if (k === '+/−') return toggleSign();
        if (k === '( )') {
          if (isErr) return;
          if (fresh) { expr = ''; result = ''; fresh = false; }
          var opens = (expr.match(/\(/g) || []).length;
          var closes = (expr.match(/\)/g) || []).length;
          var last = expr.slice(-1);
          if (opens > closes && /[\d).%]/.test(last)) expr += ')';
          else expr += '(';
          render();
          return;
        }
        input(k);
      }

      /* ---------------- 视图 ---------------- */
      function syncHistBtn() {
        if (!bHist) return;
        bHist.className = 'ui-btn' + (showHistory ? '' : ' ghost');
        bHist.textContent = showHistory ? '收起历史' : '历史';
      }

      function render() {
        syncHistBtn();
        root.innerHTML = '';

        var wrap = U.el('div');
        wrap.style.display = 'flex';
        wrap.style.flexDirection = 'column';
        wrap.style.height = '100%';
        wrap.style.minHeight = '0';

        /* 显示区 */
        var disp = U.el('div', 'ui-card');
        disp.style.padding = '12px 14px';
        disp.style.textAlign = 'right';
        disp.style.flex = '0 0 auto';

        var eLine = U.el('div');
        eLine.style.fontSize = '15px';
        eLine.style.fontWeight = '700';
        eLine.style.color = isErr ? '#e03b63' : 'var(--ink-soft)';
        eLine.style.minHeight = '21px';
        eLine.style.wordBreak = 'break-all';
        eLine.style.fontVariantNumeric = 'tabular-nums';
        eLine.textContent = expr || '0';
        disp.appendChild(eLine);

        var rLine = U.el('div');
        rLine.style.fontSize = '34px';
        rLine.style.fontWeight = '800';
        rLine.style.letterSpacing = '.5px';
        rLine.style.marginTop = '2px';
        rLine.style.overflow = 'hidden';
        rLine.style.textOverflow = 'ellipsis';
        rLine.style.whiteSpace = 'nowrap';
        rLine.style.fontVariantNumeric = 'tabular-nums';
        rLine.style.color = isErr ? '#e03b63' : 'var(--ink)';
        var shown = result !== '' ? group(result) : (fresh ? '' : group(refreshPreview()) || '0');
        if (isErr) shown = '错误';
        rLine.textContent = shown || '0';
        disp.appendChild(rLine);
        wrap.appendChild(disp);

        /* 历史面板 */
        if (showHistory) {
          var hp = U.el('div', 'ui-card');
          hp.style.marginTop = '10px';
          hp.style.padding = '10px 12px';
          hp.style.maxHeight = '132px';
          hp.style.overflow = 'auto';
          hp.style.flex = '0 0 auto';
          var hh = U.el('div', 'ui-row');
          hh.style.justifyContent = 'space-between';
          hh.appendChild(U.el('div', 'ui-label', '历史记录'));
          var bClr = U.el('button', 'ui-btn ghost', '清空');
          bClr.style.padding = '4px 10px'; bClr.style.fontSize = '11.5px';
          bClr.addEventListener('click', function () {
            ctx.store.set('history', []);
            phone.toast('历史记录已清空', 'ok');
            render();
          });
          hh.appendChild(bClr);
          hp.appendChild(hh);

          var h = history();
          if (!h.length) {
            hp.appendChild(U.el('div', 'ui-muted', '还没有计算记录。'));
          } else {
            var hl = U.el('div', 'ui-list');
            h.forEach(function (item) {
              var li = U.el('div', 'li');
              li.style.padding = '8px 10px';
              li.style.cursor = 'pointer';
              li.title = '点一下把结果填回算式';
              var main = U.el('div', 'li-main');
              var b = U.el('b', null, group(item.r));
              b.style.fontSize = '14px';
              main.appendChild(b);
              main.appendChild(U.el('small', null, String(item.e).replace(/\*/g, '×').replace(/\//g, '÷')));
              li.appendChild(main);
              li.addEventListener('click', function () {
                expr = String(item.r);
                result = '';
                isErr = false;
                fresh = false;
                render();
                phone.toast('已填入结果 ' + group(item.r), 'ok');
              });
              hl.appendChild(li);
            });
            hp.appendChild(hl);
          }
          wrap.appendChild(hp);
        }

        /* 键盘区 */
        var pad = U.el('div');
        pad.style.flex = '0 0 auto';
        pad.style.minHeight = '298px';
        pad.style.display = 'grid';
        pad.style.gridTemplateColumns = 'repeat(4,1fr)';
        pad.style.gridTemplateRows = 'repeat(6,1fr)';
        pad.style.gap = '9px';
        pad.style.marginTop = '12px';
        pad.style.paddingBottom = '4px';

        var KEYS = [
          { k: 'C', label: 'AC', cls: 'ghost' },
          { k: '( )', label: '( )', cls: 'ghost' },
          { k: '%', label: '%', cls: 'ghost' },
          { k: '/', label: '÷', cls: 'op' },
          { k: '7', label: '7' }, { k: '8', label: '8' }, { k: '9', label: '9' },
          { k: '*', label: '×', cls: 'op' },
          { k: '4', label: '4' }, { k: '5', label: '5' }, { k: '6', label: '6' },
          { k: '-', label: '−', cls: 'op' },
          { k: '1', label: '1' }, { k: '2', label: '2' }, { k: '3', label: '3' },
          { k: '+', label: '+', cls: 'op' },
          { k: '+/−', label: '±', cls: 'ghost' },
          { k: '0', label: '0' },
          { k: '.', label: '.' },
          { k: '=', label: '=', cls: 'eq' }
        ];
        KEYS.forEach(function (it) {
          var b = U.el('button', 'ui-btn' + (it.cls === 'ghost' ? ' ghost' : ''));
          b.textContent = it.label;
          b.style.padding = '0';
          b.style.fontSize = it.cls === 'op' || it.cls === 'eq' ? '20px' : '18px';
          b.style.borderRadius = '16px';
          b.style.minHeight = '42px';
          b.style.transition = 'transform .07s, filter .12s';
          if (it.cls === 'op') b.style.background = 'rgba(92,200,255,.9)';
          if (it.cls === 'eq') { b.style.background = phone.grad('calc'); b.style.fontSize = '21px'; }
          b.addEventListener('pointerdown', function () {
            b.style.transform = 'scale(.92)';
            b.style.filter = 'brightness(.92)';
          });
          var release = function () {
            b.style.transform = '';
            b.style.filter = '';
          };
          b.addEventListener('pointerup', release);
          b.addEventListener('pointercancel', release);
          b.addEventListener('pointerleave', release);
          b.addEventListener('click', function () { press(it.k); });
          pad.appendChild(b);
        });

        var back = U.el('button', 'ui-btn ghost', '⌫ 退格');
        back.style.gridColumn = 'span 2';
        back.style.padding = '0';
        back.style.minHeight = '42px';
        back.style.borderRadius = '16px';
        back.addEventListener('click', backspace);
        pad.appendChild(back);

        var pct2 = U.el('button', 'ui-btn ghost', '清除');
        pct2.style.gridColumn = 'span 2';
        pct2.style.padding = '0';
        pct2.style.minHeight = '42px';
        pct2.style.borderRadius = '16px';
        pct2.addEventListener('click', clearAll);
        pad.appendChild(pct2);

        wrap.appendChild(pad);
        root.appendChild(wrap);
      }

      /* ---------------- 导航栏动作 ---------------- */
      var acts = U.$('.nav-actions', root.parentNode);
      if (acts) acts.innerHTML = '';
      var bHist = U.el('button', 'ui-btn' + (showHistory ? '' : ' ghost'), '历史');
      bHist.style.padding = '7px 13px';
      bHist.style.fontSize = '12.5px';
      bHist.addEventListener('click', function () {
        showHistory = !showHistory;
        render();
      });
      if (acts) acts.appendChild(bHist);
      else ctx.addAction('历史', function () { showHistory = !showHistory; render(); });

      /* ---------------- 键盘 ---------------- */
      ctx.onKey(function (e) {
        var k = e.key;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (k >= '0' && k <= '9') { input(k); e.preventDefault(); return; }
        if (k === '.' || k === ',') { input('.'); e.preventDefault(); return; }
        if (k === '+') { input('+'); e.preventDefault(); return; }
        if (k === '-') { input('-'); e.preventDefault(); return; }
        if (k === '*' || k === 'x' || k === 'X' || k === '×') { input('*'); e.preventDefault(); return; }
        if (k === '/' || k === '÷') { input('/'); e.preventDefault(); return; }
        if (k === '%') { input('%'); e.preventDefault(); return; }
        if (k === '(' || k === ')') { press('( )'); e.preventDefault(); return; }
        if (k === 'Enter' || k === '=') { equals(); e.preventDefault(); return; }
        if (k === 'Backspace') { backspace(); e.preventDefault(); return; }
        if (k === 'Delete') { clearAll(); e.preventDefault(); return; }
        if (k === 'Escape' || k === 'c' || k === 'C') { clearAll(); e.preventDefault(); return; }
      });

      render();
    }

    return {
      id: 'calc',
      name: '计算器',
      icon: 'emoji:🧮',
      desc: '顺手好用的计算器',
      order: 22,
      mount: mount
    };
  }
  window.PHONE_BUILTIN_APPS.push({ id: 'calc', createApp: createApp, code: '' });
})();
</script>

<script>/* apps/clock.js */
/* ============================================================
   内置应用 · 时钟（纯代码绘制，无外部资源）
   三个标签页：时钟 / 秒表 / 番茄钟
   ============================================================ */
(function () {
  'use strict';
  if (!window.PHONE_BUILTIN_APPS) window.PHONE_BUILTIN_APPS = [];

  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var POMO_PRESETS = { focus: [25, 45], rest: [5, 15] };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function createApp(phone) {
    var U = phone.utils;

    /* ---------------- 通用小工具 ---------------- */
    function tabBar(tabs, active, onPick) {
      var bar = U.el('div', 'ui-row');
      bar.style.gap = '6px';
      bar.style.background = 'rgba(13,19,48,.06)';
      bar.style.padding = '4px';
      bar.style.borderRadius = '16px';
      tabs.forEach(function (t) {
        var b = U.el('button', 'ui-btn' + (t.key === active ? '' : ' ghost'), t.name);
        b.style.flex = '1';
        b.style.padding = '8px 6px';
        b.style.fontSize = '12.5px';
        b.style.borderRadius = '12px';
        if (t.key !== active) { b.style.background = 'transparent'; b.style.boxShadow = 'none'; }
        b.addEventListener('click', function () { onPick(t.key); });
        bar.appendChild(b);
      });
      return bar;
    }

    /* 按容器实测宽度决定画布逻辑尺寸，随窗口变化重算 */
    function fitCanvas(cv, box, ratio) {
      var w = Math.max(140, Math.round((box.clientWidth || 320) - 4));
      var s = Math.min(w, 300);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(s * dpr);
      cv.height = Math.round(s * ratio * dpr);
      cv.style.width = s + 'px';
      cv.style.height = Math.round(s * ratio) + 'px';
      var g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { g: g, w: s, h: Math.round(s * ratio) };
    }

    function watchResize(cv, draw) {
      function onResize() { draw(); }
      window.addEventListener('resize', onResize);
      ctxApi.onCleanup(function () { window.removeEventListener('resize', onResize); });
    }

    var ctxApi = null;

    /* ============================================================
       标签页一：时钟 —— 低多边形卡通表盘
       ============================================================ */
    function buildClock(host) {
      var wrap = U.el('div');
      var box = U.el('div');
      box.style.display = 'flex';
      box.style.justifyContent = 'center';
      var cv = U.el('canvas');
      cv.style.display = 'block';
      box.appendChild(cv);
      wrap.appendChild(box);

      var digital = U.el('div');
      digital.style.textAlign = 'center';
      digital.style.margin = '12px 0 2px';
      digital.style.fontSize = '30px';
      digital.style.fontWeight = '800';
      digital.style.letterSpacing = '1px';
      digital.style.fontVariantNumeric = 'tabular-nums';
      wrap.appendChild(digital);

      var dateLine = U.el('div', 'ui-muted');
      dateLine.style.textAlign = 'center';
      wrap.appendChild(dateLine);

      var zone = U.el('div', 'ui-muted');
      zone.style.textAlign = 'center';
      zone.style.marginTop = '6px';
      zone.textContent = '当前位置：本机时区 · ' + (-new Date().getTimezoneOffset() / 60) + ' 时区';
      wrap.appendChild(zone);

      host.appendChild(wrap);

      function drawFace() {
        var f = fitCanvas(cv, box, 1);
        var g = f.g, w = f.w, h = f.h;
        var cx = w / 2, cy = h / 2, R = w * 0.46;

        var now = new Date();
        var hh = now.getHours() % 12, mm = now.getMinutes(), ss = now.getSeconds();

        /* 柔和投影 */
        g.save();
        g.globalAlpha = 0.16;
        g.fillStyle = '#4a3a86';
        g.beginPath(); g.ellipse(cx, cy + R * 0.14, R, R * 0.98, 0, 0, Math.PI * 2); g.fill();
        g.restore();

        /* 外壳 */
        g.save();
        g.fillStyle = '#2b2f52';
        g.beginPath(); g.arc(cx, cy, R + 5, 0, Math.PI * 2); g.fill();
        g.restore();

        /* 表盘底：低多边形扇面 */
        var sides = 12;
        var tints = ['#fdfcff', '#f4f7ff', '#e9eefc', '#f7f4ff', '#eef3ff', '#f9fbff'];
        for (var i = 0; i < sides; i++) {
          var a0 = (Math.PI * 2 / sides) * i - Math.PI / 2;
          var a1 = (Math.PI * 2 / sides) * (i + 1) - Math.PI / 2;
          g.beginPath();
          g.moveTo(cx, cy);
          g.lineTo(cx + Math.cos(a0) * R, cy + Math.sin(a0) * R);
          g.lineTo(cx + Math.cos(a1) * R, cy + Math.sin(a1) * R);
          g.closePath();
          g.fillStyle = i % 2 === 0 ? tints[i % tints.length] : '#ffffff';
          g.fill();
          g.strokeStyle = 'rgba(43,47,82,.07)';
          g.lineWidth = 1;
          g.stroke();
        }

        /* 刻度 */
        for (var k = 0; k < 12; k++) {
          var ak = (Math.PI * 2 / 12) * k - Math.PI / 2;
          var big = k % 3 === 0;
          var r0 = R * (big ? 0.74 : 0.81);
          var r1 = R * 0.9;
          g.beginPath();
          g.moveTo(cx + Math.cos(ak) * r0, cy + Math.sin(ak) * r0);
          g.lineTo(cx + Math.cos(ak) * r1, cy + Math.sin(ak) * r1);
          g.lineWidth = big ? Math.max(4, R * 0.055) : Math.max(2, R * 0.028);
          g.lineCap = 'round';
          g.strokeStyle = big ? '#3b3f6b' : 'rgba(59,63,107,.45)';
          g.stroke();
        }
        /* 四角配色三角，增加低多边形质感 */
        var ACC = ['#3ddc97', '#5cc8ff', '#ffb457', '#ff7a8a'];
        for (var q = 0; q < 4; q++) {
          var aq = (Math.PI / 2) * q + Math.PI / 4 - Math.PI / 2;
          g.beginPath();
          g.moveTo(cx + Math.cos(aq) * R * 0.99, cy + Math.sin(aq) * R * 0.99);
          g.lineTo(cx + Math.cos(aq - 0.26) * R * 0.7, cy + Math.sin(aq - 0.26) * R * 0.7);
          g.lineTo(cx + Math.cos(aq + 0.26) * R * 0.7, cy + Math.sin(aq + 0.26) * R * 0.7);
          g.closePath();
          g.globalAlpha = 0.16;
          g.fillStyle = ACC[q];
          g.fill();
          g.globalAlpha = 1;
        }

        var hand = function (angle, len, width, color) {
          var ex = cx + Math.cos(angle) * len, ey = cy + Math.sin(angle) * len;
          g.save();
          g.globalAlpha = 0.18;
          g.strokeStyle = '#2b2f52';
          g.lineWidth = width;
          g.lineCap = 'round';
          g.beginPath(); g.moveTo(cx + 2, cy + 3); g.lineTo(ex + 2, ey + 3); g.stroke();
          g.restore();
          g.beginPath();
          g.moveTo(cx, cy);
          g.lineTo(ex, ey);
          g.lineWidth = width;
          g.lineCap = 'round';
          g.strokeStyle = color;
          g.stroke();
        };

        var aHour = ((hh + mm / 60) / 12) * Math.PI * 2 - Math.PI / 2;
        var aMin = ((mm + ss / 60) / 60) * Math.PI * 2 - Math.PI / 2;
        var aSec = (ss / 60) * Math.PI * 2 - Math.PI / 2;

        hand(aHour, R * 0.46, Math.max(7, R * 0.10), '#3b3f6b');
        hand(aMin, R * 0.66, Math.max(5, R * 0.072), '#5b648f');
        hand(aSec, R * 0.78, Math.max(2, R * 0.032), '#ff7a8a');

        /* 中心圆点 */
        g.beginPath(); g.arc(cx, cy, Math.max(7, R * 0.1), 0, Math.PI * 2);
        g.fillStyle = '#2b2f52'; g.fill();
        g.beginPath(); g.arc(cx - R * 0.02, cy - R * 0.03, Math.max(3, R * 0.035), 0, Math.PI * 2);
        g.fillStyle = '#3ddc97'; g.fill();

        digital.textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
        dateLine.textContent = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · ' + WEEK[now.getDay()];
      }

      drawFace();
      var timer = setInterval(drawFace, 1000);
      ctxApi.onCleanup(function () { clearInterval(timer); });
      watchResize(cv, drawFace);
    }

    /* ============================================================
       标签页二：秒表
       ============================================================ */
    function buildStopwatch(host) {
      var st = { base: 0, t0: 0, running: false, laps: [] };
      var tick = null;

      var card = U.el('div', 'ui-card');
      card.style.textAlign = 'center';
      card.style.padding = '22px 15px';
      var timeEl = U.el('div');
      timeEl.style.fontSize = '40px';
      timeEl.style.fontWeight = '800';
      timeEl.style.fontVariantNumeric = 'tabular-nums';
      timeEl.style.letterSpacing = '1px';
      card.appendChild(timeEl);
      card.appendChild(U.el('div', 'ui-muted', '秒 . 厘秒（1/100 秒）'));
      host.appendChild(card);

      var row = U.el('div', 'ui-row');
      row.style.margin = '12px 0';
      var bMain = U.el('button', 'ui-btn', '开始');
      bMain.style.flex = '1';
      var bLap = U.el('button', 'ui-btn ghost', '分圈');
      var bReset = U.el('button', 'ui-btn ghost', '清零');
      row.appendChild(bMain); row.appendChild(bLap); row.appendChild(bReset);
      host.appendChild(row);

      host.appendChild(U.el('div', 'ui-label', '分圈记录'));
      var list = U.el('div', 'ui-list');
      host.appendChild(list);

      function elapsed() { return st.base + (st.running ? Date.now() - st.t0 : 0); }
      function fmt(ms) {
        var cs = Math.floor(ms / 10) % 100;
        var s = Math.floor(ms / 1000) % 60;
        var m = Math.floor(ms / 60000) % 60;
        var h = Math.floor(ms / 3600000);
        var head = h > 0 ? h + ':' + pad2(m) : String(m);
        return head + ':' + pad2(s) + '.' + pad2(cs);
      }
      function paintTime() { timeEl.textContent = fmt(elapsed()); }

      function paintLaps() {
        list.innerHTML = '';
        if (!st.laps.length) {
          list.appendChild(U.el('div', 'ui-hint', '还没有分圈记录。计时中点「分圈」可以记下一圈，最快的一圈会标成绿色。'));
          return;
        }
        var best = 0;
        st.laps.forEach(function (L, i) { if (L.split < st.laps[best].split) best = i; });
        st.laps.slice().reverse().forEach(function (L) {
          var idx = st.laps.indexOf(L);
          var li = U.el('div', 'li');
          var main = U.el('div', 'li-main');
          var b = U.el('b', null, '第 ' + (idx + 1) + ' 圈' + (idx === best && st.laps.length > 1 ? ' · 最快' : ''));
          if (idx === best && st.laps.length > 1) b.style.color = '#12a86f';
          main.appendChild(b);
          main.appendChild(U.el('small', null, '分圈 ' + fmt(L.split) + ' · 总时 ' + fmt(L.total)));
          li.appendChild(main);
          list.appendChild(li);
        });
      }

      function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
      function startTick() {
        stopTick();
        tick = setInterval(paintTime, 31);
        ctxApi.onCleanup(stopTick);
      }
      function refresh() {
        paintTime(); paintLaps();
        bMain.textContent = st.running ? '暂停' : (elapsed() > 0 ? '继续' : '开始');
      }

      bMain.addEventListener('click', function () {
        if (st.running) {
          st.base = elapsed();
          st.running = false;
          stopTick();
        } else {
          st.t0 = Date.now();
          st.running = true;
          startTick();
        }
        refresh();
      });
      bLap.addEventListener('click', function () {
        if (!st.running && elapsed() === 0) return phone.toast('先开始计时再分圈', 'bad');
        var total = elapsed();
        var prev = st.laps.length ? st.laps[st.laps.length - 1].total : 0;
        st.laps.push({ split: total - prev, total: total });
        paintTime();
        paintLaps();
      });
      bReset.addEventListener('click', function () {
        if (elapsed() === 0 && !st.laps.length) return;
        st.base = 0; st.running = false; st.laps = [];
        stopTick();
        refresh();
        phone.toast('秒表已清零', 'ok');
      });

      refresh();
    }

    /* ============================================================
       标签页三：番茄钟
       ============================================================ */
    function buildPomodoro(host) {
      var cfg = ctxApi.store.get('pomo', {});
      var conf = {
        focus: typeof cfg.focus === 'number' ? cfg.focus : 25,
        rest: typeof cfg.rest === 'number' ? cfg.rest : 5
      };
      var P = { phase: 'focus', running: false, endAt: 0, left: conf.focus * 60000, done: 0 };

      var phaseEl = U.el('div');
      phaseEl.style.textAlign = 'center';
      phaseEl.style.fontWeight = '800';
      phaseEl.style.fontSize = '13px';
      phaseEl.style.letterSpacing = '2px';
      host.appendChild(phaseEl);

      var box = U.el('div');
      box.style.display = 'flex';
      box.style.justifyContent = 'center';
      box.style.margin = '10px 0 0';
      var cv = U.el('canvas');
      cv.style.display = 'block';
      box.appendChild(cv);
      host.appendChild(box);

      var meta = U.el('div', 'ui-muted');
      meta.style.textAlign = 'center';
      meta.style.marginTop = '8px';
      host.appendChild(meta);

      var row = U.el('div', 'ui-row');
      row.style.margin = '12px 0';
      var bMain = U.el('button', 'ui-btn', '开始专注');
      bMain.style.flex = '1';
      var bSkip = U.el('button', 'ui-btn ghost', '重置');
      row.appendChild(bMain); row.appendChild(bSkip);
      host.appendChild(row);

      host.appendChild(U.el('div', 'ui-label', '专注时长（分钟）'));
      var rowF = U.el('div', 'ui-row');
      rowF.style.flexWrap = 'wrap';
      host.appendChild(rowF);

      host.appendChild(U.el('div', 'ui-label', '休息时长（分钟）'));
      var rowR = U.el('div', 'ui-row');
      rowR.style.flexWrap = 'wrap';
      host.appendChild(rowR);

      host.appendChild(U.el('div', 'ui-hint',
        '番茄工作法：专注一段时间后短暂休息，循环几轮效率更高。时长设置会自动保存，下次打开还在。'));

      function presetBtn(kind, m) {
        var on = conf[kind] === m;
        var b = U.el('button', 'ui-btn' + (on ? '' : ' ghost'), m + ' 分钟');
        if (on) { b.style.boxShadow = '0 6px 12px -8px rgba(13,19,48,.9)'; }
        b.addEventListener('click', function () {
          conf[kind] = m;
          ctxApi.store.set('pomo', { focus: conf.focus, rest: conf.rest });
          phone.toast((kind === 'focus' ? '专注' : '休息') + '时长设为 ' + m + ' 分钟', 'ok');
          P.phase = kind;
          stop();
          P.left = totalMs();
          paintPresets();
          paint();
        });
        return b;
      }

      function paintPresets() {
        rowF.innerHTML = '';
        POMO_PRESETS.focus.forEach(function (m) { rowF.appendChild(presetBtn('focus', m)); });
        rowR.innerHTML = '';
        POMO_PRESETS.rest.forEach(function (m) { rowR.appendChild(presetBtn('rest', m)); });
      }

      function totalMs() { return conf[P.phase] * 60000; }
      function remain() { return P.running ? Math.max(0, P.endAt - Date.now()) : P.left; }
      function fmt(ms) {
        var s = Math.ceil(ms / 1000);
        return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
      }

      function resetPhase(phase) {
        stop();
        P.phase = phase;
        P.left = totalMs();
        paintPresets();
        paint();
      }

      function drawRing() {
        var f = fitCanvas(cv, box, 1);
        var g = f.g, w = f.w, h = f.h;
        var cx = w / 2, cy = h / 2, R = w * 0.38, lw = Math.max(11, R * 0.17);
        var pct = totalMs() > 0 ? 1 - remain() / totalMs() : 0;
        pct = U.clamp(pct, 0, 1);
        var isFocus = P.phase === 'focus';
        var c1 = isFocus ? '#ff7a8a' : '#3ddc97';
        var c2 = isFocus ? '#ffb457' : '#5cc8ff';

        g.save();
        g.globalAlpha = 0.14;
        g.fillStyle = isFocus ? '#ff7a8a' : '#3ddc97';
        g.beginPath(); g.arc(cx, cy + R * 0.1, R + lw, 0, Math.PI * 2); g.fill();
        g.restore();

        g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2);
        g.lineWidth = lw; g.strokeStyle = 'rgba(13,19,48,.09)'; g.stroke();

        if (pct > 0.001) {
          var grad = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
          grad.addColorStop(0, c1); grad.addColorStop(1, c2);
          g.beginPath();
          g.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
          g.lineWidth = lw; g.lineCap = 'round';
          g.strokeStyle = grad;
          g.stroke();
        }

        g.textAlign = 'center';
        g.fillStyle = '#0d1330';
        g.font = '800 ' + Math.round(R * 0.46) + 'px "PingFang SC","Microsoft YaHei UI",system-ui,sans-serif';
        g.fillText(fmt(remain()), cx, cy + R * 0.17);
        g.fillStyle = '#5b648f';
        g.font = '700 ' + Math.round(R * 0.16) + 'px "PingFang SC","Microsoft YaHei UI",system-ui,sans-serif';
        g.fillText(isFocus ? '专注中' : '休息中', cx, cy + R * 0.53);
      }

      function paint() {
        drawRing();
        phaseEl.textContent = P.phase === 'focus' ? '🍅 专 注' : '☕ 休 息';
        phaseEl.style.color = P.phase === 'focus' ? '#e03b63' : '#12a86f';
        bMain.textContent = P.running ? '暂停' : (P.left < totalMs() ? '继续' : (P.phase === 'focus' ? '开始专注' : '开始休息'));
        meta.textContent = '本阶段 ' + conf[P.phase] + ' 分钟 · 已完成 ' + P.done + ' 个专注段';
      }

      var iv = null;
      function stop() {
        if (iv) { clearInterval(iv); iv = null; }
        if (P.running) { P.left = Math.max(0, P.endAt - Date.now()); P.running = false; }
      }
      function play() {
        P.endAt = Date.now() + P.left;
        P.running = true;
        if (iv) clearInterval(iv);
        iv = setInterval(function () {
          if (remain() <= 0) { finish(); return; }
          paint();
        }, 250);
      }
      ctxApi.onCleanup(function () { if (iv) clearInterval(iv); });

      function finish() {
        stop();
        var wasFocus = P.phase === 'focus';
        if (wasFocus) P.done += 1;
        P.left = 0;
        paint();
        phone.toast(wasFocus ? '专注结束，去休息一下吧！' : '休息结束，继续加油！', 'ok');
        phone.alert(wasFocus ? '🍅 专注完成' : '☕ 休息结束',
          wasFocus ? '你已完成 ' + P.done + ' 个专注段。\n\n接下来进入 ' + conf.rest + ' 分钟休息。'
            : '休息结束，准备开始下一段 ' + conf.focus + ' 分钟专注。')
          .then(function () { resetPhase(wasFocus ? 'rest' : 'focus'); });
      }

      bMain.addEventListener('click', function () {
        if (P.running) { stop(); paint(); }
        else { if (P.left <= 0) P.left = totalMs(); play(); paint(); }
      });
      bSkip.addEventListener('click', function () {
        stop();
        P.left = totalMs();
        paint();
        phone.toast('已重置本阶段计时', 'ok');
      });

      paintPresets();
      paint();
      watchResize(cv, drawRing);
    }

    /* ============================================================
       mount
       ============================================================ */
    function mount(phoneApi, root, ctx) {
      ctxApi = ctx;
      var view = ctx.store.get('tab', 'clock') || 'clock';
      if (['clock', 'stopwatch', 'pomodoro'].indexOf(view) < 0) view = 'clock';

      function render() {
        root.innerHTML = '';
        ctx.setTitle(view === 'clock' ? '时钟' : (view === 'stopwatch' ? '秒表' : '番茄钟'));
        var wrap = U.el('div');
        wrap.appendChild(tabBar([
          { key: 'clock', name: '时钟' },
          { key: 'stopwatch', name: '秒表' },
          { key: 'pomodoro', name: '番茄钟' }
        ], view, function (k) {
          if (k === view) return;
          view = k;
          ctx.store.set('tab', k);
          render();
        }));
        var inner = U.el('div');
        inner.style.marginTop = '14px';
        wrap.appendChild(inner);
        root.appendChild(wrap);
        if (view === 'clock') buildClock(inner);
        else if (view === 'stopwatch') buildStopwatch(inner);
        else buildPomodoro(inner);
      }

      render();
    }

    return {
      id: 'clock',
      name: '时钟',
      icon: 'emoji:⏰',
      desc: '时钟 / 秒表 / 番茄钟',
      order: 20,
      mount: mount
    };
  }
  window.PHONE_BUILTIN_APPS.push({ id: 'clock', createApp: createApp, code: '' });
})();
</script>

<script>/* apps/notes.js */
/* ============================================================
   内置应用 · 便签（随手记事，本地存档，纯代码实现）
   摩卡咖啡色系：整体换色只作用于便签自己的窗口
   ============================================================ */
(function () {
  'use strict';
  if (!window.PHONE_BUILTIN_APPS) window.PHONE_BUILTIN_APPS = [];

  var NOTES_CSS_ID = 'notes-mocha-css';
  var NOTES_CSS = [
    '/* 摩卡咖啡色系（只作用于 notes 应用窗口，不影响其它应用） */',
    '#apps .app-host[data-app-id="notes"]{background:linear-gradient(180deg,#fdf8f3 0%,#f0e2d5 100%)}',
    '#apps .app-host[data-app-id="notes"] .app-nav{background:#f4e8dd;border-bottom-color:rgba(111,78,55,.16)}',
    '#apps .app-host[data-app-id="notes"] .nav-btn{background:rgba(111,78,55,.10);color:#4a2f1d}',
    '#apps .app-host[data-app-id="notes"] .nav-title{color:#3f2716}',
    '#apps .app-host[data-app-id="notes"] .ui-card{background:#fffaf5;border-color:rgba(111,78,55,.14);box-shadow:0 10px 24px -18px rgba(74,47,29,.55)}',
    '#apps .app-host[data-app-id="notes"] .ui-list .li{background:#fffaf5;border-color:rgba(111,78,55,.14)}',
    '#apps .app-host[data-app-id="notes"] .ui-btn{background:#8a5a3b;color:#fff6ee;box-shadow:0 6px 14px -8px rgba(90,58,41,.9)}',
    '#apps .app-host[data-app-id="notes"] .ui-btn.ghost{background:rgba(111,78,55,.10);color:#5b3a29;box-shadow:none}',
    '#apps .app-host[data-app-id="notes"] .ui-btn.warn{background:#b4523f;color:#fff2ec}',
    '#apps .app-host[data-app-id="notes"] .ui-field{background:#fffdfa;border-color:rgba(111,78,55,.22);color:#3f2716}',
    '#apps .app-host[data-app-id="notes"] .ui-field:focus{border-color:#8a5a3b;box-shadow:0 0 0 3px rgba(138,90,59,.18)}',
    '#apps .app-host[data-app-id="notes"] .ui-label,#apps .app-host[data-app-id="notes"] .ui-muted{color:#8a6a52}',
    '#apps .app-host[data-app-id="notes"] .ui-hint{background:rgba(192,139,92,.16);border-color:rgba(192,139,92,.45);color:#6b4326}',
    '#apps .app-host[data-app-id="notes"] .ui-list .li b{color:#3f2716}',
    '#apps .app-host[data-app-id="notes"] .ui-list .li small{color:#8a6a52}',
    '#apps .app-host[data-app-id="notes"] .nt-dot{width:6px;height:40px;flex:0 0 auto;border-radius:5px;background:linear-gradient(180deg,#c08b5c,#5b3a29)}',
    '#apps .app-host[data-app-id="notes"] .nt-cup{font-size:42px;line-height:1}',
    '/* 排序控制条 */',
    '#apps .app-host[data-app-id="notes"] .nt-sort{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}',
    '#apps .app-host[data-app-id="notes"] .nt-sort .ui-btn{padding:6px 10px;font-size:11.5px}',
    '#apps .app-host[data-app-id="notes"] .nt-sort-on{outline:2px solid rgba(138,90,59,.45);outline-offset:1px}'
  ].join('\n');

  function injectTheme(doc) {
    try {
      if (doc.getElementById(NOTES_CSS_ID)) return;
      var s = doc.createElement('style');
      s.id = NOTES_CSS_ID;
      s.textContent = NOTES_CSS;
      (doc.head || doc.body || doc.documentElement).appendChild(s);
    } catch (e) { /* 注入失败不影响功能 */ }
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function createApp(phone) {
    var U = phone.utils;
    injectTheme(document);

    function fullTime(ts) {
      var d = new Date(ts || Date.now());
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
        ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    function shortTime(ts) {
      var d = Date.now() - (ts || 0);
      if (d < 60000) return '刚刚';
      if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
      if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
      if (d < 86400000 * 7) return Math.floor(d / 86400000) + ' 天前';
      return fullTime(ts);
    }
    function firstLine(body) {
      var s = String(body || '').replace(/\r/g, '').split('\n');
      for (var i = 0; i < s.length; i++) if (s[i].trim()) return s[i].trim();
      return '';
    }
    function plainPreview(body, n) {
      return String(body || '').replace(/\s+/g, ' ').trim().slice(0, n || 46);
    }
    function showTitle(note) {
      return (note.title && note.title.trim()) || firstLine(note.body) || '无标题';
    }
    function safeName(s) {
      return String(s || '').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, ' ').trim().slice(0, 30);
    }

    function mount(phoneApi, root, ctx) {
      var view = 'list';     /* list | edit */
      var currentId = null;
      var saveTimer = null;
      var savedHint = null;
      var relTimer = null;
      var flushEdit = null;  /* 编辑页的「立即保存」，供一键复制等外层逻辑调用 */

      /* ---------------- 数据 ---------------- */
      /* 旧存档没有 created 字段：优先从 id（note-<base36 时间戳>-<序号>）还原创建时间，再退回 updated */
      function createdFromId(id) {
        var m = /^note-([0-9a-z]+)-/.exec(String(id || ''));
        if (!m) return 0;
        var t = parseInt(m[1], 36);
        return isFinite(t) && t > 0 ? t : 0;
      }
      function load() {
        var raw = ctx.store.get('notes', []);
        var list = [];
        if (Object.prototype.toString.call(raw) === '[object Array]') {
          raw.forEach(function (n) {
            if (!n || typeof n !== 'object') return;
            var id = n.id || U.uid('note');
            var updated = typeof n.updated === 'number' ? n.updated : Date.now();
            var created = (typeof n.created === 'number' && n.created > 0) ? n.created : (createdFromId(id) || updated);
            list.push({
              id: id,
              title: typeof n.title === 'string' ? n.title : '',
              body: typeof n.body === 'string' ? n.body : '',
              created: created,
              updated: updated
            });
          });
        }
        return list;
      }
      function save(list) { ctx.store.set('notes', list); }
      function getNote(id) {
        var list = load();
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
      }

      /* ---------------- 排序：修改时间 / 创建时间 / 名称，支持正序倒序 ---------------- */
      var SORT_STORE_KEY = 'sort';
      var SORT_MODES = [
        { key: 'updated', label: '修改时间' },
        { key: 'created', label: '创建时间' },
        { key: 'name', label: '名称' }
      ];
      function sortModeOf(key) {
        for (var i = 0; i < SORT_MODES.length; i++) if (SORT_MODES[i].key === key) return SORT_MODES[i];
        return SORT_MODES[0];
      }
      function loadSort() {
        var raw = ctx.store.get(SORT_STORE_KEY, null);
        var key = (raw && typeof raw.key === 'string') ? raw.key : 'updated';
        if (sortModeOf(key).key !== key) key = 'updated';
        var dir = (raw && raw.dir === 'asc') ? 'asc' : 'desc';
        return { key: key, dir: dir };
      }
      function saveSort(s) { ctx.store.set(SORT_STORE_KEY, { key: s.key, dir: s.dir }); }
      function sortCaption(s) {
        return '按' + sortModeOf(s.key).label + (s.dir === 'asc' ? '正序' : '倒序');
      }
      function compareName(a, b) {
        try {
          if (typeof a.localeCompare === 'function') {
            return a.localeCompare(b, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' });
          }
        } catch (e) { /* 旧浏览器不支持带参数的语言比较，退回逐字比较 */ }
        return a < b ? -1 : (a > b ? 1 : 0);
      }
      function sortNotes(list, s) {
        var arr = list.slice();
        arr.sort(function (a, b) {
          var r;
          if (s.key === 'name') r = compareName(showTitle(a), showTitle(b));
          else if (s.key === 'created') r = a.created - b.created;
          else r = a.updated - b.updated;
          if (r === 0) r = a.updated - b.updated;              /* 同一时刻按修改时间兜底，保证顺序稳定 */
          if (r === 0) r = compareName(String(a.id), String(b.id));
          return s.dir === 'asc' ? r : -r;
        });
        return arr;
      }

      /* ---------------- 渲染入口 ---------------- */
      function render() {
        if (relTimer) { clearInterval(relTimer); relTimer = null; }
        flushEdit = null;
        var acts = U.$('.nav-actions', root.parentNode);
        if (acts) acts.innerHTML = '';
        root.innerHTML = '';
        if (view === 'edit') renderEdit();
        else renderList();
      }

      /* ---------------- 列表页 ---------------- */
      function renderList() {
        if (relTimer) { clearInterval(relTimer); relTimer = null; }
        ctx.setTitle('便签');
        savedHint = null;
        root.innerHTML = '';   /* 切换排序时会直接重绘列表，先清空避免内容叠加 */
        var sort = loadSort();
        var list = sortNotes(load(), sort);

        function setSort(key, dir) {
          var next = loadSort();
          if (key) next.key = key;
          if (dir) next.dir = dir;
          saveSort(next);
          renderList();
        }

        var wrap = U.el('div');

        var head = U.el('div', 'ui-row');
        head.style.justifyContent = 'space-between';
        head.style.flexWrap = 'wrap';
        head.style.gap = '8px';
        head.style.marginBottom = '8px';
        var cnt = U.el('div', 'ui-muted', '共 ' + list.length + ' 条便签 · ' + sortCaption(sort));
        var bNew = U.el('button', 'ui-btn', '＋ 新建便签');
        bNew.style.padding = '8px 13px';
        bNew.style.fontSize = '12.5px';
        bNew.addEventListener('click', newNote);
        head.appendChild(cnt); head.appendChild(bNew);
        wrap.appendChild(head);

        /* 排序条：点一下切换排序依据（修改时间 / 创建时间 / 名称），最后那个按钮切换正序/倒序 */
        var sortBar = U.el('div', 'nt-sort');
        SORT_MODES.forEach(function (mode) {
          var on = mode.key === sort.key;
          var b = U.el('button', 'ui-btn' + (on ? ' nt-sort-on' : ' ghost'), mode.label);
          b.type = 'button';
          b.title = '按' + mode.label + '排序' + (on ? '（当前）' : '');
          b.addEventListener('click', function () {
            if (on && mode.key === sort.key) return;
            setSort(mode.key, null);
          });
          sortBar.appendChild(b);
        });
        var bDir = U.el('button', 'ui-btn ghost', sort.dir === 'asc' ? '↑ 正序' : '↓ 倒序');
        bDir.type = 'button';
        bDir.title = '点击切换正序 / 倒序';
        bDir.addEventListener('click', function () {
          setSort(null, sort.dir === 'asc' ? 'desc' : 'asc');
        });
        sortBar.appendChild(bDir);
        wrap.appendChild(sortBar);

        if (!list.length) {
          var empty = U.el('div', 'ui-card');
          empty.style.textAlign = 'center';
          empty.style.padding = '30px 18px';
          var em = U.el('div', 'nt-cup', '☕');
          empty.appendChild(em);
          var t1 = U.el('div', null, '还没有任何便签');
          t1.style.fontWeight = '800';
          t1.style.margin = '8px 0 4px';
          empty.appendChild(t1);
          empty.appendChild(U.el('div', 'ui-muted', '点上面的「新建便签」，像在咖啡馆的纸巾上随手写一句。'));
          var bNew2 = U.el('button', 'ui-btn', '开始记一条');
          bNew2.style.marginTop = '14px';
          bNew2.addEventListener('click', newNote);
          empty.appendChild(bNew2);
          wrap.appendChild(empty);
          root.appendChild(wrap);
          return;
        }

        var ul = U.el('div', 'ui-list');
        list.forEach(function (n) {
          var li = U.el('div', 'li');
          li.dataset.noteId = n.id;
          li.style.cursor = 'pointer';
          li.addEventListener('click', function () { openNote(n.id); });
          li.appendChild(U.el('div', 'nt-dot'));

          var main = U.el('div', 'li-main');
          var b = U.el('b', null, showTitle(n));
          main.appendChild(b);
          var pv = plainPreview(n.body);
          main.appendChild(U.el('small', null, (pv ? pv : '（空白便签）') + '  ·  ' + shortTime(n.updated)));
          li.appendChild(main);

          var acts = U.el('div', 'ui-row');
          acts.style.gap = '5px';
          var bCopy = U.el('button', 'ui-btn ghost', '复制');
          bCopy.style.padding = '6px 9px'; bCopy.style.fontSize = '11.5px';
          bCopy.title = '一键复制这条便签的标题与正文';
          bCopy.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            copyNote(n);
          });
          var bExp = U.el('button', 'ui-btn ghost', '导出');
          bExp.style.padding = '6px 9px'; bExp.style.fontSize = '11.5px';
          bExp.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            exportNote(n);
          });
          var bDel = U.el('button', 'ui-btn warn', '删除');
          bDel.style.padding = '6px 9px'; bDel.style.fontSize = '11.5px';
          bDel.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            removeNote(n);
          });
          acts.appendChild(bCopy); acts.appendChild(bExp); acts.appendChild(bDel);
          li.appendChild(acts);
          ul.appendChild(li);
        });
        wrap.appendChild(ul);

        wrap.appendChild(U.el('div', 'ui-muted', '点便签进入编辑，内容会在你停下输入后自动保存；「复制」把这条便签整段放进剪贴板。上面的按钮可以切换排序方式与正/倒序。'));
        root.appendChild(wrap);

        relTimer = setInterval(function () {
          if (view !== 'list') return;
          var cur = sortNotes(load(), loadSort());
          var items = U.$$('.li', root);
          var same = items.length === cur.length;
          for (var k = 0; same && k < items.length; k++) {
            if (!items[k].dataset || items[k].dataset.noteId !== cur[k].id) same = false;
          }
          if (!same) { render(); return; }   /* 顺序变了就整页重排，避免文案与条目错位 */
          var lis = U.$$('.li-main small', root);
          for (var i = 0; i < lis.length && i < cur.length; i++) {
            var pv = plainPreview(cur[i].body);
            lis[i].textContent = (pv ? pv : '（空白便签）') + '  ·  ' + shortTime(cur[i].updated);
          }
        }, 30000);
      }

      /* ---------------- 编辑页 ---------------- */
      function renderEdit() {
        var note = getNote(currentId);
        if (!note) { view = 'list'; renderList(); return; }
        savedHint = null;
        ctx.setTitle('编辑便签');

        var wrap = U.el('div');

        var bar = U.el('div', 'ui-row');
        bar.style.marginBottom = '12px';
        bar.style.flexWrap = 'wrap';
        var bBack = U.el('button', 'ui-btn ghost', '‹ 返回列表');
        bBack.style.padding = '8px 12px'; bBack.style.fontSize = '12.5px';
        bBack.addEventListener('click', backToList);
        var bCopy = U.el('button', 'ui-btn', '📋 一键复制');
        bCopy.style.padding = '8px 13px'; bCopy.style.fontSize = '12.5px';
        bCopy.title = '把标题与正文一起复制到剪贴板';
        bCopy.addEventListener('click', function () { copyCurrent(); });
        var bExp = U.el('button', 'ui-btn ghost', '导出 .txt');
        bExp.style.padding = '8px 12px'; bExp.style.fontSize = '12.5px';
        bExp.addEventListener('click', function () { flush(); exportNote(getNote(currentId)); });
        bar.appendChild(bBack); bar.appendChild(bCopy); bar.appendChild(bExp);
        wrap.appendChild(bar);

        var info = U.el('div', 'ui-muted');
        info.textContent = '创建时间：' + fullTime(note.created) + '　·　修改时间：' + fullTime(note.updated);
        info.style.marginBottom = '6px';
        wrap.appendChild(info);

        wrap.appendChild(U.el('div', 'ui-label', '标题'));
        var titleIn = U.el('input', 'ui-field');
        titleIn.type = 'text';
        titleIn.placeholder = '给这条便签起个标题';
        titleIn.value = note.title || '';
        titleIn.maxLength = 80;
        wrap.appendChild(titleIn);

        wrap.appendChild(U.el('div', 'ui-label', '正文'));
        var bodyTa = U.el('textarea', 'ui-field');
        bodyTa.style.minHeight = '190px';
        bodyTa.style.lineHeight = '1.6';
        bodyTa.placeholder = '随手写点什么……';
        bodyTa.value = note.body || '';
        wrap.appendChild(bodyTa);

        var hint = U.el('div', 'ui-hint');
        hint.style.marginTop = '10px';
        hint.textContent = '标题留空时，会自动用正文的第一行作为标题。写完点「📋 一键复制」可整段复制走（或在输入框里选中一部分，只复制选中的内容）。';
        wrap.appendChild(hint);

        var status = U.el('div', 'ui-muted');
        status.style.marginTop = '8px';
        status.textContent = '自动保存已开启 · 输入停止 0.5 秒后写入本地存档';
        wrap.appendChild(status);
        savedHint = status;

        function commit(touch) {
          var list = load();
          for (var i = 0; i < list.length; i++) {
            if (list[i].id === currentId) {
              list[i].title = titleIn.value.trim();
              list[i].body = bodyTa.value;
              list[i].updated = Date.now();
              break;
            }
          }
          save(list);
          return touch !== false;
        }

        function flush() {
          if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
          commit(true);
        }
        flushEdit = flush;

        function schedule() {
          if (saveTimer) clearTimeout(saveTimer);
          if (savedHint) { savedHint.textContent = '正在输入……'; savedHint.style.color = 'var(--ink-soft)'; }
          saveTimer = setTimeout(function () {
            saveTimer = null;
            commit(true);
            if (savedHint) {
              savedHint.textContent = '已保存 ' + fullTime(Date.now());
              savedHint.style.color = '#12a86f';
            }
          }, 500);
        }

        titleIn.addEventListener('input', schedule);
        bodyTa.addEventListener('input', schedule);
        titleIn.addEventListener('blur', flush);
        bodyTa.addEventListener('blur', flush);
        titleIn.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); bodyTa.focus(); }
        });

        ctx.addAction('复制', function () { copyCurrent(); });
        ctx.addAction('保存', function () {
          flush();
          phone.toast('已保存', 'ok');
        }, { ghost: true });
        ctx.addAction('删除', function () { removeNote(getNote(currentId), backToList); }, { ghost: true });

        root.appendChild(wrap);
        setTimeout(function () {
          if (!titleIn.value) titleIn.focus(); else bodyTa.focus();
        }, 30);
      }

      /* ---------------- 行为 ---------------- */
      function newNote() {
        if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
        var list = load();
        var now = Date.now();
        var n = { id: U.uid('note'), title: '', body: '', created: now, updated: now };
        list.push(n);
        save(list);
        currentId = n.id;
        view = 'edit';
        render();
      }

      function openNote(id) {
        currentId = id;
        view = 'edit';
        render();
      }

      function backToList() {
        if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; commitIfEditing(); }
        currentId = null;
        view = 'list';
        render();
      }
      function commitIfEditing() {
        if (view !== 'edit' || !currentId || !root) return;
        var list = load();
        var changed = false;
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === currentId) {
            var ti = U.$('input.ui-field', root);
            var ta = U.$('textarea.ui-field', root);
            if (!ti || !ta) return;
            var nt = ti.value.trim(), nb = ta.value;
            if (list[i].title !== nt || list[i].body !== nb) {
              list[i].title = nt;
              list[i].body = nb;
              list[i].updated = Date.now();
              changed = true;
            }
            break;
          }
        }
        if (changed) save(list);
      }

      function removeNote(n, after) {
        if (!n) return;
        phone.confirm('删除这条便签？', '「' + showTitle(n) + '」将被永久删除，无法恢复。').then(function (yes) {
          if (!yes) return;
          var list = load().filter(function (x) { return x.id !== n.id; });
          save(list);
          phone.toast('已删除便签', 'ok');
          if (typeof after === 'function') after();
          else render();
        });
      }

      function exportNote(n) {
        if (!n) return;
        var txt = '【' + showTitle(n) + '】\n修改时间：' + fullTime(n.updated) + '\n\n' + (n.body || '') + '\n';
        var name = '便签-' + (safeName(showTitle(n)) || '无标题') + '.txt';
        var ok = U.download(name, txt, 'text/plain');
        if (ok) phone.toast('已导出：' + name, 'ok');
      }

      /* ---------------- 一键复制 ---------------- */
      function doCopy(text, what) {
        text = String(text == null ? '' : text);
        if (!text.trim()) return phone.toast('这条便签是空的，没有可复制的内容', 'bad');
        U.copy(text).then(function (ok) {
          if (ok) phone.toast('已复制' + (what || '') + '到剪贴板（' + text.length + ' 字）', 'ok');
          else phone.toast('复制失败：浏览器不允许自动复制，请在输入框里手动选中后按 Ctrl+C', 'bad');
        });
      }
      function selectedIn(el) {
        try {
          if (!el || el.selectionStart == null || el.selectionEnd == null) return '';
          if (el.selectionEnd <= el.selectionStart) return '';
          return String(el.value || '').slice(el.selectionStart, el.selectionEnd);
        } catch (e) { return ''; }
      }
      function noteText(n) {
        if (!n) return '';
        var t = String(n.title || '').trim();
        return (t ? t + '\n\n' : '') + String(n.body || '');
      }
      /* 编辑页：有选中就只复制选中的，否则整条复制 */
      function copyCurrent() {
        if (flushEdit) flushEdit();
        var n = getNote(currentId);
        if (!n) return;
        var ti = U.$('input.ui-field', root);
        var ta = U.$('textarea.ui-field', root);
        var sel = selectedIn(ta) || selectedIn(ti);
        if (sel) return doCopy(sel, '选中的内容');
        doCopy(noteText(n), '这条便签');
      }
      /* 列表页：直接整条复制 */
      function copyNote(n) {
        if (!n) return;
        doCopy(noteText(n), '这条便签');
      }

      /* 关闭应用前兜底保存（只注册一次） */
      ctx.onCleanup(function () {
        if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
        if (relTimer) { clearInterval(relTimer); relTimer = null; }
        commitIfEditing();
      });

      render();
    }

    return {
      id: 'notes',
      name: '便签',
      icon: 'svg:coffee',
      color: 'mocha',
      desc: '摩卡色便签，随手记事可一键复制',
      order: 21,
      mount: mount
    };
  }
  window.PHONE_BUILTIN_APPS.push({ id: 'notes', createApp: createApp, code: '' });
})();
</script>

      s.id = READER_CSS_ID;
      s.textContent = READER_CSS;
      (doc.head || doc.body || doc.documentElement).appendChild(s);
    } catch (e) { /* 注入失败不影响功能 */ }
  }

  /* ---------- 纯函数：检索高亮与划线标记 ---------- */
  function markHTML(text, needles, kw) {
    var raw = String(text == null ? '' : text);
    var spans = [];
    function collect(needle, cls) {
      needle = String(needle == null ? '' : needle);
      if (!needle) return;
      var from = 0, i;
      while ((i = raw.indexOf(needle, from)) >= 0) {
        spans.push({ s: i, e: i + needle.length, cls: cls });
        from = i + needle.length;
      }
    }
    (needles || []).forEach(function (n) { collect(n, 'rd-mark'); });
    collect(kw, 'rd-hit');
    spans.sort(function (a, b) { return a.s - b.s || b.e - a.e; });
    var out = '', pos = 0;
    spans.forEach(function (sp) {
      if (sp.s < pos) return;
      if (sp.s > pos) out += escHTML(raw.slice(pos, sp.s));
      out += '<span class="' + sp.cls + '">' + escHTML(raw.slice(sp.s, sp.e)) + '</span>';
      pos = sp.e;
    });
    out += escHTML(raw.slice(pos));
    return out;
  }
  function escHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function looksBinary(t) {
    var s = String(t || '').slice(0, 4000);
    if (!s) return false;
    var bad = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c === 0) return true;
      if (c < 9 || (c > 13 && c < 32)) bad++;
    }
    return bad > s.length * 0.05;
  }
  function fmtSize(n) {

    if (n < 1024) return n + ' B';

      var runtime = {};                      /* 段落缓存（只放内存，不写存档） */

      /* ---------------- 渲染入口 ---------------- */
      function render() {

      }
      function go(view) { S.view = view; render(); }

      /* ---------------- 书架 ---------------- */
      function renderShelf() {
        ctx.setTitle('阅读器');
        var total = 0;
        books.forEach(function (b) { total += b.text.length; });

        var head = U.el('div', 'ui-row');
        head.style.justifyContent = 'space-between';
        head.style.marginBottom = '10px';

          ? ('共 ' + books.length + ' 本 · 约 ' + (total / 10000).toFixed(1) + ' 万字')
          : '书架还是空的'));
        var bImp = U.el('button', 'ui-btn', '＋ 导入文件');
        bImp.style.padding = '8px 13px'; bImp.style.fontSize = '12.5px';
        bImp.addEventListener('click', importFile);
