          main.appendChild(U.el('b', null, v.name + (v.id === defId ? ' · 默认' : '')));
          main.appendChild(U.el('small', null, v.refAudio));
          main.appendChild(U.el('small', null, '参考文本：' + (v.promptText ? v.promptText.slice(0, 30) : '（空）') +
            ' · ' + v.promptLang + '→' + v.textLang + ' · 语速 ' + v.speed));
          li.appendChild(main);

          var acts = U.el('div', 'ui-row');
          acts.style.gap = '5px';
          var bDef = U.el('button', 'ui-btn ghost', v.id === defId ? '已设为默认' : '设为默认');
          bDef.style.padding = '6px 10px'; bDef.style.fontSize = '11.5px';
          bDef.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            phone.tts.setDefaultVoice(v.id);
            phone.toast('默认音色：' + v.name, 'ok');
            render();
          });
          var bInto = U.el('button', 'ui-btn ghost', '写进接口');
          bInto.style.padding = '6px 10px'; bInto.style.fontSize = '11.5px';
          bInto.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            var ttsApi = phone.apis.resolve('tts');
            if (!ttsApi) return phone.toast('还没有语音合成接口，先去新增一个', 'bad');
            phone.apis.save(Object.assign({}, ttsApi, {
              tts: Object.assign({}, ttsApi.tts, {
                refAudio: v.refAudio, promptText: v.promptText, promptLang: v.promptLang,
                textLang: v.textLang, textSplit: v.textSplit, speed: v.speed
              })
            }));
            phone.toast('已把「' + v.name + '」写进语音接口「' + ttsApi.name + '」', 'ok');
            render();
          });
          var bDel = U.el('button', 'ui-btn warn', '删');
          bDel.style.padding = '6px 10px'; bDel.style.fontSize = '11.5px';
          bDel.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            phone.confirm('删除音色「' + v.name + '」？', '已经在用它的故事不受影响，但下次朗读要重新选音色。').then(function (yes) {
              if (!yes) return;
              phone.tts.voiceRemove(v.id);
              phone.toast('已删除', 'ok');
              render();
            });
          });
          acts.appendChild(bDef); acts.appendChild(bInto); acts.appendChild(bDel);
          li.appendChild(acts);
          ul.appendChild(li);
        });
        frag.appendChild(ul);
        frag.appendChild(U.el('div', 'ui-muted', '提示：GPT-SoVITS 换 GPT / SoVITS 权重（换「模型」）在具体语音接口的编辑页里，' +
          '因为权重是服务端全局的，不属于某个音色。'));
      }

      function renderVoiceEdit(frag) {
        if (!voiceDraft) voiceDraft = blankVoice();
        ctx.setTitle(voiceEditId ? '编辑音色' : '新增音色');
        var back = U.el('div', 'ui-row');
        back.style.marginBottom = '10px';
        var bBack = U.el('button', 'ui-btn ghost', '‹ 返回音色库');
        bBack.style.padding = '8px 12px'; bBack.style.fontSize = '12.5px';
        bBack.addEventListener('click', function () { view = 'voices'; render(); });
        back.appendChild(bBack);
        frag.appendChild(back);

        var box = U.el('div', 'ui-card');
        addText(box, '音色名字', voiceDraft.name, function (v) { voiceDraft.name = v; }, '例如：温柔的妈妈 / 低沉大叔 / 小圆');
        addText(box, '参考音频路径（服务端路径）', voiceDraft.refAudio, function (v) { voiceDraft.refAudio = v; },
          'GPT_SoVITS/pretrained_models/xxx.wav 或 D:\\voices\\ref.wav');
        var ta = U.el('textarea', 'ui-field');
        ta.rows = 2;
        ta.style.minHeight = '60px';
        ta.placeholder = '参考音频里说的那句话（要和音频完全一致，GPT-SoVITS 靠它对齐音色）';
        ta.value = voiceDraft.promptText;
        ta.addEventListener('input', function () { voiceDraft.promptText = ta.value; });
        box.appendChild(U.el('label', 'ui-label', '参考文本'));
        box.appendChild(ta);
        var langOpts = phone.tts.langs().map(function (l) { return [l.key, l.label]; });
        var lr = U.el('div', 'ui-row');
        var c1 = U.el('div'); c1.style.flex = '1';
        addSelect(c1, '参考音频语种', langOpts, voiceDraft.promptLang, function (v) { voiceDraft.promptLang = v; });
        var c2 = U.el('div'); c2.style.flex = '1';
        addSelect(c2, '默认朗读语种', langOpts, voiceDraft.textLang, function (v) { voiceDraft.textLang = v; });
        lr.appendChild(c1); lr.appendChild(c2);
        box.appendChild(lr);
        var sr = U.el('div', 'ui-row');
        var s1 = U.el('div'); s1.style.flex = '1';
        addNumber(s1, '语速（0.5~2）', voiceDraft.speed, function (v) { voiceDraft.speed = v; }, 0.05, 0.5, 2);
        var s2 = U.el('div'); s2.style.flex = '1';
        addSelect(s2, '文本切分方式', phone.tts.splitMethods().map(function (m) { return [m.key, m.label]; }),
          voiceDraft.textSplit, function (v) { voiceDraft.textSplit = v; });
        sr.appendChild(s1); sr.appendChild(s2);
        box.appendChild(sr);
        addText(box, '备注（可选）', voiceDraft.note, function (v) { voiceDraft.note = v; }, '例如：适合讲童话');
        frag.appendChild(box);

        var acts = U.el('div', 'ui-row');
        acts.style.marginTop = '14px'; acts.style.flexWrap = 'wrap';
        var bSave = U.el('button', 'ui-btn', '保存音色');
        bSave.addEventListener('click', function () {
          try {
            var rec = phone.tts.voiceSave(Object.assign({}, voiceDraft, { id: voiceEditId || undefined }));
            if (!phone.tts.defaultVoiceId()) phone.tts.setDefaultVoice(rec.id);
            phone.toast('音色已保存', 'ok');
            view = 'voices';
            render();
          } catch (e) { phone.alert('保存失败', e.message); }
        });
        var bSave2 = U.el('button', 'ui-btn ghost', '保存并设为默认');
        bSave2.addEventListener('click', function () {
          try {
            var rec = phone.tts.voiceSave(Object.assign({}, voiceDraft, { id: voiceEditId || undefined }));
            phone.tts.setDefaultVoice(rec.id);
            phone.toast('已保存并设为默认音色', 'ok');
            view = 'voices';
            render();
          } catch (e) { phone.alert('保存失败', e.message); }
        });
        acts.appendChild(bSave); acts.appendChild(bSave2);
        if (voiceEditId) {
          var bDel = U.el('button', 'ui-btn warn', '删除音色');
          bDel.addEventListener('click', function () {
            phone.confirm('删除这个音色？', '删除后可以在音色库里重新添加。').then(function (yes) {
              if (!yes) return;
              phone.tts.voiceRemove(voiceEditId);
              voiceEditId = null; voiceDraft = null; view = 'voices';
              phone.toast('已删除', 'ok');
              render();
            });
          });
          acts.appendChild(bDel);
        }
        frag.appendChild(acts);
        frag.appendChild(U.el('div', 'ui-muted',
          '参考音频建议 3~10 秒、干净无背景音。为了最好的效果，参考文本要和音频里说的一字不差。'));
      }

      /* ================= GPT-SoVITS 同步启动 ================= */
      function renderBoot(frag) {
        ctx.setTitle('同步启动');
        if (!bootDraft) bootDraft = phone.gsv.config();
        var back = U.el('div', 'ui-row');
        back.style.marginBottom = '10px'; back.style.flexWrap = 'wrap';
        var bBack = U.el('button', 'ui-btn ghost', '‹ 返回');
        bBack.style.padding = '8px 12px'; bBack.style.fontSize = '12.5px';
        bBack.addEventListener('click', function () { view = 'apis'; render(); });
        back.appendChild(bBack);
        var bSave = U.el('button', 'ui-btn', '保存设置');
        bSave.style.padding = '8px 12px'; bSave.style.fontSize = '12.5px';
        bSave.addEventListener('click', function () {
          bootDraft = phone.gsv.save(bootDraft);
          bootMsg = '✅ 设置已保存';
          phone.toast('同步启动设置已保存', 'ok');
          render();
        });
        back.appendChild(bSave);
        frag.appendChild(back);

        frag.appendChild(U.el('div', 'ui-hint',
          '浏览器不能直接启动本机程序，所以「开机顺便拉起 GPT-SoVITS」这件事由启动器脚本完成：' +
          '在这里填好目录与启动命令 → 点「导出配置文件」→ 把下载到的 ' + phone.gsv.iniName() +
          ' 放进 phone.html 同一个文件夹（和「启动小手机.bat」放一起）→ 以后双击启动器，它会先探测、没在跑就拉起来，等它就绪再打开手机。'));

        var box = U.el('div', 'ui-card');
        box.style.marginTop = '10px';

        box.appendChild(toggle('打开手机时同步启动 GPT-SoVITS', !!bootDraft.enabled, function (on) {
          bootDraft.enabled = on;
          bootDraft = phone.gsv.save(bootDraft);
          phone.toast(on ? '已开启：启动器会顺便拉起 GPT-SoVITS' : '已关闭：启动器只打开手机', 'ok');
        }));
        var h0 = U.el('div', 'ui-muted', '关着的时候启动器什么都不做，和以前一样只打开 phone.html。');
        h0.style.marginBottom = '10px';
        box.appendChild(h0);

        /* 探测地址 */
        addSelect(box, '探测哪个地址（也就是语音接口的地址）', [
          ['127.0.0.1', '127.0.0.1（本机，推荐）'],
          ['localhost', 'localhost'],
          ['0.0.0.0', '0.0.0.0（注意：探测用 127.0.0.1 更靠谱）']
        ], bootDraft.host, function (v) {
          bootDraft.host = v;
          bootDraft = phone.gsv.save(bootDraft);
          render();
        });
        addNumber(box, '端口', bootDraft.port, function (v) { bootDraft.port = Number(v) || 9880; }, 1, 1, 65535);
        var rFrom = U.el('div', 'ui-row');
        rFrom.style.flexWrap = 'wrap';
        var bFrom = U.el('button', 'ui-btn ghost', '从当前语音接口读取主机与端口');
        bFrom.style.fontSize = '11.5px'; bFrom.style.padding = '6px 10px';
        bFrom.addEventListener('click', function () {
          var a = phone.apis.resolve('tts');
          if (!a || !a.baseUrl) return phone.toast('还没有配置语音接口地址', 'bad');
          var g = phone.gsv.fromUrl(a.baseUrl);
          if (!g) return phone.toast('这个地址解析不出主机和端口', 'bad');
          bootDraft.host = g.host;
          bootDraft.port = g.port;
          bootDraft = phone.gsv.save(bootDraft);
          phone.toast('已读取：' + g.host + ':' + g.port, 'ok');
          render();
        });
        rFrom.appendChild(bFrom);
        box.appendChild(rFrom);

        /* 工作目录 + 启动命令 */
        addText(box, 'GPT-SoVITS 目录（启动命令会在这个目录里跑）', bootDraft.workdir, function (v) { bootDraft.workdir = v; },
          '例如：E:\\GPT-SoVITS 或 D:\\AI\\GPT-SoVITS-v2');
        addText(box, '启动命令', bootDraft.command, function (v) { bootDraft.command = v; },
          '例如：python api_v2.py -a 127.0.0.1 -p 9880 -c GPT_SoVITS/configs/tts_infer.yaml');
        var pre = U.el('div', 'ui-row');
        pre.style.flexWrap = 'wrap'; pre.style.marginTop = '6px';
        phone.gsv.commands().forEach(function (c) {
          var b = U.el('button', 'ui-btn ghost', c.name);
          b.style.fontSize = '11.5px'; b.style.padding = '5px 10px';
          b.title = c.cmd;
          b.addEventListener('click', function () {
            bootDraft.command = c.cmd;
            bootDraft = phone.gsv.save(bootDraft);
            phone.toast('已套用：' + c.name, 'ok');
            render();
          });
          pre.appendChild(b);
        });
        box.appendChild(pre);
        hint(box, '整合包通常用 runtime\\python.exe 或 go-webui.bat；命令里不要带 & | < > 这些符号，' +
          '否则批处理会解析错。工作目录留空就在小手机文件夹里执行命令。');

        /* 等待与超时 */
        var wr = U.el('div', 'ui-row');
        var w1 = U.el('div'); w1.style.flex = '1';
        addNumber(w1, '最多等多少秒', bootDraft.wait, function (v) { bootDraft.wait = Number(v) || 90; }, 5, 10, 600);
        var w2 = U.el('div'); w2.style.flex = '1';
        addSelect(w2, '等超时了怎么办', [['open', '照样打开手机（推荐）'], ['stop', '先别开，让我看看日志']],
          bootDraft.onFail, function (v) { bootDraft.onFail = v; bootDraft = phone.gsv.save(bootDraft); });
        wr.appendChild(w1); wr.appendChild(w2);
        box.appendChild(wr);
        hint(box, 'GPT-SoVITS 首次加载模型可能要几十秒到几分钟，等不及就先把「最多等多少秒」调大。');

        frag.appendChild(box);

        /* 导出 */
        var act = U.el('div', 'ui-row');
        act.style.marginTop = '12px'; act.style.flexWrap = 'wrap';
        var bIni = U.el('button', 'ui-btn', '⬇ 导出配置文件（' + phone.gsv.iniName() + '）');
        bIni.addEventListener('click', function () {
          bootDraft = phone.gsv.save(bootDraft);
          U.download(phone.gsv.iniName(), phone.gsv.ini(bootDraft), 'text/plain');
          bootMsg = '✅ 已导出 ' + phone.gsv.iniName() + '，把它放到 phone.html 同一个文件夹里就行。';
          render();
        });
        var bCopy = U.el('button', 'ui-btn ghost', '复制配置内容');
        bCopy.addEventListener('click', function () {
          U.copy(phone.gsv.ini(bootDraft)).then(function (ok) {
            phone.toast(ok ? '配置已复制' : '复制失败，可以直接导出文件', ok ? 'ok' : 'bad');
          });
        });
        var bPing = U.el('button', 'ui-btn ghost', '🔍 检测现在是否在运行');
        bPing.addEventListener('click', function () {
          bootPing = '检测中…';
          render();
          phone.gsv.ping('http://' + bootDraft.host + ':' + bootDraft.port).then(function (r) {
            bootPing = r.on ? ('✅ 在运行：' + r.url) : ('❌ 没连上：' + r.url);
            render();
          });
        });
        act.appendChild(bIni); act.appendChild(bCopy); act.appendChild(bPing);
        frag.appendChild(act);

        if (bootPing) {
          var bp = U.el('div', 'ui-muted', bootPing);
          bp.style.marginTop = '8px';
          frag.appendChild(bp);
        }
        if (bootMsg) {
          var bm = U.el('div', 'ui-hint', bootMsg);
          bm.style.marginTop = '8px';
          frag.appendChild(bm);
        }

        var how = U.el('div', 'ui-card');
        how.style.marginTop = '12px';
        how.appendChild(U.el('b', null, '启动器会做什么'));
        var ol = U.el('div', 'ui-muted');
        ol.innerHTML = '1. 读小手机文件夹里的 <code>' + U.esc(phone.gsv.iniName()) + '</code>（没有就跳过这一步）；<br>' +
          '2. 探测 <b>' + U.esc(bootDraft.host) + ':' + bootDraft.port + '</b> —— 已经在跑就不重复启动；<br>' +
          '3. 没在跑，就在工作目录里执行启动命令（新开一个窗口，日志看得见）；<br>' +
          '4. 最多等 ' + bootDraft.wait + ' 秒，端口一通就继续，' +
          (bootDraft.onFail === 'stop' ? '超时则停下来，让你先看日志。' : '超时也照样打开手机（语音可能会失败，可以稍后重试）。') +
          '<br><br>顺带一提：<code>' + U.esc(phone.gsv.launcher()) + '</code> 也可以单独双击，用来手动拉起 GPT-SoVITS。';
        how.appendChild(ol);
        frag.appendChild(how);
        frag.appendChild(U.el('div', 'ui-muted',
          '改完这里的设置后记得再点一次「导出配置文件」并覆盖文件夹里的旧文件 —— 启动器读的是那个文件，不是浏览器里的存档。'));
      }

      function toggle(label, on, onChange) {
        var wrap = U.el('div', 'ui-row');
        var t = U.el('div', null, label);
        t.style.flex = '1'; t.style.fontSize = '13px'; t.style.fontWeight = '600';
        var sw = U.el('button', 'ui-btn' + (on ? '' : ' ghost'));
        sw.style.minWidth = '72px';
        sw.textContent = on ? '已开启' : '已关闭';
        sw.addEventListener('click', function () {
          on = !on;
          sw.className = 'ui-btn' + (on ? '' : ' ghost');
          sw.textContent = on ? '已开启' : '已关闭';
          onChange && onChange(on);
        });
        wrap.appendChild(t); wrap.appendChild(sw);
        return wrap;
      }

      render();

      /* 关闭设置页时把试听的播放器停掉，免得音频还在响 */
      ctx.onCleanup(function () { stopPreview(); });
    }

    return {
      id: 'settings',
      name: '设置',
      icon: 'svg:gear',
      desc: '壁纸、息屏、API 管理、备份与关于',
      order: 82,
      mount: mount
    };
  }
  window.PHONE_BUILTIN_APPS.push({ id: 'settings', createApp: createApp, code: '' });
})();
</script>

<script>/* games/g2048.js */
/* ============================================================
   内置应用 · 2048（纯代码绘制，无外部资源）
   ============================================================ */
(function () {
  'use strict';
  if (!window.PHONE_BUILTIN_APPS) window.PHONE_BUILTIN_APPS = [];

  var SIZE = 4;
  var CELLS = SIZE * SIZE;
  var CSS_ID = 'g2048-style';
  var CSS = [
    '.g2048-wrap{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px;box-sizing:border-box;font-family:inherit;color:#0d1330}',
    '.g2048-hud{display:flex;gap:8px;flex:0 0 auto}',
    '.g2048-score{flex:1;background:#fff;border-radius:14px;padding:6px 10px 7px;text-align:center;border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 20px -18px rgba(13,19,48,.75)}',
    '.g2048-score span{display:block;font-size:10.5px;font-weight:700;color:#5b648f;letter-spacing:.6px}',
    '.g2048-score b{font-size:18px;font-weight:800;line-height:1.15}',
    '.g2048-boardWrap{position:relative;flex:1;min-height:0;display:grid;place-items:center}',
    '.g2048-board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:var(--gp,8px);padding:var(--gp,8px);background:rgba(13,19,48,.10);border-radius:20px;box-shadow:inset 0 2px 6px rgba(13,19,48,.10);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}',
    '.g2048-cell{background:rgba(255,255,255,.55);border-radius:calc(var(--gp,8px) * 1.8);display:grid;place-items:center;overflow:hidden}',
    '.g2048-tile{width:100%;height:100%;border-radius:calc(var(--gp,8px) * 1.8);display:grid;place-items:center;font-weight:800;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.10),0 2px 5px -2px rgba(13,19,48,.35)}',
    '@keyframes g2048Appear{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}',
    '@keyframes g2048Merge{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}',
    '.g2048-tile.appear{animation:g2048Appear .14s ease-out both}',
    '.g2048-tile.merge{animation:g2048Merge .17s cubic-bezier(.3,1.5,.5,1) both}',
    '.g2048-foot{flex:0 0 auto;text-align:center;font-size:11.5px;color:#5b648f;line-height:1.45;min-height:16px}',
    '.g2048-over{position:absolute;left:0;right:0;top:0;bottom:0;display:none;place-items:center;background:rgba(238,242,251,.70);backdrop-filter:blur(3px);border-radius:20px;z-index:4}',
    '.g2048-over.show{display:grid}',
    '.g2048-over .box{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:16px 20px;text-align:center;box-shadow:0 24px 44px -24px rgba(13,19,48,.75)}',
    '.g2048-over b{font-size:17px;font-weight:800}',
    '.g2048-over small{font-size:12px;color:#5b648f}'
  ].join('');

  /* 每种数值一套配色：[底色, 字色] */
  var TILE_COLORS = {
    2: ['#ffe9c7', '#8a5a10'],
    4: ['#ffd79a', '#7a4a08'],
    8: ['#ffb457', '#5a2f00'],
    16: ['#ff9a5c', '#ffffff'],
    32: ['#ff7a8a', '#ffffff'],
    64: ['#e03b63', '#ffffff'],
    128: ['#a98bff', '#ffffff'],
    256: ['#6c4bd8', '#ffffff'],
    512: ['#5cc8ff', '#0b3a63'],
    1024: ['#2b6de0', '#ffffff'],
    2048: ['#3ddc97', '#04321f'],
    4096: ['#12a86f', '#ffffff'],
    8192: ['#0d1330', '#ffd79a']
  };
  var BIG_COLOR = ['#0d1330', '#ffd79a'];

  var KEY_DIR = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    h: 'left', l: 'right', k: 'up', j: 'down'
  };

  function injectCss() {
    if (document.getElementById(CSS_ID)) return;
    var s = document.createElement('style');
    s.id = CSS_ID;
    s.textContent = CSS;
    document.head.appendChild(s);
  }
  function colorOf(v) { return TILE_COLORS[v] || BIG_COLOR; }
  function fontRatio(v) {
    var len = String(v).length;
    if (len <= 2) return 0.44;
    if (len === 3) return 0.34;
    if (len === 4) return 0.27;
    if (len === 5) return 0.22;
    return 0.18;
  }
  function newGrid() {
    var a = [], i;
    for (i = 0; i < CELLS; i++) a.push(0);
    return a;
  }
  function toInt(v) {
    var n = Math.floor(Number(v));
    return (isFinite(n) && n > 0) ? n : 0;
  }
  function hasTile(g) {
    for (var i = 0; i < g.length; i++) if (g[i]) return true;
    return false;
  }
  function maxOf(g) {
    var m = 0;
    for (var i = 0; i < g.length; i++) if (g[i] > m) m = g[i];
    return m;
  }
  /* 还能不能走：有空位，或有相邻同值 */
  function canMove(g) {
    var r, c, i, v;
    for (i = 0; i < g.length; i++) if (!g[i]) return true;
    for (r = 0; r < SIZE; r++) {
      for (c = 0; c < SIZE; c++) {
        v = g[r * SIZE + c];
        if (c + 1 < SIZE && g[r * SIZE + c + 1] === v) return true;
        if (r + 1 < SIZE && g[(r + 1) * SIZE + c] === v) return true;
      }
    }
    return false;
  }
  /* 把一条线往「前」压缩合并；merged 记录结果线里被合并出来的下标 */
  function slide(vals) {
    var packed = [], line = [], merged = [], gained = 0, i;
    for (i = 0; i < vals.length; i++) if (vals[i]) packed.push(vals[i]);
    for (i = 0; i < packed.length; i++) {
      if (i + 1 < packed.length && packed[i] === packed[i + 1]) {
        var nv = packed[i] * 2;
        line.push(nv);
        merged.push(line.length - 1);
        gained += nv;
        i++;
      } else {
        line.push(packed[i]);
      }
    }
    while (line.length < vals.length) line.push(0);
    return { line: line, merged: merged, gained: gained };
  }
  /* 第 line 条线（从移动方向的一端算起）的 4 个格子下标 */
  function lineIdx(dir, line) {
    var out = [], k;
    for (k = 0; k < SIZE; k++) {
      if (dir === 'left') out.push(line * SIZE + k);
      else if (dir === 'right') out.push(line * SIZE + (SIZE - 1 - k));
      else if (dir === 'up') out.push(k * SIZE + line);
      else out.push((SIZE - 1 - k) * SIZE + line);
    }
    return out;
  }

  function createApp(phone) {
    var U = phone.utils;

    function scoreBox(label) {
      var box = U.el('div', 'g2048-score');
      box.appendChild(U.el('span', null, label));
      var val = U.el('b', null, '0');
      box.appendChild(val);
      return { box: box, val: val };
    }

    function mount(phoneApi, root, ctx) {
      injectCss();
      ctx.useFullBody();
      var store = ctx.store;

      /* ---------- 游戏状态（存档在 ctx.store） ---------- */
      var grid = newGrid();
      var score = 0, best = 0, won = false, over = false;
      var newIdx = [], mergeIdx = [];
      var metric = { cell: 60, gap: 8 };
      var layoutRaf = 0;

      /* ---------- 界面 ---------- */
      var wrap = U.el('div', 'g2048-wrap');
      var hud = U.el('div', 'g2048-hud');
      var sScore = scoreBox('得分');
      var sBest = scoreBox('最高分');
      hud.appendChild(sScore.box);
      hud.appendChild(sBest.box);

      var boardWrap = U.el('div', 'g2048-boardWrap');
      var board = U.el('div', 'g2048-board');
      var cells = [], i, cell;
      for (i = 0; i < CELLS; i++) {
        cell = U.el('div', 'g2048-cell');
        cells.push(cell);
        board.appendChild(cell);
      }
      var overEl = U.el('div', 'g2048-over');
      var obox = U.el('div', 'box');
      var otitle = U.el('b', null, '无法移动了');
      var osub = U.el('small');
      var obtn = U.el('button', 'ui-btn', '重开');
      obtn.type = 'button';
      obtn.addEventListener('click', function () { newGame(); });
      obox.appendChild(otitle);
      obox.appendChild(osub);
      obox.appendChild(obtn);
      overEl.appendChild(obox);
      boardWrap.appendChild(board);
      boardWrap.appendChild(overEl);

      var foot = U.el('div', 'g2048-foot', '方向键 / WASD 移动 · 触摸滑动、鼠标拖拽也能玩');
      wrap.appendChild(hud);
      wrap.appendChild(boardWrap);
      wrap.appendChild(foot);
      root.appendChild(wrap);

      ctx.addAction('新游戏', function () { newGame(); });

      /* ---------- 存档读取 ---------- */
      function save() {
        store.set('state', { grid: grid.slice(), won: won, over: over });
        store.set('score', score);
        store.set('best', best);
      }
      function load() {
        best = toInt(store.get('best', 0));
        var sc = toInt(store.get('score', 0));
        var st = store.get('state', null);
        var g = st && st.grid && st.grid.length === CELLS ? st.grid : null;
        if (!g) return false;
        var out = [], i2, v;
        for (i2 = 0; i2 < CELLS; i2++) {
          v = toInt(g[i2]);
          out.push((v > 0 && (v & (v - 1)) === 0) ? v : 0);
        }
        if (!hasTile(out)) return false;
        grid = out;
        score = sc;
        won = !!st.won;
        over = !!st.over;
        return true;
      }

      /* ---------- 渲染 ---------- */
      function render() {
        for (var k = 0; k < CELLS; k++) {
          var c = cells[k];
          c.innerHTML = '';
          var v = grid[k];
          if (!v) continue;
          var t = U.el('div', 'g2048-tile', String(v));
          var col = colorOf(v);
          t.style.background = col[0];
          t.style.color = col[1];
          t.style.fontSize = Math.max(11, Math.round(metric.cell * fontRatio(v))) + 'px';
          if (newIdx.indexOf(k) >= 0) t.classList.add('appear');
          if (mergeIdx.indexOf(k) >= 0) t.classList.add('merge');
          c.appendChild(t);
        }
        updateHud();
        renderOver();
      }
      function updateHud() {
        sScore.val.textContent = String(score);
        sBest.val.textContent = String(best);
      }
      function renderOver() {
        if (over) {
          otitle.textContent = maxOf(grid) >= 2048 ? '这局很精彩！' : '无法移动了';
          osub.textContent = '本局得分 ' + score + ' · 最高分 ' + best;
          overEl.classList.add('show');
        } else {
          overEl.classList.remove('show');
        }
        foot.textContent = won
          ? '已达成 2048！可以继续挑战更高分 🎉'
          : '方向键 / WASD 移动 · 触摸滑动、鼠标拖拽也能玩';
      }

      /* ---------- 自适应尺寸 ---------- */
      function layout() {
        var w = root.clientWidth || 0;
        var h = root.clientHeight || 0;
        if (!w || !h) return;
        var hudH = hud.offsetHeight || 44;
        var footH = foot.offsetHeight || 16;
        var availH = h - hudH - footH - 44;
        var availW = w - 24;
        var size = Math.floor(Math.min(availW, availH));
        size = Math.max(120, size);
        var gap = Math.max(5, Math.round(size * 0.032));
        metric.gap = gap;
        metric.cell = (size - gap * (SIZE + 1)) / SIZE;
        board.style.width = size + 'px';
        board.style.height = size + 'px';
        board.style.setProperty('--gp', gap + 'px');
        render();
      }
      function onResize() {
        if (layoutRaf) return;
        layoutRaf = requestAnimationFrame(function () { layoutRaf = 0; layout(); });
      }
      window.addEventListener('resize', onResize);

      /* ---------- 规则 ---------- */
      function spawn() {
        var empty = [], k;
        for (k = 0; k < CELLS; k++) if (!grid[k]) empty.push(k);
        if (!empty.length) return -1;
        var p = empty[Math.floor(Math.random() * empty.length)];
        grid[p] = Math.random() < 0.9 ? 2 : 4;
        return p;
      }
      function seed() {
        newIdx = [];
        mergeIdx = [];
        var a = spawn();
        var b = spawn();
        if (a >= 0) newIdx.push(a);
        if (b >= 0) newIdx.push(b);
      }
      function startNew() {
        grid = newGrid();
        score = 0;
        won = false;
        over = false;
        seed();
        render();
        save();
      }
      function newGame() {
        startNew();
        phone.toast('已开新局，加油！', 'ok');
      }
      function checkEnd() {
        if (!won && maxOf(grid) >= 2048) {
          won = true;
          phone.toast('🎉 达成 2048！可以继续挑战', 'ok');
        }
        if (!over && !canMove(grid)) {
          over = true;
          phone.toast('无法移动了，本局结束', 'bad');
        }
      }
      function move(dir) {
        if (over) return;
        var gained = 0, merges = [], changed = false, line, k, m;
        for (line = 0; line < SIZE; line++) {
          var idx = lineIdx(dir, line);
          var vals = [grid[idx[0]], grid[idx[1]], grid[idx[2]], grid[idx[3]]];
          var res = slide(vals);
          for (k = 0; k < SIZE; k++) {
            if (grid[idx[k]] !== res.line[k]) changed = true;
            grid[idx[k]] = res.line[k];
          }
          gained += res.gained;
          for (m = 0; m < res.merged.length; m++) merges.push(idx[res.merged[m]]);
        }
        if (!changed) return;
        score += gained;
        if (score > best) best = score;
        mergeIdx = merges;
        var sp = spawn();
        newIdx = sp >= 0 ? [sp] : [];
        checkEnd();
        render();
        save();
      }

      /* ---------- 键盘 ---------- */
      ctx.onKey(function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        var k = String(e.key || '');
        var low = k.toLowerCase();
        if (low === 'r') {
          e.preventDefault();
          newGame();
          return;
        }
        var dir = KEY_DIR[k] || KEY_DIR[low];
        if (!dir) return;
        e.preventDefault();
        move(dir);
      });

      /* ---------- 触摸 / 鼠标滑动 ---------- */
      var THRESH = 24;
      var sx = 0, sy = 0, tracking = false, dragging = false;
      function begin(x, y) { sx = x; sy = y; tracking = true; }
      function stepAt(x, y) {
        if (!tracking) return;
        var dx = x - sx, dy = y - sy;
        if (Math.abs(dx) < THRESH && Math.abs(dy) < THRESH) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
        else move(dy > 0 ? 'down' : 'up');
        sx = x;
        sy = y;
      }
      function stopTrack() { tracking = false; dragging = false; }
      function onTouchStart(e) {
        if (e.touches.length !== 1) { tracking = false; return; }
        begin(e.touches[0].clientX, e.touches[0].clientY);
      }
      function onTouchMove(e) {
        if (!tracking) return;
        if (e.cancelable) e.preventDefault();
        var t = e.touches[0];
        if (t) stepAt(t.clientX, t.clientY);
      }
      function onTouchEnd(e) {
        var t = e.changedTouches && e.changedTouches[0];
        if (t && tracking) stepAt(t.clientX, t.clientY);
        tracking = false;
      }
      function onMouseDown(e) {
        dragging = true;
        begin(e.clientX, e.clientY);
        e.preventDefault();
      }
      function onMouseMove(e) { if (dragging) stepAt(e.clientX, e.clientY); }
      function onMouseUp() { stopTrack(); }

      board.addEventListener('touchstart', onTouchStart, { passive: true });
      board.addEventListener('touchmove', onTouchMove, { passive: false });
      board.addEventListener('touchend', onTouchEnd, { passive: true });
      board.addEventListener('touchcancel', stopTrack, { passive: true });
      board.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);

      ctx.onCleanup(function () {
        window.removeEventListener('resize', onResize);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        board.removeEventListener('touchstart', onTouchStart);
        board.removeEventListener('touchmove', onTouchMove);
        board.removeEventListener('touchend', onTouchEnd);
        board.removeEventListener('touchcancel', stopTrack);
        board.removeEventListener('mousedown', onMouseDown);
        if (layoutRaf) { cancelAnimationFrame(layoutRaf); layoutRaf = 0; }
      });

      /* ---------- 启动 ---------- */
      if (!load()) {
        grid = newGrid();
        score = 0;
        won = false;
        over = false;
        seed();
      }
      layout();
      save();
    }

    return {
      id: 'g2048',
      name: '2048',
      icon: 'emoji:🔢',
      desc: '合并数字方块，冲 2048',
      order: 10,
      mount: mount
    };
  }
  window.PHONE_BUILTIN_APPS.push({ id: 'g2048', createApp: createApp, code: '' });
})();
</script>

<script>/* games/gomoku.js */
/* ============================================================
   内置游戏 · 五子棋（纯代码绘制棋盘，AI 由本地评估函数驱动，不调用任何接口）
   ------------------------------------------------------------------
   规则：15×15 棋盘，黑先行，横竖斜任意方向先连成 5 子者胜。
   玩家执黑（默认先手），电脑执白。
   特色：标题栏「💡 求助」按钮 —— 用同一套引擎（最高难度）算出
         玩家当前的最佳一步，在棋盘上用金色标记提示出来。
   ============================================================ */
(function () {
  'use strict';
  if (!window.PHONE_BUILTIN_APPS) window.PHONE_BUILTIN_APPS = [];

  var N = 15;                 /* 棋盘边长 */
  var DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
  var WIN = 10000000;

  /* 棋型分值：[连子数][活/死] —— 活 = 两端都空（open） */
  var PAT = [
    [0, 0, 0],        /* 0 连：占位 */
    [12, 6, 2],       /* 1 连 */
    [120, 70, 18],    /* 2 连 */
    [1400, 420, 90],  /* 3 连 */
    [WIN, 26000, 900],/* 4 连 */
    [WIN, WIN, WIN]   /* 5 连以上 */
  ];

  var CSS_ID = 'gomoku-style';
  var CSS = [
    '.gomoku-wrap{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;box-sizing:border-box;font-family:inherit;color:#0d1330}',
    '.gomoku-hud{display:flex;gap:8px;flex:0 0 auto}',
    '.gomoku-card{flex:1;min-width:0;background:#fff;border-radius:14px;padding:5px 10px 6px;text-align:center;border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 20px -18px rgba(13,19,48,.75)}',
    '.gomoku-card span{display:block;font-size:10px;font-weight:700;color:#5b648f;letter-spacing:.5px;white-space:nowrap}',
    '.gomoku-card b{font-size:15px;font-weight:800;line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
    '.gomoku-card.diff .bwrap{position:relative}',
    '.gomoku-arena{position:relative;flex:1;min-height:0;display:grid;place-items:center}',
    '.gomoku-canvas{display:block;border-radius:16px;box-shadow:0 18px 32px -24px rgba(13,19,48,.9);touch-action:manipulation;cursor:pointer}',
    '.gomoku-hintLayer{position:absolute;pointer-events:none;z-index:5}',
    '.gomoku-hintDot{position:absolute;border-radius:50%;box-sizing:border-box;border:2px dashed #ffb457;background:rgba(255,220,140,.35);animation:goHint 1.05s ease-in-out infinite;box-shadow:0 0 0 3px rgba(255,255,255,.55)}',
    '@keyframes goHint{0%,100%{transform:scale(.78);opacity:.85}50%{transform:scale(1.12);opacity:1}}',
    '.gomoku-foot{flex:0 0 auto;text-align:center;font-size:11.5px;color:#5b648f;line-height:1.45;min-height:16px}',
    '.gomoku-over{position:absolute;left:0;right:0;top:0;bottom:0;display:none;place-items:center;background:rgba(238,242,251,.72);backdrop-filter:blur(3px);border-radius:16px;z-index:6}',
    '.gomoku-over.show{display:grid}',
    '.gomoku-over .box{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:16px 20px;text-align:center;box-shadow:0 24px 44px -24px rgba(13,19,48,.75)}',
    '.gomoku-over b{font-size:17px;font-weight:800}',
    '.gomoku-over small{font-size:12px;color:#5b648f}',
    '.gomoku-shadow{opacity:.42}'
  ].join('');

  var DIFFS = [
    { name: '简单', depth: 2, noise: 0.40, alt: 6 },
    { name: '普通', depth: 2, noise: 0.12, alt: 3 },
    { name: '困难', depth: 4, noise: 0.00, alt: 1 }
  ];

  function injectCss() {
    if (document.getElementById(CSS_ID)) return;
    var s = document.createElement('style');
    s.id = CSS_ID;
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  function toInt(v) {
    var n = Math.floor(Number(v));
    return (isFinite(n) && n > 0) ? n : 0;
  }

  /* ============================================================
     引擎部分（纯函数，只操作长度为 N*N 的数组；0 空 / 1 黑 / 2 白）
     ============================================================ */
  function idx(x, y) { return y * N + x; }
  function inside(x, y) { return x >= 0 && y >= 0 && x < N && y < N; }
  function newBoard() {
    var b = [], i;
    for (i = 0; i < N * N; i++) b.push(0);
    return b;
  }
  function countStones(b) {
    var n = 0, i;
    for (i = 0; i < b.length; i++) if (b[i]) n++;
    return n;
  }
  /* 该点落子后是否连成 5 子（只看经过该点的四条线） */
  function isFive(b, x, y) {
    var p = b[idx(x, y)];
    if (!p) return false;
    for (var d = 0; d < 4; d++) {
      var dx = DIRS[d][0], dy = DIRS[d][1], n = 1, k, nx, ny;
      for (k = 1; k < N; k++) {
        nx = x + dx * k; ny = y + dy * k;
        if (!inside(nx, ny) || b[idx(nx, ny)] !== p) break;
        n++;
      }
      for (k = 1; k < N; k++) {
        nx = x - dx * k; ny = y - dy * k;
        if (!inside(nx, ny) || b[idx(nx, ny)] !== p) break;
        n++;
      }
      if (n >= 5) return true;
    }
    return false;
  }
  function checkWin(b) {
    var i, x, y;
    for (i = 0; i < b.length; i++) {
      if (!b[i]) continue;
      x = i % N; y = (i - x) / N;
      if (isFive(b, x, y)) return b[i];
    }
    return 0;
  }

  /* 线型：从经过 (x,y) 的一条线上取一段（半径 4）的字符串，'.' 空 'x' 己方 'o' 对方 */
  function lineStr(b, x, y, dx, dy, me) {
    var s = '', k, nx, ny, v;
    for (k = -4; k <= 4; k++) {
      if (k === 0) { s += 'x'; continue; }
      nx = x + dx * k; ny = y + dy * k;
      if (!inside(nx, ny)) { s += '#'; continue; }
      v = b[idx(nx, ny)];
      s += v === 0 ? '.' : (v === me ? 'x' : 'o');
    }
    return s;
  }
  /* 把「.xxx.」这类的 (连子数, 活/死) 转成分值 */
  function patScore(run, open) {
    run = run > 5 ? 5 : run;
    var row = PAT[run] || PAT[5];
    if (run >= 5) return WIN;
    return open === 2 ? row[0] : (open === 1 ? row[1] : row[2]);
  }
  /* 单点分值：四条线里取最强的两种棋型（避免十字交叉被重复计分） */
  function pointScore(b, x, y, me) {
    var parts = [], d, s, k, run, open, a, bb;
    for (d = 0; d < 4; d++) {
      s = lineStr(b, x, y, DIRS[d][0], DIRS[d][1], me);
      run = 1; open = 0;
      for (k = 3; k >= 0; k--) {
        if (s.charAt(k) === 'x') run++;
        else { if (s.charAt(k) === '.') open++; break; }
      }
      for (k = 5; k <= 8; k++) {
        if (s.charAt(k) === 'x') run++;
        else { if (s.charAt(k) === '.') open++; break; }
      }
      parts.push(patScore(run, open));
    }
    parts.sort(function (p, q) { return q - p; });
    a = parts[0] || 0;
    bb = parts[1] || 0;
    return a + bb * 0.35;
  }
  /* 候选点：任意已有棋子周围 2 格以内的空点 */
  function candidates(b) {
    var out = [], i, x, y, dx, dy, nx, ny;
    for (i = 0; i < b.length; i++) {
      if (!b[i]) continue;
      x = i % N; y = (i - x) / N;
      for (dy = -2; dy <= 2; dy++) {
        for (dx = -2; dx <= 2; dx++) {
          if (!dx && !dy) continue;
          nx = x + dx; ny = y + dy;
          if (!inside(nx, ny)) continue;
          if (!b[idx(nx, ny)]) out.push(idx(nx, ny));
        }
      }
    }
    /* 去重 */
    var seen = {}, uniq = [];
    for (i = 0; i < out.length; i++) {
      if (seen[out[i]]) continue;
      seen[out[i]] = 1; uniq.push(out[i]);
    }
    return uniq;
  }
  /* 排序候选点：走子顺序 / 顶层决策都用它 */
  function ranked(b, me) {
    var opp = 3 - me;
    var xs = candidates(b), list = [], i, p, x, y, atk, def, mv;
    for (i = 0; i < xs.length; i++) {
      p = xs[i]; x = p % N; y = (p - x) / N;
      atk = pointScore(b, x, y, me);
      def = pointScore(b, x, y, opp);
      mv = atk + 0.9 * def;
      if (atk >= WIN) mv += WIN * 8;          /* 自己立刻成五 */
      else if (def >= WIN) mv += WIN * 7;     /* 必须堵对方的五 */
      else if (def >= 26000) mv += 300000;    /* 堵冲四 */
      list.push({ p: p, x: x, y: y, atk: atk, def: def, score: mv });
    }
    list.sort(function (a, c) { return c.score - a.score || a.p - c.p; });
    return list;
  }
  /* 单层搜索：找己方最佳一手（简单/普通难度与「求助」都用它） */
  function bestMoveSingle(b, me, limit) {
    if (!countStones(b)) return { p: idx(7, 7), win: false };
    var list = ranked(b, me);
    var top = list.slice(0, limit || 12), i, best = null;
    for (i = 0; i < top.length; i++) {
      b[top[i].p] = me;
      var w = isFive(b, top[i].x, top[i].y);
      var v = 2 * top[i].atk + 0.9 * top[i].def;
      b[top[i].p] = 0;
      if (w) return { p: top[i].p, win: true };
      if (!best || v > best.v) best = { p: top[i].p, win: false, v: v };
    }
    return best || { p: list.length ? list[0].p : idx(7, 7), win: false };
  }
  /* 极简 alpha-beta（深度 2/4），用于困难难度 */
  function alphabeta(b, depth, me, alpha, beta) {
    var w = checkWin(b);
    if (w) return w === me ? WIN + depth * 1000 : -(WIN + depth * 1000);
    if (depth <= 0) return 0;
    var list = ranked(b, me).slice(0, 8);
    if (!list.length) return 0;
    var bestVal = -Infinity, i, v;
    for (i = 0; i < list.length; i++) {
      b[list[i].p] = me;
      v = -alphabeta(b, depth - 1, 3 - me, -beta, -alpha);
      b[list[i].p] = 0;
      if (v > bestVal) bestVal = v;
      if (bestVal > alpha) alpha = bestVal;
      if (alpha >= beta) break;
    }
    return bestVal;
  }
  /* 对外统一入口：返回 {p,win,list}（list 已按分数排序，便于按难度加噪声） */
  function findBestMove(b, me, depth, limit) {
    if (!countStones(b)) return { p: idx(7, 7), win: false, list: [] };
    var list = ranked(b, me), i, x, y, v, w, top, out = [];
    top = list.slice(0, Math.min(limit || 8, 8));   /* 顶层最多 8 个候选：够强又能保证手机上够快 */
    if (!top.length) return { p: idx(7, 7), win: false, list: [] };
    for (i = 0; i < top.length; i++) {
      x = top[i].x; y = top[i].y;
      b[top[i].p] = me;
      w = isFive(b, x, y);
      if (w) { b[top[i].p] = 0; return { p: top[i].p, win: true, list: top }; }
      v = depth >= 4
        ? -alphabeta(b, depth - 1, 3 - me, -Infinity, Infinity)
        : (2 * top[i].atk + 0.9 * top[i].def);
      if (!isFinite(v)) v = -WIN * 10;
      b[top[i].p] = 0;
      out.push({ p: top[i].p, x: x, y: y, score: v });
    }
    out.sort(function (a, c) { return c.score - a.score || a.p - c.p; });
    return { p: out[0].p, win: false, list: out };
  }
  /* 按难度（含随机噪声）挑一手 */
  function pickMove(b, me, diff, rnd) {
    var d = DIFFS[diff] || DIFFS[1];
    var r = findBestMove(b, me, d.depth, 8);
    if (r.win || !r.list.length || d.noise <= 0) return r;
    if (rnd() < d.noise) {
      var k = 1 + Math.floor(rnd() * Math.max(1, d.alt - 1));
      var pick = r.list[Math.min(k, r.list.length - 1)];
      return { p: pick.p, win: false, list: r.list };
    }
    return r;
  }

  /* ============================================================
     应用
     ============================================================ */
  function createApp(phone) {
    var U = phone.utils;

    function mount(phoneApi, root, ctx) {
      injectCss();
      ctx.useFullBody();
      var store = ctx.store;

      /* ---------- 状态 ---------- */
      var board = newBoard();
      var turn = 1;               /* 1 黑（玩家） / 2 白（电脑） */
      var over = false, resultText = '';
      var stones = 0;
      var wins = toInt(store.get('wins', 0)), loses = toInt(store.get('loses', 0));
      var difficulty = toInt(store.get('difficulty', 1));
      if (difficulty > 2) difficulty = 0;
      var aiThinking = false, hintPos = -1;
      var history = [];           /* 落子顺序，供悔棋 */
      var metric = { x: 0, y: 0, size: 0, gap: 0 };
      var timers = [], rafId = 0, disposed = false;

      /* ---------- 定时器统一管理（退出时全部清掉，避免回调打到已销毁的界面） ---------- */
      function later(fn, ms) {
        var t = setTimeout(function () {
          var i = timers.indexOf(t);
          if (i >= 0) timers.splice(i, 1);
          if (!disposed) fn();
        }, ms);
        timers.push(t);
        return t;
      }
      function clearTimers() {
        for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
        timers = [];
      }

      /* ---------- 界面 ---------- */
      var wrap = U.el('div', 'gomoku-wrap');
      var hud = U.el('div', 'gomoku-hud');
      function infoCard(label, val) {
        var c = U.el('div', 'gomoku-card');
        c.appendChild(U.el('span', null, label));
        var b = U.el('b', null, val);
        c.appendChild(b);
        return { box: c, val: b };
      }
      var cTurn = infoCard('当前回合', '你（黑）');
      var cDiff = infoCard('难度', DIFFS[difficulty].name);
      var cScore = infoCard('战绩', wins + ' 胜 ' + loses + ' 负');
      hud.appendChild(cTurn.box);
      hud.appendChild(cDiff.box);
      hud.appendChild(cScore.box);

      var arena = U.el('div', 'gomoku-arena');
      var canvas = U.el('canvas', 'gomoku-canvas');
      canvas.width = 300; canvas.height = 300;
      var hintLayer = U.el('div', 'gomoku-hintLayer');
      var hintDot = U.el('div', 'gomoku-hintDot');
      hintDot.style.display = 'none';
      hintLayer.appendChild(hintDot);

      var overEl = U.el('div', 'gomoku-over');
      var obox = U.el('div', 'box');
      var otitle = U.el('b', null, '本局结束');
      var osub = U.el('small', null, '');
      var obtn = U.el('button', 'ui-btn', '再来一局');
      obtn.type = 'button';
      obtn.addEventListener('click', function () { restart(); });
      obox.appendChild(otitle);
      obox.appendChild(osub);
      obox.appendChild(obtn);
      overEl.appendChild(obox);

      arena.appendChild(canvas);
      arena.appendChild(hintLayer);
      arena.appendChild(overEl);

      var foot = U.el('div', 'gomoku-foot', '点棋盘落子 · 先连成 5 子者胜 · 求助可推荐下一步');
      wrap.appendChild(hud);
      wrap.appendChild(arena);
      wrap.appendChild(foot);
      root.appendChild(wrap);

      var g2d = canvas.getContext('2d');

      /* ---------- 标题栏按钮 ---------- */
      var hintBtn = ctx.addAction('💡 求助', function () { doHint(); });
      if (hintBtn) hintBtn.title = '推荐你（黑棋）的下一步';
      ctx.addAction('重开', function () { restart(); });

      /* ---------- 存档 ---------- */
      function save() {
        store.set('board', board.slice());
        store.set('turn', turn);
        store.set('over', over);
        store.set('wins', wins);
        store.set('loses', loses);
        store.set('difficulty', difficulty);
        store.set('history', history.slice());
      }
      function load() {
        var b = store.get('board', null);
        if (!b || b.length !== N * N) return false;
        var out = [], i, v;
        for (i = 0; i < N * N; i++) {
          v = toInt(b[i]);
          out.push(v === 1 || v === 2 ? v : 0);
        }
        if (!countStones(out)) return false;
        board = out;
        stones = countStones(out);
        turn = toInt(store.get('turn', 1)) === 2 ? 2 : 1;
        over = !!store.get('over', false);
        if (over) {
          var w = checkWin(board);
          resultText = w === 1 ? '你赢了' : (w === 2 ? '电脑赢了' : '本局结束');
          /* 存档里 over 但没有胜者：当作未结束，避免卡死 */
          if (!w) over = false;
        }
        var hs = store.get('history', null);
        if (hs && hs.length) history = hs.slice();
        return true;
      }

      /* ---------- 坐标换算 ---------- */
      function layout() {
        var aw = arena.clientWidth || 0;
        var ah = arena.clientHeight || 0;
        if (!aw || !ah) { aw = 300; ah = 300; }
        var size = Math.max(180, Math.floor(Math.min(aw, ah)));
        var gap = Math.round(size / (N + 0.6));
        var cell = gap;
        var origin = (size - cell * (N - 1)) / 2;
        metric.size = size; metric.gap = gap; metric.x = origin; metric.y = origin;
        var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        hintLayer.style.width = size + 'px';
        hintLayer.style.height = size + 'px';
        draw();
        placeHintDot();
      }
      function onResize() {
        if (rafId) return;
        rafId = requestAnimationFrame(function () { rafId = 0; layout(); });
      }
      window.addEventListener('resize', onResize);

      function posOf(x, y) {
        return { cx: metric.x + x * metric.gap, cy: metric.y + y * metric.gap };
      }
      function cellFromPoint(px, py) {
        var gx = Math.round((px - metric.x) / metric.gap);
        var gy = Math.round((py - metric.y) / metric.gap);
        if (!inside(gx, gy)) return -1;
        var c = posOf(gx, gy);
        var d = Math.sqrt((c.cx - px) * (c.cx - px) + (c.cy - py) * (c.cy - py));
        if (d > metric.gap * 0.62) return -1;
        return idx(gx, gy);
      }
      function localPoint(e) {
        var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
        var left = r && r.left ? r.left : 0, top = r && r.top ? r.top : 0;
        return { x: e.clientX - left, y: e.clientY - top };
      }

      /* ---------- 绘制 ---------- */
      function drawBoard() {
        var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
        g2d.setTransform(dpr, 0, 0, dpr, 0, 0);
        var s = metric.size, g = metric.gap, o = metric.x, i, j, p;
        /* 木色底 + 高光 */
        var grd = g2d.createLinearGradient(0, 0, s, s);
        grd.addColorStop(0, '#f7e3c2');
        grd.addColorStop(0.5, '#f0d5ab');
        grd.addColorStop(1, '#e8c795');
        g2d.fillStyle = grd;
        g2d.fillRect(0, 0, s, s);
        g2d.strokeStyle = 'rgba(120,80,40,.10)';
        g2d.lineWidth = 1;
        g2d.strokeRect(0.5, 0.5, s - 1, s - 1);
        /* 网格线 */
        g2d.strokeStyle = 'rgba(96,62,26,.62)';
        g2d.lineWidth = 1;
        for (i = 0; i < N; i++) {
          g2d.beginPath();
          g2d.moveTo(o, o + i * g); g2d.lineTo(o + (N - 1) * g, o + i * g);
          g2d.stroke();
          g2d.beginPath();
          g2d.moveTo(o + i * g, o); g2d.lineTo(o + i * g, o + (N - 1) * g);
          g2d.stroke();
        }
        /* 星位 */
        var stars = [[3, 3], [11, 3], [3, 11], [11, 11], [7, 7]];
        g2d.fillStyle = 'rgba(96,62,26,.75)';
        for (i = 0; i < stars.length; i++) {
          p = posOf(stars[i][0], stars[i][1]);
          g2d.beginPath();
          g2d.arc(p.cx, p.cy, Math.max(1.6, g * 0.10), 0, Math.PI * 2);
          g2d.fill();
        }
        /* 已有棋子 */
        for (i = 0; i < board.length; i++) {
          if (!board[i]) continue;
          j = i % N;
          drawStone(j, (i - j) / N, board[i], false);
        }
        /* 最后一手标记 */
        if (history.length && !over) {
          var last = history[history.length - 1];
          if (last && last >= 0 && board[last]) {
            var lx = last % N, ly = (last - lx) / N;
            var lp = posOf(lx, ly);
            g2d.strokeStyle = 'rgba(224,59,99,.9)';
            g2d.lineWidth = 2;
            g2d.beginPath();
            g2d.arc(lp.cx, lp.cy, g * 0.42, 0, Math.PI * 2);
            g2d.stroke();
          }
        }
      }
      function drawStone(x, y, who, shadow) {
        var p = posOf(x, y), r = metric.gap * 0.42;
        g2d.save();
        if (shadow) g2d.globalAlpha = 0.45;
        var grd = g2d.createRadialGradient(p.cx - r * 0.35, p.cy - r * 0.4, r * 0.15, p.cx, p.cy, r * 1.1);
        if (who === 1) {
          grd.addColorStop(0, '#6a7690');
          grd.addColorStop(0.45, '#2b3550');
          grd.addColorStop(1, '#0a0f1e');
        } else {
          grd.addColorStop(0, '#ffffff');
          grd.addColorStop(0.6, '#f2f5fb');
          grd.addColorStop(1, '#c8d0e0');
        }
        g2d.fillStyle = grd;
        g2d.beginPath();
        g2d.arc(p.cx, p.cy, r, 0, Math.PI * 2);
        g2d.fill();
        g2d.strokeStyle = who === 1 ? 'rgba(0,0,0,.35)' : 'rgba(120,130,160,.45)';
        g2d.lineWidth = 1;
        g2d.stroke();
        g2d.restore();
      }
      function draw() {
        if (disposed) return;
        drawBoard();
        if (aiThinking) {
          /* 电脑思考中的幽灵子：轻描淡写地提示一下它会落在这里 */
          var p = posOf(7, 7);
          g2d.save();
          g2d.globalAlpha = 0.18;
          g2d.fillStyle = '#5b648f';
          g2d.beginPath();
          g2d.arc(p.cx, p.cy, metric.gap * 0.18, 0, Math.PI * 2);
          g2d.fill();
          g2d.restore();
        }
      }
      function placeHintDot() {
        if (hintPos < 0) { hintDot.style.display = 'none'; return; }
        var x = hintPos % N, y = (hintPos - x) / N;
        var p = posOf(x, y), d = metric.gap * 0.92;
        hintDot.style.display = 'block';
        hintDot.style.left = (p.cx - d / 2) + 'px';
        hintDot.style.top = (p.cy - d / 2) + 'px';
        hintDot.style.width = d + 'px';
        hintDot.style.height = d + 'px';
      }

      /* ---------- 渲染文字信息 ---------- */
      function refreshHud() {
        cTurn.val.textContent = over ? resultText : (turn === 1 ? '你（黑）' : '电脑（白）');
        cDiff.val.textContent = DIFFS[difficulty].name;
        cScore.val.textContent = wins + ' 胜 ' + loses + ' 负';
        if (over) {
          otitle.textContent = resultText;
          osub.textContent = '共 ' + stones + ' 手 · 战绩 ' + wins + ' 胜 ' + loses + ' 负';
          overEl.classList.add('show');
        } else {
          overEl.classList.remove('show');
        }
      }

      /* ---------- 落子 ---------- */
      function place(p, who) {
        var x = p % N, y = (p - x) / N;
        if (board[p]) return false;
        board[p] = who;
        stones++;
        history.push(p);
        return true;
      }
      function humanTurn() {
        return !over && turn === 1 && !aiThinking;
      }
      function tryHumanMove(p) {
        if (!humanTurn()) return;
        if (p < 0 || board[p]) return;
        place(p, 1);
        hintPos = -1;
        placeHintDot();
        save();
        var w = checkWin(board);
        if (w === 1) { finish('你赢了'); return; }
        if (stones >= N * N) { finish('平局'); return; }
        turn = 2;
        refreshHud();
        draw();
        save();
        scheduleAi();
      }
      function scheduleAi() {
        if (over || turn !== 2) return;
        aiThinking = true;
        refreshHud();
        draw();
        later(function () {
          aiThinking = false;
          if (over || turn !== 2) return;
          var mv = pickMove(board.slice(), 2, difficulty, Math.random);
          var p = mv.p;
          if (board[p]) {
            /* 兜底：随机挑一个空点 */
            var free = [];
            for (var i = 0; i < board.length; i++) if (!board[i]) free.push(i);
            if (!free.length) { finish('平局'); return; }
            p = free[Math.floor(Math.random() * free.length)];
          }
          place(p, 2);
          var x = p % N, y = (p - x) / N;
          hintPos = -1;
          placeHintDot();
          var w = checkWin(board);
          if (w === 2) { finish('电脑赢了'); return; }
          if (stones >= N * N) { finish('平局'); return; }
          turn = 1;
          refreshHud();
          draw();
          save();
          phone.toast('电脑落子：' + coordName(x, y), 'info');
        }, 260 + Math.floor(Math.random() * 320));
      }
      function coordName(x, y) {
        return String.fromCharCode(65 + x) + (N - y);
      }
      function finish(text) {
        over = true;
        resultText = text;
        if (text === '你赢了') wins++;
        else if (text === '电脑赢了') loses++;
        aiThinking = false;
        hintPos = -1;
        placeHintDot();
        refreshHud();
        draw();
        save();
        phone.toast(text === '平局' ? '平局，棋盘满了' : text, text === '你赢了' ? 'ok' : (text === '电脑赢了' ? 'bad' : 'info'));
      }
      function restart() {
        clearTimers();
        board = newBoard();
        history = [];
        stones = 0;
        turn = 1;
        over = false;
        resultText = '';
        aiThinking = false;
        hintPos = -1;
        placeHintDot();
        refreshHud();
        draw();
        save();
      }

      /* ---------- 求助 ---------- */
      function doHint() {
        if (over) { phone.toast('本局已经结束了，重开一局再求助吧', 'info'); return; }
        if (turn !== 1 || aiThinking) { phone.toast('现在是电脑的回合，等它下完再求助', 'info'); return; }
        if (stones === 0) {
          hintPos = idx(7, 7);
          placeHintDot();
          phone.toast('开局推荐下天元（H8）', 'ok');
          return;
        }
        var r = findBestMove(board.slice(), 1, 4, 8);
        if (r.p == null) { phone.toast('暂时没有可推荐的点', 'info'); return; }
        hintPos = r.p;
        placeHintDot();
        var hx = r.p % N, hy = (r.p - hx) / N;
        phone.toast(r.win ? ('推荐：' + coordName(hx, hy) + ' —— 直接连成五子！') : ('推荐下一步：' + coordName(hx, hy)), 'ok');
      }

      /* ---------- 交互 ---------- */
      function onPointer(e) {
        if (!humanTurn()) return;
        if (e.button != null && e.button !== 0 && e.pointerType !== 'touch') return;
        var pt = localPoint(e);
        var p = cellFromPoint(pt.x, pt.y);
        if (p < 0) return;
        if (e.cancelable) e.preventDefault();
        tryHumanMove(p);
      }
      function onTouch(e) {
        if (!humanTurn()) return;
        var t = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : (e.touches && e.touches[0]);
        if (!t) return;
        if (e.cancelable) e.preventDefault();
        var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
        var left = r && r.left ? r.left : 0, top = r && r.top ? r.top : 0;
        var p = cellFromPoint(t.clientX - left, t.clientY - top);
        if (p >= 0) tryHumanMove(p);
      }
      canvas.addEventListener('pointerdown', onPointer);
      canvas.addEventListener('touchstart', onTouch, { passive: false });

      /* ---------- 悔棋：把自己的最后一手与电脑的应手一起撤掉 ---------- */
      function popStone() {
        var p = history.pop();
        board[p] = 0;
        stones--;
        return p;
      }
      function undo() {
        if (over) { phone.toast('本局已经结束了，重开一局吧', 'info'); return; }
        if (aiThinking) { phone.toast('电脑正在思考，稍等一下', 'info'); return; }
        if (!history.length) { phone.toast('还没有落子', 'info'); return; }
        var n = 0;
        while (history.length && n < 2) {
          var top = history[history.length - 1];
          if (n === 0 && board[top] === 2) { popStone(); n++; continue; }
          if (board[top] === 1) { popStone(); n++; break; }
          break;
        }
        turn = 1;
        hintPos = -1;
        placeHintDot();
        refreshHud();
        draw();
        save();
        phone.toast('已悔棋，轮到你了', 'info');
      }

      /* ---------- 键盘：U 悔棋 / H 求助 / R 重开 ---------- */
      ctx.onKey(function (e) {
        var k = String(e.key || '').toLowerCase();
        if (k === 'h') { e.preventDefault(); doHint(); }
        else if (k === 'r') { e.preventDefault(); restart(); }
        else if (k === 'u') {
          e.preventDefault();
          undo();
        }
      });

      ctx.onCleanup(function () {
        disposed = true;
        clearTimers();
        window.removeEventListener('resize', onResize);
        canvas.removeEventListener('pointerdown', onPointer);
        canvas.removeEventListener('touchstart', onTouch);
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      });

      /* ---------- 启动 ---------- */
      if (!load()) {
        board = newBoard();
        history = [];
        stones = 0;
        turn = 1;
        over = false;
        resultText = '';
      }
      layout();
      refreshHud();
      draw();
      placeHintDot();
      save();
      if (turn === 2 && !over) scheduleAi();

      /* 测试把手：内核注册时会浅拷贝定义（只保留标准字段），所以挂在 mount 函数上，
         放在 mount 内部才能读到局内状态 */
      mount.__test = {
        engine: function () {
          return {
            N: N, WIN: WIN, idx: idx, newBoard: newBoard, countStones: countStones,
            isFive: isFive, checkWin: checkWin, pointScore: pointScore,
            candidates: candidates, ranked: ranked, findBestMove: findBestMove, pickMove: pickMove
          };
        },
        state: function () {
          return {
            board: board.slice(), turn: turn, over: over, stones: stones,
            hintPos: hintPos, history: history.slice(),
            metric: { x: metric.x, y: metric.y, gap: metric.gap, size: metric.size }
          };
        }
      };
    }

    return {
      id: 'gomoku',
      name: '五子棋',
      icon: 'svg:target',
      desc: '与电脑对弈五子棋 · 可向 AI 求助下一步',
      order: 12,
      color: 'espresso',
      mount: mount
    };

  function seedRnd(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  function ridge(g, w, h, baseY, color, peaks) {
    var i;
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(0, h);
    g.lineTo(0, baseY);
    for (i = 0; i < peaks.length; i++) g.lineTo(w * peaks[i][0], baseY - h * peaks[i][1]);
    g.lineTo(w, baseY);
    g.lineTo(w, h);
    g.closePath();
    g.fill();
  }
  function glowCircle(g, x, y, r, inner, outer) {
    var gr = g.createRadialGradient(x, y, r * 0.15, x, y, r);
    gr.addColorStop(0, inner);
    gr.addColorStop(1, outer);
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y, r, 0, PI2);
    g.fill();
  }

  function drawSunset(g, w, h) {
    var sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#25235f');
    sky.addColorStop(0.30, '#6b3f86');
    sky.addColorStop(0.54, '#c95a72');
    sky.addColorStop(0.74, '#f0824f');
    sky.addColorStop(1, '#ffd88a');
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h);

    glowCircle(g, w * 0.52, h * 0.55, Math.min(w, h) * 0.42, 'rgba(255,236,170,.55)', 'rgba(255,160,96,0)');
    g.fillStyle = '#fff6cf';
    g.beginPath();
    g.arc(w * 0.52, h * 0.55, Math.min(w, h) * 0.125, 0, PI2);
    g.fill();

    var i, cy;
    for (i = 0; i < 4; i++) {
      cy = h * (0.15 + i * 0.07);
      g.fillStyle = 'rgba(255,224,198,' + (0.20 - i * 0.035).toFixed(3) + ')';
      g.beginPath();
      g.ellipse(w * (0.22 + i * 0.19), cy, w * (0.23 - i * 0.03), h * (0.010 + i * 0.002), 0, 0, PI2);
      g.fill();
    }

    ridge(g, w, h, h * 0.73, '#6a4f94', [[0.02, 0.10], [0.17, 0.30], [0.31, 0.15], [0.47, 0.33], [0.63, 0.17], [0.80, 0.29], [0.96, 0.11]]);
    ridge(g, w, h, h * 0.83, '#483a73', [[0.05, 0.10], [0.25, 0.25], [0.43, 0.11], [0.61, 0.27], [0.79, 0.13], [0.95, 0.21]]);
    ridge(g, w, h, h, '#29234f', [[0.10, 0.12], [0.33, 0.19], [0.53, 0.09], [0.73, 0.17], [0.91, 0.07]]);

    g.strokeStyle = 'rgba(30,24,60,.65)';
    g.lineWidth = Math.max(2, w * 0.004);
    g.lineCap = 'round';
    for (i = 0; i < 5; i++) {
      var bx = w * (0.18 + i * 0.13);
      var by = h * (0.12 + (i % 3) * 0.045);
      var bw = w * 0.022;
      g.beginPath();
      g.moveTo(bx - bw, by);
      g.quadraticCurveTo(bx - bw * 0.4, by - bw * 0.55, bx, by);
      g.quadraticCurveTo(bx + bw * 0.4, by - bw * 0.55, bx + bw, by);
      g.stroke();
    }
  }

  function drawNight(g, w, h) {
    var sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#080d26');
    sky.addColorStop(0.50, '#1a2150');
    sky.addColorStop(1, '#3a2a5e');
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h);

    var rnd = seedRnd(20240607);
    var i, j, x, y, r;
    for (i = 0; i < 110; i++) {
      x = rnd() * w;
      y = rnd() * h * 0.66;
      r = 0.6 + rnd() * 1.9;
      g.fillStyle = 'rgba(255,255,255,' + (0.20 + rnd() * 0.75).toFixed(2) + ')';
      g.beginPath();
      g.arc(x, y, r, 0, PI2);
      g.fill();
    }

    var mx = w * 0.76, my = h * 0.19, mr = Math.min(w, h) * 0.072;
    glowCircle(g, mx, my, mr * 3.1, 'rgba(255,248,210,.38)', 'rgba(255,248,210,0)');
    g.fillStyle = '#fff8d8';
    g.beginPath();
    g.arc(mx, my, mr, 0, PI2);
    g.fill();
    g.fillStyle = '#1a2150';
    g.beginPath();
    g.arc(mx + mr * 0.52, my - mr * 0.3, mr * 0.9, 0, PI2);
    g.fill();

    var base = h * 0.82;
    var bw, bx, bh, tone, wx, wy;
    for (i = 0; i < 15; i++) {
      bw = w * (0.048 + rnd() * 0.058);
      bx = (i / 15) * w * 1.03 - w * 0.012;
      bh = h * (0.10 + rnd() * 0.28);
      tone = rnd();
      g.fillStyle = 'rgb(' + Math.round(34 + tone * 46) + ',' + Math.round(42 + tone * 50) + ',' + Math.round(92 + tone * 70) + ')';
      g.fillRect(bx, base - bh, bw, bh);
      g.fillStyle = 'rgba(255,214,120,.72)';
      for (wy = base - bh + 12; wy < base - 10; wy += 17) {
        for (wx = bx + 7; wx < bx + bw - 8; wx += 13) {
          if (rnd() < 0.55) g.fillRect(wx, wy, 5, 8);
        }
      }
      if (rnd() < 0.3) {
        g.fillStyle = 'rgba(255,120,120,.85)';
        g.beginPath();
        g.arc(bx + bw / 2, base - bh - 7, 3, 0, PI2);
        g.fill();
      }
    }

    g.fillStyle = '#121834';
    g.fillRect(0, base, w, h - base);
    g.fillStyle = 'rgba(120,150,230,.16)';
    for (i = 0; i < 26; i++) {
      y = base + 8 + rnd() * (h - base - 10);
      g.fillRect(rnd() * w, y, w * (0.05 + rnd() * 0.16), 2.2);
    }
    g.fillStyle = 'rgba(255,214,120,.22)';
    for (i = 0; i < 10; i++) {
      x = w * (0.06 + i * 0.095);
      g.fillRect(x, base + 4, w * 0.035, h - base - 6);
    }
  }

  function drawGarden(g, w, h) {
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#fff6dd');
    bg.addColorStop(1, '#ffe4bd');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);

    glowCircle(g, w * 0.22, h * 0.17, Math.min(w, h) * 0.23, 'rgba(255,236,150,.95)', 'rgba(255,220,130,0)');
    g.fillStyle = '#ffd166';
    g.beginPath();
    g.arc(w * 0.22, h * 0.17, Math.min(w, h) * 0.078, 0, PI2);
    g.fill();

    var i, cx, cy;
    for (i = 0; i < 3; i++) {
      cx = w * (0.15 + i * 0.34);
      cy = h * (0.15 + (i % 2) * 0.07);
      g.fillStyle = 'rgba(255,255,255,.85)';
      g.beginPath();
      g.arc(cx, cy, w * 0.045, 0, PI2);
      g.arc(cx + w * 0.05, cy - w * 0.012, w * 0.035, 0, PI2);
      g.arc(cx + w * 0.09, cy + w * 0.006, w * 0.028, 0, PI2);
      g.fill();
    }

    ridge(g, w, h, h * 0.62, '#a8d8a0', [[0.10, 0.09], [0.30, 0.17], [0.52, 0.07], [0.72, 0.15], [0.92, 0.06]]);
    ridge(g, w, h, h * 0.74, '#6fbd7c', [[0.06, 0.06], [0.26, 0.13], [0.46, 0.05], [0.68, 0.12], [0.88, 0.05]]);
    ridge(g, w, h, h, '#4c9a63', [[0.14, 0.05], [0.36, 0.10], [0.58, 0.04], [0.80, 0.09], [0.96, 0.03]]);

    var rnd = seedRnd(77021);
    var colors = ['#ff7a8a', '#ffb457', '#a98bff', '#5cc8ff', '#ffe066', '#ff9ec4'];
    var stemH, fx, fy, col, rr, k, ang;
    for (i = 0; i < 30; i++) {
      fx = w * (0.05 + rnd() * 0.9);
      fy = h * (0.58 + rnd() * 0.40);
      stemH = h * (0.045 + rnd() * 0.09);
      g.strokeStyle = '#357a4d';
      g.lineWidth = Math.max(2, w * 0.0045);
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(fx, fy);
      g.lineTo(fx, fy - stemH);
      g.stroke();
      col = colors[Math.floor(rnd() * colors.length)];
      rr = w * (0.010 + rnd() * 0.011);
      for (k = 0; k < 5; k++) {
        ang = (k / 5) * PI2 + rnd() * 0.2;
        g.fillStyle = col;
        g.beginPath();
        g.arc(fx + Math.cos(ang) * rr, fy - stemH + Math.sin(ang) * rr, rr * 0.85, 0, PI2);
        g.fill();
      }
      g.fillStyle = '#fff3b0';
      g.beginPath();
      g.arc(fx, fy - stemH, rr * 0.7, 0, PI2);
      g.fill();
    }
  }

  var SAMPLES = [
    /* 尺寸不用太大：底板最宽约 340 CSS px，×2 的 DPR 也就 680 物理像素，
       720px 左右足够清晰，同时把三张示例图的 Canvas 内存压在 8 MB 以内。 */
    { key: 'sunset', name: '晚霞山峦', w: 720, h: 960, draw: drawSunset },
    { key: 'night', name: '夜色城市', w: 960, h: 720, draw: drawNight },
    { key: 'garden', name: '几何花园', w: 840, h: 840, draw: drawGarden }
  ];
  var sampleCache = {};
  function sampleFor(key) {
    var def = null, i;
    for (i = 0; i < SAMPLES.length; i++) if (SAMPLES[i].key === key) def = SAMPLES[i];
    if (!def) def = SAMPLES[0];
    if (sampleCache[def.key]) return sampleCache[def.key];
    var cv = document.createElement('canvas');
    cv.width = def.w;
    cv.height = def.h;
    var g = cv.getContext('2d');
    try {
      if (g) def.draw(g, def.w, def.h);
    } catch (e) {
      if (g) { g.fillStyle = '#dfe7f6'; g.fillRect(0, 0, def.w, def.h); }
    }
    var made = { key: def.key, name: def.name, src: cv, w: def.w, h: def.h };
    sampleCache[def.key] = made;
    return made;
  }

      /* ---------------- 尺寸 / 视口 ---------------- */
      function dpr() {
        var v = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
        v = Number(v);
        if (!isFinite(v) || v <= 0) v = 1;
        return Math.min(2, Math.max(1, v));
      }
      function stageSize() {
        var w = stage.clientWidth || 0, h = stage.clientHeight || 0;
        if (!w || !h) { w = wrap.clientWidth || 0; h = wrap.clientHeight || 0; }
        if (!w || !h) { w = 320; h = 400; }             /* 首帧 / 测试环境兜底 */
        return { w: Math.max(80, Math.round(w)), h: Math.max(80, Math.round(h)) };
      }
      function applyCanvasSize() {
        var pr = dpr();
        canvas.width = Math.max(1, Math.round(S.stageW * pr));
        canvas.height = Math.max(1, Math.round(S.stageH * pr));
        canvas.style.width = S.stageW + 'px';
        canvas.style.height = S.stageH + 'px';
        if (g2d && g2d.setTransform) g2d.setTransform(pr, 0, 0, pr, 0, 0);
      }
      function centerView() {
        S.panX = Math.round((S.stageW - S.boardW * S.zoom) / 2);
        S.panY = Math.round((S.stageH - S.boardH * S.zoom) / 2);
      }
      function clampPan() {
        var bw = S.boardW * S.zoom, bh = S.boardH * S.zoom;
        if (bw <= S.stageW) S.panX = Math.round((S.stageW - bw) / 2);
        else S.panX = Math.round(clampNum(S.panX, S.stageW - bw, 0));
        if (bh <= S.stageH) S.panY = Math.round((S.stageH - bh) / 2);
        else S.panY = Math.round(clampNum(S.panY, S.stageH - bh, 0));
      }
      function defaultZoomFor(n) {
        if (n >= 500) return 2.2;
        if (n >= 200) return 1.5;
        if (n >= 100) return 1.25;

      function setZoom(z, ax, ay) {
        z = clampNum(Math.round(z * 100) / 100, 1, 8);
        if (Math.abs(z - S.zoom) < 0.005) { updateZoomLabel(); return; }
        var cx = (typeof ax === 'number' && isFinite(ax)) ? ax : S.stageW / 2;
        var cy = (typeof ay === 'number' && isFinite(ay)) ? ay : S.stageH / 2;
        var bx = (cx - S.panX) / S.zoom;
        var by = (cy - S.panY) / S.zoom;
        S.zoom = z;
        S.panX = cx - bx * z;
        S.panY = cy - by * z;

      function resetZoom() { setZoom(1, S.stageW / 2, S.stageH / 2); }
      function zoomStep(dir) {
        if (!S.pieces.length) return;

      function updateZoomLabel() {
        btnZoomLabel.textContent = Math.round(S.zoom * 100) + '%';
